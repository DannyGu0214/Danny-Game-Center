    prompt: "Semi-realistic painterly digital oil portrait, bust shot, three-quarter view, of a confident young man in his twenties, an Age of Sail sea captain from a Southern European port town. Short dark brown hair, sun-tanned skin, bright determined eyes, light stubble, a former fast mail rider turned sailor. Deep sea-blue (#25506f) long captain's coat with brass buttons over a linen shirt, tricorn hat optional. Warm sunset side lighting, softly blurred harbor docks and ship masts in the background, background darker and less saturated than the subject. Face and shoulders within the vertical center 62% of the frame. Visible brush strokes, storybook game illustration. No text, no logo, no watermark, no border, no weapons."
