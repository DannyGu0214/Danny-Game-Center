<!doctype html>
<meta charset="utf-8">
<title>배 점검표</title>
<style>body{margin:0;background:#2b86a0}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// 방향 8개 × 상태(전체 돛 좌현 바람·우현 바람·맞바람 펄럭임·돛 내림 + 노 젓기)를 한 장에 그린다. ?zoom=10
import * as SA from '../art-ship.js';
import { VIEW } from '../data.js';
const q = new URLSearchParams(location.search), zoom = Number(q.get('zoom')) || 10;
const cols = 8, rows = [
  { name: '돛 전체(우현 바람)', sailNow: 1, boom: -0.6, luff: false, heel: 0.2, row: false },
  { name: '돛 전체(좌현 바람)', sailNow: 1, boom: 0.6, luff: false, heel: -0.2, row: false },
  { name: '줄임', sailNow: 0.55, boom: 0.9, luff: false, heel: -0.08, row: false },
  { name: '맞바람 펄럭임', sailNow: 1, boom: 0.1, luff: true, heel: 0, row: false },
  { name: '돛 내림 + 노', sailNow: 0, boom: 0.15, luff: false, heel: 0, row: true },
];
const cw = 25 * zoom, ch = 26 * zoom, dpr = 2, cv = document.getElementById('c');
cv.width = cols * cw * dpr; cv.height = rows.length * ch * dpr; cv.style.width = cols * cw + 'px';
const g = cv.getContext('2d');
const sprite = SA.bakeShip({ hull: q.get('hull') || 'sloop', mods: q.get('hull') ? [{ id: 'oar', col: 0, row: 2, rot: 0 }, { id: q.get('hull') === 'rowboat' ? 'mast_s' : 'mast_m', col: 1, row: 1, rot: 0 }] : [{ id: 'mast_m', col: 1, row: 1, rot: 0 }, { id: 'cabin', col: 0, row: 2, rot: 0 }, { id: 'oar', col: 1, row: 5, rot: 0 }], paint: { hull: 0, sail: 0, flag: 0 }, decor: [] });
g.fillStyle = '#2b86a0'; g.fillRect(0, 0, cv.width, cv.height);
rows.forEach((r, j) => {
  for (let i = 0; i < cols; i++) {
    const h = i / cols * Math.PI * 2, bx = (i + 0.5) * cw, by = (j + 0.72) * ch, pitch = 0, bob = 0, heel = r.heel;
    const P = SA.makeProjector(bx, by, h, heel, pitch, zoom, bob);
    const st = { P, h, heel, pitch, bob, sailNow: r.sailNow, boom: r.boom, luff: r.luff, t: 1.3, row: r.row, rowPhase: 0.9 + i * 0.6, flagFrom: 0.4, rudder: 0.3, capX: r.row ? sprite.oar : sprite.hull.helmX, crew: [] };
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    SA.drawShipOnWater(g, sprite, st, zoom, bx, by);
    SA.drawShip(g, sprite, st, zoom, bx, by);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  g.fillStyle = '#fff'; g.font = '13px system-ui'; g.fillText(r.name, 8, j * ch + 18);
});
void VIEW;
</script>
