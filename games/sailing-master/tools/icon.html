<!doctype html>
<!-- 앱 아이콘 그리기: ?s=크기(px)&m=1(마스커블: 가운데 80% 안에만 그림). 헤드리스 Chrome으로 찍어 icons/에 저장한다(README 참고). -->
<meta charset="utf-8">
<style>html, body { margin: 0; overflow: hidden; background: #000; } canvas { display: block; }</style>
<canvas id="c"></canvas>
<script type="module">
import * as SA from '../art-ship.js';
const q = new URLSearchParams(location.search), S = Number(q.get('s') || 512), mask = q.get('m') === '1';
const c = document.getElementById('c');
c.width = S; c.height = S; c.style.width = S + 'px'; c.style.height = S + 'px';
const g = c.getContext('2d'), u = S / 512;
const sky = g.createLinearGradient(0, 0, 0, S);
sky.addColorStop(0, '#ffd9a0'); sky.addColorStop(0.42, '#f6c68a'); sky.addColorStop(0.46, '#3a9fb4'); sky.addColorStop(1, '#1f7392');
g.fillStyle = sky; g.fillRect(0, 0, S, S);
g.fillStyle = '#fff3cf'; g.beginPath(); g.arc(150 * u, 150 * u, 52 * u, 0, Math.PI * 2); g.fill();
g.fillStyle = '#7fa867'; g.beginPath(); g.moveTo(0, 225 * u); g.quadraticCurveTo(120 * u, 175 * u, 240 * u, 222 * u); g.quadraticCurveTo(380 * u, 190 * u, S, 228 * u); g.lineTo(S, 240 * u); g.lineTo(0, 240 * u); g.fill();
g.strokeStyle = 'rgba(235,252,250,.5)'; g.lineWidth = 4 * u; g.lineCap = 'round';
for (const [x, y, w] of [[70, 320, 50], [390, 300, 44], [120, 430, 60], [400, 410, 50], [260, 465, 40]]) { g.beginPath(); g.moveTo((x - w) * u, y * u); g.quadraticCurveTo(x * u, (y - 14) * u, (x + w) * u, y * u); g.stroke(); }
const ship = { hull: 'sloop', mods: [{ id: 'mast_m', col: 1, row: 1, rot: 0 }, { id: 'cabin', col: 0, row: 2, rot: 0 }], paint: { hull: 0, sail: 0, flag: 0 }, decor: [] };
const sprite = SA.bakeShip(ship);
const k = mask ? 0.78 : 1, zoom = 25 * u * k, bx = S / 2 + 12 * u, by = S * (mask ? 0.73 : 0.78), h = -2.72;
const st = { h, heel: 0.1, pitch: 0, bob: 0, sailNow: 1, boom: 0.65, luff: false, t: 1.2, row: false, rowPhase: 0, flagFrom: 0.4, rudder: 0, capX: -3.1, crew: [] };
st.P = SA.makeProjector(bx, by, h, st.heel, 0, zoom, 0);
SA.drawShipOnWater(g, sprite, st, zoom, bx, by);
SA.drawShip(g, sprite, st, zoom, bx, by);
document.title = 'ready';
</script>
