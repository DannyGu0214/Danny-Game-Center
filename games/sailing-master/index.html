<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sailing Master</title>
<meta name="theme-color" content="#123a4c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sailing Master">
<style>
:root { color-scheme: dark; --ink: #10303e; --panel: rgba(13,42,56,.84); --sheet: #12303f; --card: #1a4052; --line: rgba(190,226,232,.22); --text: #f1f6f2; --muted: #a6c4cb; --on: #f2c14e; --bad: #f08a6e; --ok: #8fdc9a; --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --bar: calc(50px + var(--safe-b)); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; color: var(--text); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; user-select: none; -webkit-user-select: none; overscroll-behavior: none; word-break: keep-all; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .45; }
input { font: inherit; user-select: text; -webkit-user-select: text; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

#hud { position: absolute; left: 10px; right: 10px; top: calc(8px + var(--safe-t)); display: grid; gap: 6px; pointer-events: none; }
#hudTop { display: flex; gap: 6px; align-items: stretch; }
#windCard { display: flex; align-items: center; gap: 7px; padding: 4px 10px 4px 5px; }
#compass { width: 40px; height: 40px; position: relative; border-radius: 50%; background: rgba(255,255,255,.08); flex: none; }
#compass span { position: absolute; left: 50%; top: 1px; transform: translateX(-50%); font-size: 8px; color: var(--muted); line-height: 1; }
#arrow { position: absolute; inset: 0; transition: transform .4s linear; }
.num { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.sub { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.2; }
#speedCard { padding: 5px 10px; display: flex; flex-direction: column; justify-content: center; min-width: 62px; }
#dateCard { padding: 5px 10px; display: flex; flex-direction: column; justify-content: center; flex: 1; min-width: 0; }
.iconBtn { width: 38px; pointer-events: auto; font-size: 17px; flex: none; }
#chips { display: flex; gap: 8px; padding: 5px 10px; align-items: center; justify-content: space-between; font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
#chips b { font-weight: 600; }
#chips .low { color: var(--bad); }

#hint { position: absolute; left: 50%; top: calc(104px + var(--safe-t)); transform: translateX(-50%); max-width: calc(100% - 28px); width: max-content; padding: 7px 13px; border-radius: 14px; background: rgba(9,30,42,.8); font-size: 13.5px; text-align: center; opacity: 0; transition: opacity .3s; pointer-events: none; }
#hint.on { opacity: 1; }
#hint.warn { background: rgba(120,40,22,.9); }
#toasts { position: absolute; right: 10px; top: calc(104px + var(--safe-t)); display: grid; gap: 4px; justify-items: end; pointer-events: none; }
.toast { padding: 3px 9px; border-radius: 10px; background: rgba(9,30,42,.72); font-size: 12.5px; animation: toast 1.7s forwards; }
@keyframes toast { 0% { opacity: 0; transform: translateY(6px);} 12% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; } }

#panel { position: absolute; left: 0; right: 0; bottom: var(--bar); padding: 8px 10px 0; background: linear-gradient(to top, rgba(10,34,46,.95) 70%, rgba(10,34,46,0)); }
#context { display: flex; justify-content: center; gap: 8px; margin-bottom: 7px; min-height: 0; }
#context:empty { margin: 0; }
#context button { padding: 9px 16px; background: var(--on); color: #203038; font-weight: 700; border-radius: 12px; font-size: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
/* 돛·노·키를 한 줄에: 항해 화면을 더 보여 주려고(2026-11-02 대니님 요청) */
#controls { display: flex; gap: 6px; height: 44px; align-items: stretch; }
.seg { display: grid; grid-template-columns: auto repeat(3, minmax(30px, 34px)); align-items: stretch; border-radius: 12px; overflow: hidden; flex: none; }
.seg .lab { display: flex; align-items: center; padding: 0 3px 0 5px; font-size: 13px; }
.seg button { font-size: 11.5px; border-left: 1px solid var(--line); }
.seg button.on { background: var(--on); color: #203038; font-weight: 700; }
#oar { flex: none; width: 44px; font-size: 13px; border-radius: 12px; padding: 0; line-height: 1.05; }
#oar small { display: block; font-size: 10.5px; }
#oar.on { background: var(--on); color: #203038; font-weight: 700; border-color: var(--on); }
#rudderWrap { position: relative; flex: 1; min-width: 96px; touch-action: none; border-radius: 12px; }
#rudderWrap .lab { position: absolute; font-size: 10.5px; color: var(--muted); top: 50%; transform: translateY(-50%); pointer-events: none; }
#track { position: absolute; left: 20px; right: 20px; top: 50%; height: 4px; margin-top: -2px; background: rgba(255,255,255,.2); border-radius: 2px; }
#notch { position: absolute; left: 50%; top: -5px; width: 2px; height: 14px; background: rgba(255,255,255,.45); margin-left: -1px; }
#knob { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: #f5eedd; color: #3a3224; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.35); pointer-events: none; }
#rudderWrap.auto #knob { background: #b9d7d8; }
/* 아래 메뉴: 어느 화면에서든 늘 보인다(2026-11-02 대니님 요청) */
#tabs { position: absolute; left: 0; right: 0; bottom: 0; height: var(--bar); padding: 6px 10px calc(8px + var(--safe-b)); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; background: #0a222e; }
#tabs button { height: 36px; border-radius: 11px; font-size: 13px; background: rgba(255,255,255,.08); white-space: nowrap; }
#tabs button.on { background: var(--on); color: #203038; font-weight: 700; }

#sheet { position: absolute; left: 0; right: 0; bottom: var(--bar); top: calc(92px + var(--safe-t)); background: var(--sheet); border-radius: 18px 18px 0 0; display: none; flex-direction: column; box-shadow: 0 -6px 24px rgba(0,0,0,.4); }
#sheet.on { display: flex; }
#sheetHead { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
#sheetHead h2 { margin: 0; font-size: 18px; flex: 1; min-width: 0; }
#sheetClose { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.1); font-size: 16px; }
#sheetTabs { display: flex; gap: 6px; padding: 0 14px 8px; overflow-x: auto; flex: none; }
#sheetTabs button { padding: 7px 12px; border-radius: 10px; background: rgba(255,255,255,.08); font-size: 13.5px; white-space: nowrap; }
#sheetTabs button.on { background: var(--on); color: #203038; font-weight: 700; }
#sheetBody { flex: 1; overflow-y: auto; padding: 2px 14px 16px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
#sheetFoot { padding: 10px 14px; border-top: 1px solid var(--line); display: none; gap: 8px; }
#sheetFoot.on { display: flex; }
.big { flex: 1; padding: 13px; border-radius: 12px; background: var(--on); color: #203038; font-weight: 700; font-size: 15.5px; }
.ghost { padding: 13px 14px; border-radius: 12px; background: rgba(255,255,255,.1); font-size: 14px; }
.row { background: var(--card); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
.row .grow { flex: 1; min-width: 0; }
.row .ttl { font-weight: 600; font-size: 14.5px; }
.row .txt { color: var(--muted); font-size: 12.5px; line-height: 1.4; margin-top: 2px; }
.row .act { padding: 8px 12px; border-radius: 10px; background: var(--on); color: #203038; font-weight: 700; font-size: 13.5px; white-space: nowrap; flex: none; }
.row .act.off { background: rgba(255,255,255,.14); color: var(--muted); font-weight: 500; }
.note { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0 0 10px; }
.check { font-size: 13.5px; line-height: 1.7; }
.check .ok { color: var(--ok); } .check .no { color: var(--bad); } .check .warn { color: var(--on); }
.h3 { font-size: 13px; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }

#chart { width: 100%; display: block; border-radius: 12px; touch-action: none; background: #0d2a38; }
.days { display: flex; gap: 5px; margin: 8px 0; }
.days div { flex: 1; background: var(--card); border-radius: 9px; padding: 5px 2px; text-align: center; font-size: 11.5px; line-height: 1.35; }

#plan { display: block; width: 100%; touch-action: none; border-radius: 12px; background: #0f3a4e; }
.gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 12px; margin: 10px 0; font-size: 12.5px; }
.gauges b { float: right; font-variant-numeric: tabular-nums; }
.gauges .bad b { color: var(--bad); }
.palette { display: flex; gap: 7px; overflow-x: auto; padding: 4px 0 8px; -webkit-overflow-scrolling: touch; touch-action: pan-x; }
.mod { flex: none; width: 104px; background: var(--card); border-radius: 11px; padding: 8px; text-align: left; border: 2px solid transparent; }
.mod.on { border-color: var(--on); }
.mod.lock { opacity: .45; }
.mod .ic { font-size: 18px; }
.mod .nm { font-size: 12.5px; font-weight: 600; margin-top: 1px; }
.mod .ct { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); }
.sw.on { border: 3px solid var(--on); }
#nameInput { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.2); color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.sp { background: var(--card); border-radius: 11px; padding: 6px; text-align: center; font-size: 12px; }
.sp canvas { width: 100%; height: 58px; display: block; }
.sp.unk { color: var(--muted); }

#overlay { position: absolute; inset: 0; background: rgba(6,24,34,.72); display: none; align-items: center; justify-content: center; padding: 22px; }
#overlay.on { display: flex; }
#ovBox { background: var(--sheet); border-radius: 18px; padding: 20px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
#ovBox h3 { margin: 0 0 8px; font-size: 20px; }
#ovBox p { margin: 0 0 8px; color: #d3e4e6; font-size: 14px; line-height: 1.55; }
#ovBox .big { width: 100%; margin-top: 10px; }

#title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(to bottom, rgba(10,44,62,.78), rgba(10,44,62,.34) 45%, rgba(10,44,62,.78)); }
#title h1 { margin: 0; font-size: 42px; letter-spacing: .01em; font-weight: 800; text-shadow: 0 3px 16px rgba(0,0,0,.35); }
#title p { margin: 10px 0 0; color: #d8ebec; font-size: 15px; }
#title .go { margin-top: 30px; font-size: 16px; font-weight: 700; color: var(--on); animation: blink 1.8s infinite; }
#title .tag { position: absolute; bottom: calc(26px + var(--safe-b)); font-size: 12px; color: var(--muted); }
@keyframes blink { 50% { opacity: .35; } }
body.intro #hud, body.intro #panel, body.intro #tabs { visibility: hidden; }
#fps { position: absolute; right: 12px; top: calc(100px + var(--safe-t)); font: 11px ui-monospace, monospace; background: rgba(0,0,0,.55); padding: 3px 6px; border-radius: 6px; display: none; }
</style>
</head>
<body class="intro">
<canvas id="view"></canvas>

<div id="hud">
  <div id="hudTop">
    <div class="card" id="windCard">
      <div id="compass"><span>북</span>
        <svg id="arrow" viewBox="0 0 46 46"><path d="M23 9 L30 30 L23 25 L16 30 Z" fill="#9fd9ea"/></svg>
      </div>
      <div><div class="num" id="windNum">0</div><div class="sub" id="windDir">바람</div></div>
    </div>
    <div class="card" id="speedCard"><div class="num" id="spdNum">0.0</div><div class="sub">노트</div></div>
    <div class="card" id="dateCard"><div class="num" id="dateNum" style="font-size:13.5px"></div><div class="sub" id="regionName"></div></div>
    <button class="card iconBtn" id="mus" aria-label="음악">🎵</button>
    <button class="card iconBtn" id="snd" aria-label="소리">🔊</button>
  </div>
  <div class="card" id="chips"></div>
</div>
<div id="hint"></div>
<div id="toasts"></div>
<div id="fps"></div>

<div id="panel">
  <div id="context"></div>
  <div id="controls">
    <div class="seg card" id="sailSeg">
      <span class="lab" aria-label="돛">⛵</span>
      <button data-lv="0">내림</button><button data-lv="1">줄임</button><button data-lv="2">전체</button>
    </div>
    <button class="card" id="oar" aria-label="노">🚣<small>노</small></button>
    <div class="card" id="rudderWrap" aria-label="키">
      <span class="lab" style="left:5px">좌</span><span class="lab" style="right:5px">우</span>
      <div id="track"><div id="notch"></div></div>
      <div id="knob">☸</div>
    </div>
  </div>
</div>

<div id="sheet">
  <div id="sheetHead"><h2 id="sheetTitle"></h2><button id="sheetClose" aria-label="닫기">✕</button></div>
  <div id="sheetTabs"></div>
  <div id="sheetBody"></div>
  <div id="sheetFoot"></div>
</div>

<div id="tabs"></div>

<div id="overlay"><div id="ovBox"></div></div>

<div id="title">
  <h1>Sailing Master</h1>
  <p>작은 호수에서 시작하는 항해</p>
  <div class="go" id="titleGo">화면을 눌러 시작</div>
  <div class="tag">M1 담수 · Danny Soft</div>
</div>

<script type="module">
import * as G from './logic.js';
import * as A from './art.js';
import * as SA from './art-ship.js';
import * as SH from './ship.js';
import { createCreatures, drawSpeciesIcon } from './creatures.js';
import { createSound } from './sound.js';
import { createMusic } from './music.js';
import { worldOf } from './world.js';
import { VIEW, NO_GO, HULLS, HULL_ORDER, MODULES, ROLES, RES, SPECIES, REGIONS, REGION_ORDER, ACHIEVEMENTS, TITLES, DECOR, PAINTS, CAL } from './data.js';

const $ = (id) => document.getElementById(id);
const view = $('view'), ctx = view.getContext('2d', { alpha: false });
const query = new URLSearchParams(location.search);
const SAVE_KEY = 'sailing-master-v1', AUDIO_KEY = 'sailing-master-audio';

// ── 저장 ──
function loadSave() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch { return null; }
  if (!raw) return null;
  const s = G.deserialize(raw);
  if (!s) { try { localStorage.setItem(SAVE_KEY + '.bad', raw); } catch { /* 무시 */ } }
  return s;
}
function save() { if (!started) return; try { localStorage.setItem(SAVE_KEY, G.serialize(S)); } catch { /* 저장 불가 환경에서도 게임은 계속 */ } }

const saved = loadSave();
let S = saved || G.newGame(Number(query.get('seed')) || (Date.now() % 100000));
let sc = A.createScene(S.region, G.findsOf(S)), creatures = createCreatures(worldOf(S.region)), sprite = SA.bakeShip(S.ship), bakedRev = S.rev;
const wake = new A.Wake();
const snd = createSound(), music = createMusic();
music.setRegion(S.region);
try { const a = JSON.parse(localStorage.getItem(AUDIO_KEY) || '{}'); if (a.snd === false) { snd.setOn(false); $('snd').textContent = '🔇'; } if (a.mus === false) { music.setOn(false); $('mus').style.opacity = 0.45; } } catch { /* 무시 */ }
const saveAudio = () => { try { localStorage.setItem(AUDIO_KEY, JSON.stringify({ snd: snd.on, mus: music.on })); } catch { /* 무시 */ } };

let W = 0, H = 0, DPR = 1;
const cam = { x: S.boat.x, y: S.boat.y, zoom: Number(query.get('zoom')) || VIEW.zoomDefault, cy: 0 };
const pan = { x: 0, y: 0, idle: 99 };
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  view.width = Math.round(W * DPR); view.height = Math.round(H * DPR);
  sc.patterns = null; sc.bakedAt = null; sc.buf = null;
  cam.cy = H * 0.46;
}
window.addEventListener('resize', resize);
resize();
const toWorld = (sx, sy) => [cam.x + (sx - W / 2) / cam.zoom, cam.y + (sy - cam.cy) / (cam.zoom * VIEW.tiltY)];
const fmt = (o) => Object.entries(o).filter(([, v]) => v).map(([k, v]) => `${RES[k].icon}${v}`).join(' ') || '없음';

// ── 시작 ──
let started = false, paused = false;
$('titleGo').textContent = saved ? '화면을 눌러 이어 하기' : '화면을 눌러 시작';
$('title').addEventListener('pointerdown', () => {
  started = true; $('title').style.display = 'none'; document.body.classList.remove('intro');
  snd.unlock(); music.start(snd.ac);
  if (S.disaster) showDisaster(S.disaster.cause);
  else if (S.docked) { openPort(); if (!saved) overlay('<h3>🌅 갈대 나루</h3><p>뗏목과 노 한 쌍으로 시작해요.</p><p>물에 뜬 목재와 천을 건져 항구로 가져오면 더 큰 배를 지을 수 있어요.</p>', '알겠어요', null); } else showHint('물을 탭하거나 아래 키로 몰아요', 4);
});

// ── 안내 ──
let hintT = 0;
function showHint(text, sec = 3, warn = false) { const h = $('hint'); h.textContent = text; h.classList.add('on'); h.classList.toggle('warn', warn); hintT = sec; }
function toast(text) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = text; $('toasts').append(t); setTimeout(() => t.remove(), 1700); }
function overlay(html, btn, fn) {
  const box = $('ovBox'); box.innerHTML = html;
  const b = document.createElement('button'); b.className = 'big'; b.textContent = btn; box.append(b);
  b.addEventListener('click', () => { $('overlay').classList.remove('on'); fn && fn(); });
  $('overlay').classList.add('on');
}
const overlayOpen = () => $('overlay').classList.contains('on');

// ── 조종 버튼 ──
function syncButtons() {
  const st = G.stats(S), lv = S.cap.then && S.cap.then.type === 'sail' ? S.cap.then.level : S.boat.sailLevel;
  for (const b of $('sailSeg').querySelectorAll('button')) { b.classList.toggle('on', Number(b.dataset.lv) === lv); b.disabled = !st.sailArea; }
  $('oar').classList.toggle('on', S.boat.row || !!(S.cap.then && S.cap.then.type === 'row'));
  $('oar').disabled = !st.oars;
}
$('sailSeg').addEventListener('pointerdown', (e) => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (G.setSail(S, Number(b.dataset.lv))) { snd.play(Number(b.dataset.lv) ? 'sail' : 'flap'); syncButtons(); }
});
$('oar').addEventListener('pointerdown', () => { if ($('oar').disabled) return; G.setRow(S, !S.boat.row); syncButtons(); });
$('snd').addEventListener('pointerdown', () => { snd.unlock(); snd.setOn(!snd.on); $('snd').textContent = snd.on ? '🔊' : '🔇'; saveAudio(); });
$('mus').addEventListener('pointerdown', () => { snd.unlock(); music.start(snd.ac); music.setOn(!music.on); $('mus').style.opacity = music.on ? 1 : 0.45; saveAudio(); });

// 키 슬라이더: 끄는 동안만 돌고, 놓으면 가운데로
const wrap = $('rudderWrap'), knob = $('knob');
let rudderPtr = null;
const KNOB_MARGIN = 20;
function rudderFrom(e) { const r = wrap.getBoundingClientRect(), half = r.width / 2 - KNOB_MARGIN; return Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / half)); }
wrap.addEventListener('pointerdown', (e) => { rudderPtr = e.pointerId; wrap.setPointerCapture(e.pointerId); G.setRudder(S, rudderFrom(e)); });
wrap.addEventListener('pointermove', (e) => { if (e.pointerId === rudderPtr) G.setRudder(S, rudderFrom(e)); });
const rudderEnd = (e) => { if (e.pointerId === rudderPtr) { rudderPtr = null; G.setRudder(S, 0); } };
wrap.addEventListener('pointerup', rudderEnd); wrap.addEventListener('pointercancel', rudderEnd);

// 물 화면: 탭 = 기록·항구·목적지, 끌기 = 둘러보기, 두 손가락 = 확대
const ptrs = new Map();
let tapStart = null, pinch = null, zoomingUntil = 0;
function zoomAbout(zNew, sx, sy) {
  zNew = Math.max(VIEW.zoomMin, Math.min(VIEW.zoomMax, zNew));
  const [wx, wy] = toWorld(sx, sy);
  cam.zoom = zNew;
  pan.x += wx - (cam.x + (sx - W / 2) / cam.zoom);
  pan.y += wy - (cam.y + (sy - cam.cy) / (cam.zoom * VIEW.tiltY));
  pan.idle = 0;
  zoomingUntil = performance.now() + 220;
}
function tapWorld(sx, sy) {
  if (S.docked) return;

  if (fl) { if (G.setDest(S, fl.x, fl.y, { type: 'pick' })) { snd.play('tap'); syncButtons(); } return; }

  if (gate) { if (G.setDest(S, gate.x, gate.y, { type: 'gate', id: gate.id })) { snd.play('tap'); showHint(`${gate.name}(으)로 가요`, 2); } return; }

}

  body.append(cv);

    for (const p of polys) { g.moveTo(toX(p[0][0]), toY(p[0][1])); for (const q of p) g.lineTo(toX(q[0]), toY(q[1])); g.closePath(); }
    g.fillStyle = '#6a9c58'; g.fill('evenodd');
    for (const q of w.def.shoals || []) { g.fillStyle = 'rgba(230,214,160,.5)'; g.beginPath(); g.arc(toX(q.x), toY(q.y), q.r * k, 0, Math.PI * 2); g.fill(); }
    // 안개

    g.fillStyle = '#0d2a38';
    for (let j = 0; j < fg.rows; j++) for (let i = 0; i < fg.cols; i++) if (fog[j * fg.cols + i] === '0') g.fillRect(toX(fg.x0 + i * fg.cell) - 0.5, toY(fg.y0 + j * fg.cell) - 0.5, fg.cell * k + 1, fg.cell * k + 1);
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '13px system-ui'; g.fillStyle = '#fff';
    for (const f of G.findsOf(S)) if (S.found[f.id]) g.fillText('📍', toX(f.x), toY(f.y));

      g.strokeStyle = '#fff'; g.setLineDash([3, 4]); g.lineWidth = 1.5; g.beginPath(); g.moveTo(toX(S.boat.x), toY(S.boat.y));
      for (const q of pts) g.lineTo(toX(q.x), toY(q.y));
      g.stroke(); g.setLineDash([]);

    }
    g.fillStyle = '#fff'; g.strokeStyle = '#0d2a38'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(toX(S.boat.x), toY(S.boat.y), 4.5, 0, Math.PI * 2); g.fill(); g.stroke();
    g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath(); g.moveTo(toX(S.boat.x), toY(S.boat.y)); g.lineTo(toX(S.boat.x) + Math.cos(S.boat.h) * 10, toY(S.boat.y) + Math.sin(S.boat.h) * 10); g.stroke();
  };

    info.append(el('div', 'h3', `${c.season.icon} ${c.season.name} ${c.dayOfSeason + 1}일 · 예보 ${st.forecast}일${st.forecast < 3 ? ' (기압계로 늘어나요)' : ''}`), days);
    const allFinds = G.findsOf(S), left = allFinds.filter((f) => !S.found[f.id]).length;
    info.append(el('p', 'note', `발견지 ${allFinds.length - left}/${allFinds.length}. 안개 속이나 뭍 어딘가에 있어요. ${w.gates[0].to ? `${w.gates[0].name}(🚪)로 ${REGIONS[w.gates[0].to].name}에 가요` : `${w.gates[0].name}(🚪)이 이 수역의 끝이에요`}. 지도를 탭하면 항해 계획이 나와요.`));

    const chk = el('div', 'check', `<div>${chartPick.name ? `<b>${chartPick.name}</b> · ` : ''}약 ${Math.round(dist)}m · ${Math.max(1, Math.round(sec / 60))}분</div><div class="${S.food >= needFood * 1.2 ? 'ok' : 'no'}">${S.food >= needFood * 1.2 ? '✓' : '✗'} 식량 ${needFood.toFixed(1)}개 필요(${S.food.toFixed(1)})</div>${S.hull < 0.5 ? '<div class="warn">⚠ 선체가 많이 상했어요</div>' : ''}${fc.some((d) => d.gust !== null) && st.sailArea ? '<div class="warn">⚠ 돌풍 예보가 있어요. 돛을 줄일 준비를 해요</div>' : ''}${fc.some((d) => d.heat && REGIONS[S.region].heat) && !st.awning ? '<div class="warn">⚠ 무더위 예보, 그늘막이 없어요</div>' : ''}${chartPick.gate ? G.gateStatus(S, chartPick.gate).list.map((q) => `<div class="${q.ok ? 'ok' : 'no'}">${q.ok ? '✓' : '✗'} ${q.text}</div>`).join('') : ''}`);

  const b = S.boat;
  G.step(S, STEP);
  const ch = Math.cos(b.h), sh = Math.sin(b.h), L = sprite.hull.len / 2;
  if (b.spd > 0.25) wake.update(STEP, b, b.x - ch * L, b.y - sh * L);
  else wake.update(STEP, { ...b, spd: 0 }, b.x, b.y);
}
function camera(dt) {
  const b = S.boat, moving = !S.docked, vx = moving ? Math.cos(b.h) * b.spd : 0, vy = moving ? Math.sin(b.h) * b.spd : 0;
  pan.idle += dt;
  if (pan.idle > 3.5) { const k = 1 - Math.exp(-dt / 1.1); pan.x -= pan.x * k; pan.y -= pan.y * k; }
  const introY = started ? 0 : -H * 0.26 / (cam.zoom * VIEW.tiltY);
  const tx = b.x + vx * 1.6 + pan.x, ty = b.y + vy * 1.6 + pan.y + introY;
  const k = 1 - Math.exp(-dt / 0.75);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
}

// ── 그리기 ──
function shipState(x, y, h, t, heelV, zoom, still = false) {
  const b = S.boat, swell = 0.6 + S.wind.speed / 16;
  const bob = still ? 0 : Math.sin(t * 1.25) * 0.09 * swell + Math.sin(t * 0.73 + 1) * 0.05 * swell;
  const pitch = still ? 0 : Math.sin(t * 1.1 + 0.6) * 0.022 * swell + Math.min(0.03, b.spd * 0.004);
  const heel = heelV + (still ? 0 : Math.sin(t * 0.93) * 0.015 * swell);
  return { P: SA.makeProjector(x, y, h, heel, pitch, zoom, bob), h, heel, pitch, bob, sailNow: b.sailNow, boom: b.boom, luff: b.luff, t, row: b.row, rowPhase: b.rowPhase, flagFrom: S.wind.from, rudder: b.rudder, capX: S.cap.x, crew: S.crew };
}
function render() {
  const b = S.boat, t = S.t;
  A.drawWater(ctx, sc, cam, W, H, t, S.wind, DPR);
  A.drawLand(ctx, sc, cam, W, H, DPR, performance.now() < zoomingUntil, S.region === 'river' && S.weather.drought);
  A.drawShoreFoam(ctx, sc, cam, W, H, t, DPR);
  A.drawFlotsam(ctx, sc, G.flotsamOf(S), cam, W, H, t, DPR);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sx = (x) => W / 2 + (x - cam.x) * cam.zoom, sy = (y) => cam.cy + (y - cam.y) * cam.zoom * VIEW.tiltY;
  if (S.route) {
    const r = S.route;
    ctx.setLineDash([3, 8]); ctx.lineCap = 'round'; ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.moveTo(sx(b.x), sy(b.y));
    for (let i = r.i; i < r.pts.length; i++) ctx.lineTo(sx(r.pts[i].x), sy(r.pts[i].y));
    ctx.stroke(); ctx.setLineDash([]);
    const fx = sx(r.dx), fy = sy(r.dy), pulse = 1 + 0.2 * Math.sin(t * 3);
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(fx, fy, 10 * pulse, 10 * pulse * VIEW.tiltY, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - 20); ctx.stroke();
    ctx.fillStyle = '#d6443a'; ctx.beginPath(); ctx.moveTo(fx, fy - 20); ctx.lineTo(fx + 11, fy - 16); ctx.lineTo(fx, fy - 12); ctx.closePath(); ctx.fill();
  }
  if (!S.route && !b.row && b.sailNow > 0.1 && b.twa < NO_GO + 0.45 && !S.docked) {
    const a = 1 - (b.twa - NO_GO) / 0.45, R = 13 * cam.zoom;
    ctx.save(); ctx.translate(sx(b.x), sy(b.y)); ctx.scale(1, VIEW.tiltY);
    ctx.fillStyle = `rgba(255,120,90,${0.13 * Math.min(1, a)})`;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, S.wind.from - NO_GO, S.wind.from + NO_GO); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  wake.draw(ctx, cam, W, DPR);

  const bx = sx(b.x), by = sy(b.y), st = shipState(bx, by, b.h, t, b.heel, cam.zoom);
  SA.drawShipOnWater(ctx, sprite, st, cam.zoom, bx, by);
  if (!S.docked) A.drawBowFoam(ctx, cam, W, DPR, b, Math.min(1, b.spd / 6), t, sprite.hull.len);
  creatures.draw(ctx, cam, W, H, DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const props = A.visibleProps(sc, cam, W, H);
  let shipDone = false;
  for (const p of props) {
    if (!shipDone && p.y > b.y) { SA.drawShip(ctx, sprite, st, cam.zoom, bx, by); shipDone = true; }
    if (p.find && !G.canSeeFind(S, p.find)) continue;
    A.drawProp(ctx, sc, cam, W, p, t);
    if (p.name && cam.zoom > 3.2) {
      ctx.font = '600 12px system-ui'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,30,40,.75)'; ctx.fillStyle = '#fff';
      const lx = sx(p.x), ly = sy(p.y) - (p.port ? 6.5 : 5) * cam.zoom;
      ctx.strokeText(p.name, lx, ly); ctx.fillText(p.name, lx, ly);
    }
  }
  if (!shipDone) SA.drawShip(ctx, sprite, st, cam.zoom, bx, by);
  A.drawWeather(ctx, S.docked ? {} : S.weather, W, H, t, DPR);
}
function renderPreview(t) {
  if (!previewCanvas || !sheet || sheet.active !== 'paint' || !document.body.contains(previewCanvas.g.canvas)) return;
  const { g, cw, dpr } = previewCanvas, z = 11;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#2b86a0'; g.fillRect(0, 0, cw, 190);
  const h = t * 0.35, x = cw / 2, y = 150;
  const st = shipState(x, y, h, t, 0, z, true);
  st.sailNow = G.stats(S).sailArea ? 1 : 0; st.boom = 0.6; st.luff = false; st.row = false; st.capX = sprite.hull.helmX; st.flagFrom = 0.4;
  SA.drawShipOnWater(g, sprite, st, z, x, y);
  SA.drawShip(g, sprite, st, z, x, y);
}
function fxTimers(dt) {
  const b = S.boat;
  flapT -= dt;
  if (b.luff && flapT <= 0 && !S.docked) { snd.play('flap'); flapT = 1.3 + Math.random() * 1.6; }
  creakT -= dt;
  if (creakT <= 0) { snd.play('creak'); creakT = 3.5 + Math.random() * 6; }
}

const fpsBox = $('fps');
if (query.get('fps')) fpsBox.style.display = 'block';
let fN = 0, fT = 0, saveT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = Math.min(0.25, (now - last) / 1000);
  last = now;
  if (paused) return;
  const hold = !started || !!sheet || overlayOpen();
  if (!hold) {
    acc += raw;
    let n = 0;
    while (acc >= STEP && n < 12) { tick(); acc -= STEP; n++; }
    if (n === 12) acc = 0;
    drainEvents();
    fxTimers(raw);
    creatures.update(raw, cam, W, H, S.boat, G.stats(S).telescope);
    saveT += raw;
    if (saveT > 5) { saveT = 0; save(); }
  } else { S.t += raw * 0.6; S.wind = G.windAt(S); if (S.weather.gustOn) S.wind.speed *= REGIONS[S.region].gustK; } // 시트가 떠 있어도 물은 흐른다
  camera(raw);
  render();
  renderPreview(now / 1000);
  updateHud(raw);
  if (!sheet) syncTabs();
  if (query.get('fps')) { fN++; fT += raw; if (fT >= 1) { fpsBox.textContent = `${Math.round(fN / fT)} fps`; fN = 0; fT = 0; } }
}
document.addEventListener('visibilitychange', () => {
  paused = document.hidden;
  if (paused) { save(); snd.pause(); music.pause(); } else { snd.resume(); music.resume(); last = performance.now(); acc = 0; }
});
window.addEventListener('pagehide', save);
syncButtons(); syncTop(); syncTabs();
requestAnimationFrame(frame);

// 서비스 워커(독립 실행)
if ('serviceWorker' in navigator && !query.get('dbg') && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.serviceWorker.controller) {
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading) return; reloading = true; save(); location.reload(); });
  }
}

// 점검용 창구(?dbg=1): 자동 확인이 상태를 읽고 조작할 때 씁니다
if (query.get('dbg')) window.SM = { openTab, get S() { return S; }, get creatures() { return creatures; }, get sc() { return sc; }, G, SH, cam, snd, music, render, worldOf, get sheet() { return sheet; }, drainEvents, bakeIfNeeded, openPort, closeSheet, renderSheet, changeRegionArt, openGate, tapWorld };
</script>
