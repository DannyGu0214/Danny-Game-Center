<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sailing Master</title>
<meta name="theme-color" content="#123a4c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sailing Master">
<style>
:root { color-scheme: dark; --ink: #10303e; --panel: rgba(13,42,56,.84); --sheet: #12303f; --card: #1a4052; --line: rgba(190,226,232,.22); --text: #f1f6f2; --muted: #a6c4cb; --on: #f2c14e; --bad: #f08a6e; --ok: #8fdc9a; --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --bar: calc(50px + var(--safe-b)); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; color: var(--text); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; user-select: none; -webkit-user-select: none; overscroll-behavior: none; word-break: keep-all; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .45; }
input { font: inherit; user-select: text; -webkit-user-select: text; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

/* 위쪽 정보: 칸을 나누지 않은 계기판 패널 한 장(바람·속도·날짜 + 아이템 줄) */
#hud { position: absolute; left: 8px; right: 8px; top: calc(6px + var(--safe-t)); pointer-events: none; }
#plate { border-radius: 16px; overflow: hidden; background: linear-gradient(to bottom, rgba(24,62,80,.9), rgba(10,34,48,.93)); border: 1px solid rgba(226,196,130,.34); box-shadow: 0 6px 18px rgba(3,16,26,.38), inset 0 1px 0 rgba(255,255,255,.1); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#hudTop { display: flex; align-items: center; padding: 4px 4px 4px 5px; min-height: 58px; }
#compass { width: 50px; height: 50px; position: relative; flex: none; }
#compass svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#arrow { transition: transform .4s linear; }
.inst { padding: 0 9px; min-width: 0; position: relative; }
.inst + .inst::before { content: ''; position: absolute; left: 0; top: 5px; bottom: 5px; width: 1px; background: linear-gradient(to bottom, rgba(226,196,130,0), rgba(226,196,130,.42), rgba(226,196,130,0)); }
.num { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; letter-spacing: -.01em; white-space: nowrap; }
.num small { font-size: 10.5px; font-weight: 600; color: #e2c482; margin-left: 2px; letter-spacing: 0; }
.sub { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub.warn { color: #ffc27a; font-weight: 600; }
#dateCard { flex: 1; }
#dateNum { font-size: 15px; line-height: 1.27; }
#dateNum i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1.5px; box-shadow: 0 0 6px currentColor; }
#hudBtns { display: grid; gap: 2px; flex: none; }
.iconBtn { width: 34px; height: 25px; display: grid; place-items: center; border-radius: 8px; pointer-events: auto; color: #e2c482; background: rgba(255,255,255,.05); }
.iconBtn svg { width: 15px; height: 15px; }
.iconBtn.off { color: var(--muted); opacity: .55; }
.iconBtn .slash { display: none; }
.iconBtn.off .slash { display: inline; }
.iconBtn.tall { height: 52px; }
.iconBtn.tall svg { width: 18px; height: 18px; }
/* 소리 조절(S4): 위쪽 소리 단추로 여는 별도 화면. 슬라이더는 키 슬라이더처럼 끌어요(트랙 어디를 눌러도 됨) */
#audio { z-index: 8; position: absolute; inset: 0; background: rgba(6,24,34,.62); display: none; align-items: flex-start; justify-content: center; padding: calc(70px + var(--safe-t)) 16px 16px; }
#audio.on { display: flex; }
#audBox { width: 100%; max-width: 380px; background: var(--sheet); border: 1px solid rgba(226,196,130,.34); border-radius: 18px; padding: 12px 16px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
#audHead { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
#audHead h3 { flex: 1; margin: 0; font-size: 18px; }
#audClose { width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,.06); font-size: 16px; }
.aud { padding: 10px 0 0; }
.aud + .aud { border-top: 1px solid var(--line); }
.audTop { display: flex; align-items: center; gap: 9px; }
.audTop .ic { width: 26px; flex: none; text-align: center; font-size: 21px; }
.audTop .nm { flex: 1; min-width: 0; line-height: 1.25; }
.audTop .nm b { display: block; font-size: 15.5px; }
.audTop .nm small { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.audTop .val { min-width: 34px; text-align: right; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: #e2c482; }
.audTog { flex: none; min-width: 54px; height: 34px; border-radius: 17px; background: rgba(255,255,255,.08); border: 1px solid var(--line); color: var(--muted); font-size: 13.5px; font-weight: 700; }
.audTog.on { background: var(--on); border-color: var(--on); color: #203038; }
.audSl { --v: 1; position: relative; height: 46px; touch-action: none; cursor: pointer; outline: none; }
.audSl .tr { position: absolute; left: 15px; right: 15px; top: 20px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); box-shadow: inset 0 1px 1px rgba(0,0,0,.35); }
.audSl .fl { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--v) * 100%); border-radius: 3px; background: linear-gradient(to right, #b08f50, #f2c14e); }
.audSl .kn { position: absolute; top: 8px; left: calc(15px + (100% - 30px) * var(--v)); width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #fbeec2, #d9b265 58%, #8f6d33); box-shadow: 0 2px 6px rgba(0,0,0,.45); }
.audSl:focus-visible .kn { outline: 2px solid #eef9fc; outline-offset: 2px; }
.aud.mute .fl { background: rgba(166,196,203,.35); }
.aud.mute .kn { filter: grayscale(.85) brightness(.75); }
.aud.mute .val { color: var(--muted); }
#audNote { margin: 10px 2px 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; text-align: center; }
#audBox .big { width: 100%; margin-top: 10px; }
#chips { display: flex; gap: 9px; padding: 5px 11px; align-items: center; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; background: rgba(2,14,22,.28); border-top: 1px solid rgba(226,196,130,.16); }
#chips span { display: inline-flex; align-items: center; gap: 4px; }
#chips svg { width: 15px; height: 15px; flex: none; }
#chips .gap { margin-left: auto; }
.emo { font-style: normal; font-size: .95em; line-height: 1; }
.wRow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; padding: 8px 10px; border-radius: 12px; background: var(--card); border: 1px solid rgba(190,226,232,.1); font-size: 13px; color: var(--muted); }
.wRow .ic { width: 22px; flex: none; text-align: center; font-size: 17px; } .wRow .ic svg { width: 19px; height: 19px; display: block; margin: 0 auto; }
.wRow .grow { flex: 1; min-width: 0; line-height: 1.3; } .wRow .grow b { color: var(--text); font-size: 14px; } .wRow .grow .n { float: right; color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
.wRow .pBtn { flex: none; margin: 0; min-height: 32px; padding: 5px 8px; font-size: 12.5px; min-width: 0; }
.wRow .want { color: var(--on); font-weight: 700; }
.wRow .pBtn svg, .pCard .pBtn > svg { width: 16px; height: 16px; flex: none; }
.wNote { margin: 0 2px 8px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.relic { margin-top: 2px; font-size: 11px; color: #e2c482; }
#chips .low { color: var(--bad); }
/* 배 상태: 아이템 줄과 나눠 조종부 바로 위에 둔다 */
#statusRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; margin-bottom: 6px; }
#status { display: flex; gap: 11px; padding: 6px 10px; flex: none; border-radius: 12px; background: linear-gradient(to bottom, rgba(24,62,80,.9), rgba(10,34,48,.93)); border-color: rgba(226,196,130,.34); }
.gauge { display: flex; align-items: center; gap: 5px; font-size: 12px; }
.gauge svg { width: 14px; height: 14px; flex: none; }
.gauge i { display: block; width: 38px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; box-shadow: inset 0 1px 1px rgba(0,0,0,.35); }
.gauge i b { display: block; height: 100%; width: 100%; border-radius: 3px; background: linear-gradient(to right, #5fc08a, #a4e6a8); transition: width .3s; }
.gauge i b.mid { background: linear-gradient(to right, #d9a12f, #f5d06a); }
.gauge i b.low { background: linear-gradient(to right, #d9583f, #f59a7d); }
.gauge span { min-width: 22px; text-align: right; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.gauge span.low { color: var(--bad); font-weight: 700; }

#hint { z-index: 6; position: absolute; left: 50%; top: calc(104px + var(--safe-t)); transform: translateX(-50%); max-width: calc(100% - 28px); width: max-content; padding: 7px 13px; border-radius: 14px; background: rgba(9,30,42,.8); font-size: 13.5px; text-align: center; opacity: 0; transition: opacity .3s; pointer-events: none; }
#hint.on { opacity: 1; }
#hint.warn { background: rgba(120,40,22,.9); }
#toasts { z-index: 6; position: absolute; right: 10px; top: calc(104px + var(--safe-t)); display: grid; gap: 4px; justify-items: end; pointer-events: none; }
.toast { padding: 3px 9px; border-radius: 10px; background: rgba(9,30,42,.72); font-size: 12.5px; animation: toast 1.7s forwards; }
@keyframes toast { 0% { opacity: 0; transform: translateY(6px);} 12% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; } }

#panel { position: absolute; left: 0; right: 0; bottom: var(--bar); padding: 0 10px; background: linear-gradient(to top, rgba(10,34,46,.95) 50px, rgba(10,34,46,0) 62px); pointer-events: none; }
#controls { pointer-events: auto; }
#context { display: flex; justify-content: flex-end; gap: 6px; min-width: 0; }
#context button { padding: 7px 12px; background: var(--on); color: #203038; font-weight: 700; border-radius: 11px; font-size: 13.5px; white-space: nowrap; box-shadow: 0 2px 10px rgba(0,0,0,.3); pointer-events: auto; }
/* 돛·노·키를 한 줄에: 항해 화면을 더 보여 주려고(2026-11-02 대니님 요청) */
#controls { display: flex; gap: 6px; height: 44px; align-items: stretch; }
.seg { display: grid; grid-template-columns: auto repeat(3, minmax(30px, 34px)); align-items: stretch; border-radius: 12px; overflow: hidden; flex: none; }
.seg .lab { display: flex; align-items: center; padding: 0 3px 0 5px; font-size: 13px; }
.seg button { font-size: 11.5px; border-left: 1px solid var(--line); }
.seg button.on { background: var(--on); color: #203038; font-weight: 700; }
#oar { flex: none; width: 44px; font-size: 13px; border-radius: 12px; padding: 0; line-height: 1.05; }
#oar small { display: block; font-size: 10.5px; }
#oar.on { background: var(--on); color: #203038; font-weight: 700; border-color: var(--on); }
#rudderWrap { position: relative; flex: 1; min-width: 96px; touch-action: none; border-radius: 12px; }
#rudderWrap .lab { position: absolute; font-size: 10.5px; color: var(--muted); top: 50%; transform: translateY(-50%); pointer-events: none; }
#track { position: absolute; left: 20px; right: 20px; top: 50%; height: 4px; margin-top: -2px; background: rgba(255,255,255,.2); border-radius: 2px; }
#notch { position: absolute; left: 50%; top: -5px; width: 2px; height: 14px; background: rgba(255,255,255,.45); margin-left: -1px; }
#knob { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: #f5eedd; color: #3a3224; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.35); pointer-events: none; }
#rudderWrap.auto #knob { background: #b9d7d8; }
/* 아래 메뉴: 어느 화면에서든 늘 보인다(2026-11-02 대니님 요청) */
#tabs { position: absolute; left: 0; right: 0; bottom: 0; height: var(--bar); padding: 5px 10px calc(7px + var(--safe-b)); display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 5px; background: #0a222e; }
#tabs button { height: 38px; min-width: 0; border-radius: 10px; font-size: 10.5px; line-height: 1.1; background: rgba(255,255,255,.08); white-space: nowrap; overflow: hidden; }
#tabs button .ic { display: block; font-size: 15px; line-height: 1.15; }
#tabs button.on { background: var(--on); color: #203038; font-weight: 700; }

#sheet { position: absolute; left: 0; right: 0; bottom: var(--bar); top: calc(98px + var(--safe-t)); background: var(--sheet); border-radius: 18px 18px 0 0; display: none; flex-direction: column; box-shadow: 0 -6px 24px rgba(0,0,0,.4); }
#sheet.on { display: flex; }
#sheetHead { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
#sheetHead h2 { margin: 0; font-size: 18px; flex: 1; min-width: 0; }
#sheetHead h2 small { margin-left: 8px; font-size: 12px; font-weight: 600; color: #e2c482; }
#sheetClose { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.1); font-size: 16px; }
#sheetTabs { display: flex; gap: 3px; margin: 0 14px 10px; padding: 3px; border-radius: 11px; background: rgba(0,0,0,.22); overflow-x: auto; flex: none; }
#sheetTabs button { flex: 1; padding: 6px 12px; border-radius: 8px; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
#sheetTabs button.on { background: var(--on); color: #203038; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
#sheetBody { flex: 1; overflow-y: auto; padding: 2px 14px 16px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
#sheetFoot { padding: 10px 14px; border-top: 1px solid var(--line); display: none; gap: 8px; }
#sheetFoot.on { display: flex; }
.big { flex: 1; padding: 13px; border-radius: 12px; background: var(--on); color: #203038; font-weight: 700; font-size: 15.5px; }
.ghost { padding: 13px 14px; border-radius: 12px; background: rgba(255,255,255,.1); font-size: 14px; }
.row { background: var(--card); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
.row .grow { flex: 1; min-width: 0; }
.row .ttl { font-weight: 600; font-size: 15px; }
.row .txt { color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 2px; }
.row .act { padding: 8px 12px; border-radius: 10px; background: var(--on); color: #203038; font-weight: 700; font-size: 13.5px; white-space: nowrap; flex: none; }
.row .act.off { background: rgba(255,255,255,.14); color: var(--muted); font-weight: 500; }
/* 선원 명부 */
.capCard { display: flex; align-items: center; gap: 12px; padding: 11px 13px; margin-bottom: 14px; border-radius: 14px; background: linear-gradient(120deg, #21506a, #173a4c); border: 1px solid rgba(226,196,130,.4); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
.face { flex: none; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 40% 30%, #3f7f96, #143444); box-shadow: 0 0 0 1.5px rgba(226,196,130,.75); }
.face { position: relative; }
.face img { position: absolute; width: 210%; height: auto; left: -70%; top: -88%; display: block; }
.deckKey { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: -6px 2px 12px; font-size: 11.5px; color: var(--muted); }
.face canvas { display: block; width: 100%; height: 100%; }
.capCard .lab { font-size: 11px; font-weight: 700; letter-spacing: .05em; color: #e2c482; }
.capCard .nm { font-size: 18px; font-weight: 800; line-height: 1.25; }
.capCard .tr { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.capCard .tr b { color: var(--text); font-weight: 600; margin-right: 5px; }
.rosterHead { display: flex; align-items: center; gap: 8px; margin: 0 2px 7px; font-size: 14px; font-weight: 700; }
.rosterHead .cnt { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.seat { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid rgba(226,196,130,.6); }
.seat.on { background: #e2c482; border-color: #e2c482; }
.rosterNote { margin: -2px 2px 9px; font-size: 12px; line-height: 1.45; color: var(--muted); }
.crewEmpty { margin-bottom: 14px; padding: 13px; border: 1px dashed rgba(190,226,232,.3); border-radius: 13px; font-size: 13px; line-height: 1.5; color: var(--muted); text-align: center; }
.plans { display: flex; gap: 6px; margin: 0 0 8px; } .plans button { flex: 1; padding: 8px 4px; border-radius: 10px; background: rgba(255,255,255,.08); font-size: 13.5px; font-weight: 600; }
.plans button.on { background: var(--on); color: #203038; font-weight: 800; } .plans button.save { flex: none; padding: 8px 10px; }
.rules { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; } .rules button { padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); font-size: 12.5px; color: var(--muted); }
.rules button.on { color: var(--text); border-color: var(--ok); background: rgba(143,220,154,.14); }
.deck { position: relative; margin: 0 0 12px; border-radius: 14px; background: #1d5f78; overflow: hidden; }
.deck canvas { display: block; width: 100%; }
.deck .seat { position: absolute; transform: translate(-50%, -50%); min-width: 28px; height: 28px; padding: 0 5px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; font-weight: 700; color: #fff; background: rgba(10,30,40,.72); border: 2px solid rgba(255,255,255,.55); white-space: nowrap; }
.deck .seat.empty { border-style: dashed; color: #ffd27a; } .deck .seat.rest { background: rgba(60,50,30,.7); } .deck .seat.pick { border-color: var(--on); box-shadow: 0 0 0 3px rgba(242,193,78,.35); }
.deck .hint { position: absolute; left: 8px; bottom: 6px; font-size: 11.5px; color: rgba(255,255,255,.8); }
.crewCard.sel { border-color: var(--on); box-shadow: 0 0 0 2px rgba(242,193,78,.3); }
.crewMeta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; font-size: 12px; } .crewMeta span { padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--muted); } .crewMeta .lv { color: #f2c14e; background: rgba(242,193,78,.12); } .crewMeta .seatTag { color: var(--text); }
.crewBars { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 7px; font-size: 11.5px; color: var(--muted); } .crewBars i { display: block; height: 5px; margin-top: 3px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; } .crewBars b { display: block; height: 100%; border-radius: 3px; }
.crewCard { margin-bottom: 9px; padding: 11px 12px; border-radius: 14px; background: var(--card); border: 1px solid rgba(190,226,232,.12); }
.crewTop { display: flex; align-items: center; gap: 10px; }
.crewTop .who { flex: 1; min-width: 0; }
.crewTop .nm { display: flex; align-items: center; gap: 6px; font-size: 15.5px; font-weight: 700; line-height: 1.25; }
.gender { font-size: 10.5px; font-weight: 700; padding: 1px 5px; border-radius: 5px; color: #bfe3ee; background: rgba(120,190,220,.2); }
.gender.f { color: #ffd0d8; background: rgba(240,140,160,.2); }
.crewTop .ds { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
.crewTop .rum { margin-top: 2px; font-size: 13px; font-weight: 600; color: #f1b873; }
.roleTag { flex: none; align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px 3px 6px; border-radius: 999px; font-size: 11.5px; font-weight: 700; color: #f1dca7; background: rgba(226,196,130,.15); }
.roleTag svg { width: 13px; height: 13px; }
.crewStats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; margin: 10px 0 9px; }
.st .l { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
.st .l b { font-size: 12.5px; color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
.st .b { position: relative; height: 5px; border-radius: 3px; background: rgba(255,255,255,.13); overflow: hidden; }
.st .b i { display: block; height: 100%; border-radius: 3px; background: var(--c); }
.st .b::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(10,30,40,.75); }
.crewFoot { display: flex; align-items: center; gap: 10px; padding-top: 9px; border-top: 1px solid rgba(190,226,232,.12); }
.crewFoot .pay { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.crewFoot .pay span { display: inline-flex; align-items: center; gap: 3px; }
.crewFoot .pay b { color: var(--text); font-size: 13.5px; margin-left: 1px; font-variant-numeric: tabular-nums; }
.crewFoot .pay svg { width: 13px; height: 13px; }
.crewBtn { flex: none; min-width: 74px; padding: 8px 13px; border-radius: 10px; font-size: 13.5px; font-weight: 700; color: #203038; background: var(--on); }
.crewBtn.off { color: var(--muted); font-weight: 600; background: rgba(255,255,255,.1); }
.crewBtn.ghost { color: var(--muted); font-weight: 600; background: none; box-shadow: inset 0 0 0 1px rgba(190,226,232,.28); }
.note { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin: 0 0 10px; }
.check { font-size: 14px; line-height: 1.65; }
.check .ok { color: var(--ok); } .check .no { color: var(--bad); } .check .warn { color: var(--on); }
.h3 { font-size: 14px; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }

#chart { width: 100%; display: block; border-radius: 14px; touch-action: none; background: #14313f; box-shadow: 0 0 0 1px rgba(226,196,130,.42); }
.days { display: flex; gap: 6px; }
.days > div { flex: 1; min-width: 0; padding: 7px 2px 6px; border-radius: 11px; background: var(--card); border: 1px solid rgba(190,226,232,.1); text-align: center; font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.days .ic { display: block; margin: 2px 0 1px; font-size: 19px; line-height: 1.2; }
.days b { display: block; color: var(--text); font-size: 13px; font-weight: 600; }
.days .bad b { color: #ffc27a; }
.days .mild b { color: #e8dca0; }
.days .storm { border-color: rgba(255,120,95,.55); background: rgba(120,40,30,.28); }
.days .storm b { color: #ff9a80; }
.seg.torn .lab { color: #ff9a80; }
.seg.torn .lab::after { content: '!'; margin-left: 1px; font-weight: 800; }
#context button.mend { background: #f0d9a8; }
#context button.mend[disabled] { opacity: .85; }
/* 항구 */
.portBanner { margin-bottom: 4px; padding: 9px 12px; border-radius: 12px; font-size: 14px; line-height: 1.5; font-weight: 600; background: rgba(95,192,138,.14); border: 1px solid rgba(143,220,154,.34); color: var(--ok); }
.portBanner.warn { background: rgba(242,193,78,.1); border-color: rgba(242,193,78,.38); color: #f6d27a; }
.portBanner.no { background: rgba(217,88,63,.14); border-color: rgba(240,138,110,.5); color: #ffb09a; }
.portBanner div + div { margin-top: 2px; }
.pGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pCard { display: flex; flex-direction: column; padding: 10px 11px; border-radius: 13px; background: var(--card); border: 1px solid rgba(190,226,232,.1); }
.pCard .t { display: flex; align-items: center; gap: 5px; font-size: 14.5px; font-weight: 700; }
.pCard .t svg { width: 17px; height: 17px; flex: none; }
.pCard .t b { margin-left: auto; font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pCard .t b.low { color: var(--bad); }
.pCard .m { height: 5px; margin-top: 7px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; }
.pCard .m b { display: block; height: 100%; border-radius: 3px; background: linear-gradient(to right, #5fc08a, #a4e6a8); }
.pCard .m b.low { background: linear-gradient(to right, #d9583f, #f59a7d); }
.pCard .d { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; line-height: 1.35; color: var(--muted); }
.pCard .d .cost { font-size: 13px; }
.pBtn { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: auto; min-height: 37px; padding: 7px 6px; border-radius: 10px; background: var(--on); color: #203038; font-size: 13.5px; font-weight: 700; }
.pCard .btnGap { height: 8px; flex: none; }

.waitRow { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 9px 11px; border-radius: 13px; background: var(--card); border: 1px solid rgba(190,226,232,.1); font-size: 13px; line-height: 1.4; color: var(--muted); }

.waitRow .grow { flex: 1; min-width: 0; }
.waitRow .pBtn { flex: none; margin: 0; min-width: 74px; }
/* 해도 */
.chartSum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.chartSum > div { min-width: 0; padding: 7px 4px 6px; border-radius: 11px; background: var(--card); border: 1px solid rgba(190,226,232,.1); text-align: center; font-size: 12.5px; line-height: 1.3; color: var(--muted); }
.chartSum b { display: block; color: var(--text); font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chartTip { margin: 9px 2px 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
.planCard { margin-top: 10px; padding: 11px 13px 12px; border-radius: 14px; background: linear-gradient(120deg, #21506a, #173a4c); border: 1px solid rgba(226,196,130,.4); }
.planCard .l { font-size: 12.5px; font-weight: 700; color: #e2c482; margin-bottom: 2px; }
.planCard .big { width: 100%; margin-top: 9px; }

#plan { display: block; width: 100%; touch-action: none; border-radius: 12px; background: #0f3a4e; }
.gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 12px; margin: 10px 0; font-size: 12.5px; }
.gauges b { float: right; font-variant-numeric: tabular-nums; }
.gauges .bad b { color: var(--bad); }
/* 배 설계: 왼쪽 도면, 오른쪽 제원표 */
.rung { margin-bottom: 8px; border-radius: 12px; background: var(--card); border: 1px solid rgba(190,226,232,.12); overflow: hidden; }
.rung.now { border-color: rgba(226,196,130,.55); background: linear-gradient(120deg, #21506a, #173a4c); }
.rung.past, .rung.far { opacity: .62; }
.rung .top { display: flex; align-items: center; gap: 8px; padding: 9px 11px; }
.rung .g { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: rgba(0,0,0,.26); font-size: 13px; font-weight: 800; color: #e2c482; }
.rung .who { flex: 1; min-width: 0; }
.rung .nm { font-size: 15px; font-weight: 700; }
.rung .spc { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.rung .stars { flex: none; font-size: 15px; letter-spacing: .04em; color: var(--on); }
.rung .lk { flex: none; font-size: 12.5px; color: var(--muted); max-width: 42%; text-align: right; line-height: 1.3; }
.rung .info { padding: 0 11px 9px; font-size: 13px; color: var(--muted); line-height: 1.5; }
.rung .info b { color: var(--text); font-weight: 600; }
.rung .tools { display: flex; gap: 6px; padding: 0 11px 10px; }
.rung .tools button { flex: 1; padding: 8px; border-radius: 10px; background: rgba(255,255,255,.11); font-size: 13.5px; font-weight: 600; }
.step { margin: 0 8px 8px; padding: 10px 11px; border-radius: 10px; background: rgba(4,20,30,.46); border: 1px solid rgba(226,196,130,.26); }
.step .l { font-size: 14.5px; font-weight: 700; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.step .ds { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
.step .need { margin-top: 5px; font-size: 13px; line-height: 1.5; }
.step .need .ok { color: var(--ok); } .step .need .no { color: var(--bad); }
.step .cost { font-size: 13px; }
.step .cost svg { width: 14px; height: 14px; }
.step button { display: block; width: 100%; margin-top: 8px; padding: 10px; border-radius: 10px; background: var(--on); color: #203038; font-size: 14.5px; font-weight: 700; }
.step button.off { background: rgba(255,255,255,.12); color: var(--muted); font-weight: 600; }
.cost { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cost svg { width: 13px; height: 13px; flex: none; }
.cost.short { color: var(--bad); }
/* 설계 모드: 위 계기·출항 단추를 가리고 배 평면도만 화면 가득(아래 메뉴는 남는다) */
#sheet.full { top: 0; border-radius: 0; background-color: #113445; background-image: linear-gradient(rgba(150,210,230,.075) 1px, transparent 1px), linear-gradient(90deg, rgba(150,210,230,.075) 1px, transparent 1px); background-size: 24px 24px; }
#sheet.full #sheetHead, #sheet.full #sheetTabs, #sheet.full #sheetFoot { display: none; }
#sheet.full #sheetBody { padding: 0; overflow: hidden; touch-action: none; display: flex; flex-direction: column; }
.dsnPlan { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; }
.dsnPlan canvas { display: block; touch-action: none; }
.dsnBtn { position: absolute; top: calc(10px + var(--safe-t)); width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: rgba(6,26,38,.74); border: 1px solid rgba(226,196,130,.34); font-size: 18px; font-weight: 700; }
.dsnBtn.on { background: var(--on); color: #203038; }
.dsnDrawer { flex: none; padding: 2px 14px 8px; background: var(--sheet); border-top: 1px solid rgba(226,196,130,.3); }
.dsnSpec { position: absolute; left: 12px; right: 12px; top: calc(60px + var(--safe-t)); padding: 12px 14px; border-radius: 14px; background: rgba(6,26,38,.95); border: 1px solid rgba(226,196,130,.34); }
.dsnSpec .tag { display: flex; align-items: center; gap: 7px; margin-top: 7px; font-size: 13px; color: var(--muted); }
.dsnSpec .tag i { flex: none; width: 13px; height: 13px; border-radius: 3px; }
.spec .hero { padding-bottom: 8px; margin-bottom: 7px; border-bottom: 1px solid rgba(226,196,130,.2); }
.spec .hero .l { font-size: 12.5px; color: var(--muted); }
.spec .hero .v { font-size: 25px; font-weight: 800; line-height: 1.15; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.spec .hero .v small { margin-left: 2px; font-size: 11px; font-weight: 600; color: #e2c482; }
.meter { margin-bottom: 8px; }
.meter .t { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
.meter .t b { color: var(--text); font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.meter i { display: block; height: 5px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; }
.meter i b { display: block; height: 100%; border-radius: 3px; background: linear-gradient(to right, #5fc08a, #a4e6a8); }
.meter.bad .t b { color: var(--bad); }
.meter.bad i b { background: linear-gradient(to right, #d9583f, #f59a7d); }
.spec .line { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 3px 0; font-size: 12.5px; color: var(--muted); border-top: 1px solid rgba(190,226,232,.1); white-space: nowrap; }
.spec .line b { color: var(--text); font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.spec .line.bad b { color: var(--bad); }
/* 고른 모듈 설명: 높이를 고정해 화면이 들썩이지 않게 한다 */
.modInfo { display: flex; align-items: center; gap: 9px; min-height: 54px; margin: 8px 0 6px; padding: 6px 10px 6px 11px; border-radius: 12px; background: rgba(255,255,255,.05); font-size: 13px; line-height: 1.4; color: var(--muted); }
.modInfo .ic { flex: none; font-size: 22px; }
.modInfo .grow { flex: 1; min-width: 0; }
.modInfo .nm { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 14px; font-weight: 700; color: var(--text); }
.modInfo button { flex: none; padding: 7px 10px; border-radius: 9px; background: rgba(255,255,255,.1); color: var(--text); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.palette { display: flex; gap: 6px; overflow-x: auto; margin: 0 -14px; padding: 2px 14px 6px; -webkit-overflow-scrolling: touch; touch-action: pan-x; scrollbar-width: none; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 22px), transparent); }
.palette::-webkit-scrollbar { display: none; }
.mod { flex: none; width: 78px; height: 80px; display: flex; flex-direction: column; align-items: center; padding: 6px 3px 6px; background: var(--card); border-radius: 12px; text-align: center; border: 1.5px solid rgba(190,226,232,.12); }
.mod.on { border-color: var(--on); background: #29546a; box-shadow: 0 0 0 1px var(--on) inset; }
.mod.lock { opacity: .5; }
.mod .ic { font-size: 21px; line-height: 1.15; }
.mod .nm { margin-top: 2px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.mod .ct { margin-top: auto; display: flex; justify-content: center; gap: 5px; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); }
.sw.on { border: 3px solid var(--on); }
#nameInput { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.2); color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.dexHead { margin-bottom: 11px; padding: 11px 13px 12px; border-radius: 14px; background: linear-gradient(120deg, #21506a, #173a4c); border: 1px solid rgba(226,196,130,.4); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
.dexHead .top { display: flex; align-items: baseline; gap: 8px; }
.dexHead .l { font-size: 14px; font-weight: 700; color: #e2c482; }
.dexHead .n { margin-left: auto; font-size: 24px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.dexHead .n small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.dexHead .bar { height: 6px; margin-top: 7px; border-radius: 3px; background: rgba(0,0,0,.3); overflow: hidden; }
.dexHead .bar b { display: block; height: 100%; border-radius: 3px; background: linear-gradient(to right, #d9a12f, #f5d06a); }
.dexHead .tip { margin-top: 9px; font-size: 13.5px; line-height: 1.5; color: #d3e3e6; }
.dexHead .tip div + div { margin-top: 3px; }
.dexHead .ms { display: flex; gap: 6px; margin-top: 9px; }
.dexHead .ms span { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 2px; border-radius: 9px; background: rgba(0,0,0,.2); font-size: 13px; font-weight: 600; color: var(--muted); }
.dexHead .ms span.on { background: rgba(242,193,78,.2); color: #f6dc97; }
.dexHead .ms em { font-style: normal; font-size: 13px; }
.dexSec { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 15px 2px 7px; font-size: 15px; font-weight: 700; }
.dexSec span { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.dexGrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sp { background: var(--card); border-radius: 12px; padding: 5px 5px 8px; text-align: center; font-size: 14px; font-weight: 600; line-height: 1.25; border: 1px solid rgba(190,226,232,.1); }
.sp canvas, .sp .q { display: block; width: 100%; height: 66px; margin-bottom: 6px; border-radius: 8px; background: rgba(4,20,30,.35); }
.sp .q { display: grid; place-items: center; font-size: 27px; font-weight: 800; color: rgba(190,226,232,.28); }
.sp.unk { color: var(--muted); font-weight: 500; }
.achStats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.achStats div { padding: 6px 2px 5px; border-radius: 9px; background: rgba(0,0,0,.2); text-align: center; font-size: 12.5px; color: var(--muted); }
.achStats b { display: block; font-size: 15.5px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.achGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ach { display: flex; flex-direction: column; padding: 10px 11px; background: var(--card); border-radius: 13px; border: 1px solid rgba(190,226,232,.1); }
.ach.done { border-color: rgba(242,193,78,.75); background: linear-gradient(150deg, #2d5a6c, #1d4256); }
.ach .medal { width: 26px; height: 26px; margin-bottom: 5px; filter: grayscale(1) brightness(.72); }
.ach.done .medal { filter: none; }
.ach .nm { font-size: 15px; font-weight: 700; line-height: 1.3; }
.ach .ds { font-size: 13.5px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
.ach .rw { display: flex; flex-direction: column; gap: 2px; margin-top: auto; padding-top: 8px; font-size: 13px; font-weight: 600; color: #f1dca7; }
.ach .rw .cost { font-size: 13px; }

#overlay { z-index: 7; position: absolute; inset: 0; background: rgba(6,24,34,.72); display: none; align-items: center; justify-content: center; padding: 22px; }
#overlay.on { display: flex; }
#ovBox { background: var(--sheet); border-radius: 18px; padding: 20px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
#ovBox h3 { margin: 0 0 8px; font-size: 20px; }
#ovBox p { margin: 0 0 8px; color: #d3e4e6; font-size: 14px; line-height: 1.55; }
#ovBox .big { width: 100%; margin-top: 10px; }

#picker { position: absolute; inset: 0; background: #10303e; display: none; flex-direction: column; padding: calc(16px + var(--safe-t)) 14px calc(14px + var(--safe-b)); overflow-y: auto; }
#picker.on { display: flex; }
#picker h2 { margin: 0; font-size: 20px; }
#picker .lead { margin: 4px 0 10px; color: var(--muted); font-size: 13.5px; }
/* 선장 고르기: 고른 선장 초상화(3:4)를 크게, 아래 네 명 목록을 누르면 바뀐다 */
#capHero { position: relative; flex: none; width: min(100%, 38vh); aspect-ratio: 5 / 6; margin: 0 auto; border-radius: 16px; overflow: hidden; background: #143444; box-shadow: 0 6px 20px rgba(0,0,0,.35), 0 0 0 1.5px rgba(226,196,130,.55); }
#capHero img, #capHero canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 78%; display: block; }
#capHero img { transition: opacity .25s; }
#capHero canvas { display: none; }
#capHero.noimg img { display: none; } #capHero.noimg canvas { display: block; }
#capInfo { position: absolute; left: 0; right: 0; bottom: 0; padding: 34px 14px 11px; background: linear-gradient(to bottom, rgba(10,30,40,0), rgba(10,30,40,.88) 45%); }
#capInfo .nm { font-size: 19px; font-weight: 800; color: #f2d48a; }
#capInfo .lk { font-size: 12px; color: rgba(255,255,255,.75); margin-top: 1px; }
#capInfo .ds { font-size: 13.5px; margin-top: 4px; }
#capGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.cap { background: var(--card); border: 2px solid transparent; border-radius: 12px; padding: 6px 2px 7px; text-align: center; }
.cap.on { border-color: var(--on); background: rgba(242,193,78,.12); }
.cap .th { position: relative; width: 44px; height: 44px; margin: 0 auto 4px; border-radius: 50%; overflow: hidden; background: #143444; box-shadow: 0 0 0 1.5px rgba(226,196,130,.6); }
/* 초상화에서 얼굴 둘레만: 3:4 그림을 두 배로 키워 얼굴(가로 57%, 세로 52% 근처)을 가운데로 */
.th img { position: absolute; width: 210%; height: auto; left: -70%; top: -88%; display: block; }
.th canvas { width: 100%; height: 100%; display: block; }
.cap .nm { font-size: 13px; font-weight: 700; color: var(--on); }
.cap .lk { font-size: 10.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; }
#capNames { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 6px 0; }
#capNames button { padding: 7px 2px; white-space: nowrap; border-radius: 10px; background: rgba(255,255,255,.08); font-size: 13.5px; }
#capNames button.on { background: var(--on); color: #203038; font-weight: 700; }
#capName { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.2); color: var(--text); }
#capGo { margin-top: 12px; flex: none; }
@media (max-height: 640px) { #capHero { width: min(100%, 30vh); } .cap .th { width: 36px; height: 36px; } #picker .lead { margin-bottom: 6px; } }
/* 출항 이야기: 그림 아래로 종이 한 장이 겹친 그림책 */

<script type="module">
import * as G from './logic.js';
import * as A from './art.js';
import * as SA from './art-ship.js';
import * as SH from './ship.js';
import { drawStoryScene, isJourney, storyImage, STORY_W, STORY_H } from './art-story.js';
import { createCreatures, drawSpeciesIcon } from './creatures.js';
import { createSound, readAudioPrefs, writeAudioPrefs, audible as heard } from './sound.js';
import { createMusic, moodOf, TRACKS } from './music.js';
import { worldOf } from './world.js';
import { VIEW, NO_GO, HULLS, HULL_TIERS, STAR_STEPS, MODULES, ROLES, RES, SPECIES, REGIONS, REGION_ORDER, ACHIEVEMENTS, TITLES, DECOR, PAINTS, CAL, CAPTAINS, STORIES, ITEMS, MAT_IDS, TRADE_IDS, SUPPLY, HERB, WORKSHOP, SEATS, TRAITS, WX, SAILCLOTH } from './data.js';

const $ = (id) => document.getElementById(id);
const view = $('view'), ctx = view.getContext('2d', { alpha: false });
const query = new URLSearchParams(location.search);
const SAVE_KEY = 'sailing-master-v1', AUDIO_KEY = 'sailing-master-audio';

// ── 저장 ──
function loadSave() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch { return null; }
  if (!raw) return null;
  const s = G.deserialize(raw);
  if (!s) { try { localStorage.setItem(SAVE_KEY + '.bad', raw); } catch { /* 무시 */ } }
  return s;
}
function save() { if (!started) return; try { localStorage.setItem(SAVE_KEY, G.serialize(S)); } catch { /* 저장 불가 환경에서도 게임은 계속 */ } }

const saved = loadSave();
let S = saved || G.newGame(Number(query.get('seed')) || (Date.now() % 100000));
let sc = A.createScene(S.region, G.findsOf(S)), creatures = createCreatures(worldOf(S.region)), sprite = SA.bakeShip(S.ship), bakedRev = S.rev;
const wake = new A.Wake();
const snd = createSound(), music = createMusic();
music.setRegion(S.region);
// 소리 설정: 음악·소리(효과음)·물바람 세 묶음, 각각 켜고 끄기 + 0~100. 예전 저장(켜고 끄기 둘)도 읽어요
let AP = readAudioPrefs(null);
try { AP = readAudioPrefs(JSON.parse(localStorage.getItem(AUDIO_KEY) || '{}')); } catch { /* 무시 */ }
function applyAudio() {
  music.setOn(AP.mus.on); music.setVolume(AP.mus.vol / 100);
  for (const k of ['fx', 'amb']) { snd.setOn(AP[k].on, k); snd.setVolume(k, AP[k].vol / 100); }
  $('snd').classList.toggle('off', !['mus', 'fx', 'amb'].some((k) => heard(AP[k])));
}
applyAudio();
const saveAudio = () => { try { localStorage.setItem(AUDIO_KEY, JSON.stringify(writeAudioPrefs(AP))); } catch { /* 무시 */ } };

let W = 0, H = 0, DPR = 1;
const cam = { x: S.boat.x, y: S.boat.y, zoom: Number(query.get('zoom')) || VIEW.zoomDefault, cy: 0 };
const pan = { x: 0, y: 0, idle: 99 };
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  view.width = Math.round(W * DPR); view.height = Math.round(H * DPR);
  sc.patterns = null; sc.bakedAt = null; sc.buf = null;
  cam.cy = H * 0.46;
}
window.addEventListener('resize', resize);
resize();
const toWorld = (sx, sy) => [cam.x + (sx - W / 2) / cam.zoom, cam.y + (sy - cam.cy) / (cam.zoom * VIEW.tiltY)];
const fmt = (o) => Object.entries(o).filter(([, v]) => v).map(([k, v]) => `${RES[k].icon}${v}`).join(' ') || '없음';

// ── 시작 ──
let started = false, paused = false;
$('titleGo').textContent = saved ? '눌러서 다시 바다로!' : '눌러서 출항하자!';
// 타이틀의 새로 시작: 저장이 있을 때만 보이고, 실수로 지우지 않게 두 번 눌러야 해요
const titleNew = $('titleNew');
if (saved) titleNew.classList.add('on');
let titleNewTimer = 0;
titleNew.addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  if (titleNew.classList.contains('arm')) { try { localStorage.removeItem(SAVE_KEY); } catch { /* 무시 */ } location.reload(); return; }

function drainEvents() {

  for (const ev of list) {
    switch (ev.type) {
      case 'stroke': {
        snd.play('stroke');
        const b = S.boat, ch = Math.cos(b.h), sh = Math.sin(b.h);
        for (const side of [-1, 1]) { const [lx, ly] = SA.oarBladeLocal(sprite, b.rowPhase, side); wake.ring(b.x + lx * ch - ly * sh, b.y + lx * sh + ly * ch, 1); }
        break;
      }
      case 'tack': showHint('맞바람이다! 지그재그로 뚫고 간다!', 2.4); break;
      case 'swing': snd.play('swing'); break;
      case 'ground': snd.play('ground'); showHint('쿵! 물가에 박았어! 선체가 좀 상했다고!', 2.6, true); break;
      case 'pick': snd.play(ev.shiny ? 'found' : 'pick'); wake.ring(ev.x, ev.y, 1); toast(ev.shiny ? `✨ ${ITEMS[ev.k].icon} ${ITEMS[ev.k].name} +${ev.n}!` : `${ITEMS[ev.k].icon} ${ITEMS[ev.k].name} +${ev.n}`); break;
      case 'letter': snd.play('found'); wake.ring(ev.x, ev.y, 1); overlay(`<h3>🍾 병 속 편지</h3><p>“${ev.name} 근처에 뭔가 있다네…”</p><p>해도에 ? 표시를 해 뒀어!</p>`); break;
      case 'spoiled': toast(`🤢 ${Object.entries(ev.gone).map(([k, n]) => `${SUPPLY[k].name} ${Math.round(n * 10) / 10}`).join(', ')} 상해서 버렸어!`); break;
      case 'herb': toast(`🌿 약초 씹고 기운 차렸다!${ev.left ? ` (남은 ${ev.left})` : ' 이제 없어!'}`); break;
      case 'holdFull': showHint('화물칸이 꽉 찼어! 항구로 돌아가자!', 3); break;
      case 'found': snd.play('found'); overlay(`<h3>🗺 ${ev.name}</h3><p>으하하! 새로운 곳을 찾았다!</p><p>${fmt(ev.give || {})}${ev.relic ? `</p><p>🏺 유물: <b>${ev.relic}</b> (도감에 모았다!)` : ''}${ev.blueprint ? `<br>📜 설계도: ${(MODULES[ev.blueprint] || HULLS[ev.blueprint]).name}` : ''}</p>`, '계속 가자!', null); break;
      case 'species': showHint(`📖 ${SPECIES[ev.id].name}! 도감에 적어 뒀어!`, 2.4); break;
      case 'ach': { snd.play('ach'); const a = ACHIEVEMENTS.find((q) => q.id === ev.id); toast(`🏆 ${a.name} 🪙+${a.coin}`); showHint(`🏆 ${a.name}${a.decor ? ` · ${DECOR[a.decor].name} 꾸미기 열림` : ''}`, 3); break; }
      case 'gustSoon': snd.play('warn'); showHint('돌풍이 온다! 돛 줄여, 어서!', 4, true); break;
      case 'gustOn': snd.play('gust'); showHint('돌풍이다! 꽉 잡아!', 2, true); break;
      case 'gustOff': showHint(ev.hurt > 0.005 ? `돌풍이 지나갔어. 선체 -${Math.round(ev.hurt * 100)}%, 손 좀 봐야겠는걸!` : '으하하! 돌풍쯤이야 거뜬하지!', 3); break;
      case 'heatOn': showHint(ev.shade ? '푹푹 찌는군! 그래도 그늘막이 있잖아!' : '푹푹 찐다! 기력이 빠져. 그늘막이 필요해!', 4, !ev.shade); break;

}

// ── 조선소: 15칸 사다리 ──
const starText = (n) => '★'.repeat(n) + '☆'.repeat(3 - n);
function yardStep(H) {

  const title = up ? `새 배: ${H.name} ★1` : `★${H.star} ${STAR_STEPS[H.star].name}`;
  const what = up ? `칸 ${SH.validCells(H.id).length} · 내구도 ${H.hp} · 정원 ${H.crew}명 · 옛 모듈은 값 절반 돌려받고 선원은 내려` : H.star === 3 ? `${STAR_STEPS[3].desc} · <b>${H.perk}</b>: ${H.perkDesc}` : `${STAR_STEPS[2].desc} · 칸 ${SH.validCells(C.id).length} → ${SH.validCells(H.id).length} · 길이 ${C.len} → ${H.len}m`;
  card.innerHTML = `<div class="l">${title}${costHtml(H.price)}</div><div class="ds">${what}</div><div class="need">${st.list.map((q) => `<div class="${q.ok ? 'ok' : 'no'}">${q.ok ? '✓' : '✗'} ${q.text}</div>`).join('')}</div>`;
  if (S.docked) {
    const b = el('button', st.ok ? '' : 'off', up ? `${H.name} 짓기` : `★${H.star} 올리기`);
    b.addEventListener('click', () => {
      const r = G.buildHull(S, H.id);
      if (!r.ok) { showHint(r.why, 2.5); return; }
      design.armed = null; design.sel = null; bakeIfNeeded(); drainEvents(); renderSheet();
    });
    card.append(b);
  } else card.append(el('div', 'ds', '배는 항구에서 짓는 거야, 친구!'));

}
function renderYard(body) {
  const C = HULLS[S.ship.hull], steps = G.buildSteps(S);
  for (const T of HULL_TIERS) {

    const row = el('div', `rung${now ? ' now' : past ? ' past' : !steps.some((h) => h.kind === T.kind) ? ' far' : ''}`);
    const star = now ? C.star : past ? 3 : 0, hasStep = steps.some((h) => h.kind === T.kind);
    const side = !T.kind ? `<div class="lk">🔒 ${T.space} 뱃길이 열리면</div>` : past ? '<div class="lk">지나온 배</div>' : !now && !hasStep ? '<div class="lk">아직 멀었어</div>' : `<div class="stars">${starText(star)}</div>`;
    row.innerHTML = `<div class="top"><div class="g">${T.grade}</div><div class="who"><div class="nm">${T.name}</div><div class="spc">${T.space}까지 가는 배</div></div>${side}</div>`;
    if (now) {
      row.append(el('div', 'info', `길이 <b>${C.len}m</b> · 칸 <b>${SH.validCells(C.id).length}</b> · 내구도 <b>${C.hp}</b> · 정원 <b>${C.crew}명</b>${C.perk ? `<br>${C.perk}: ${C.perkDesc}` : ''}`));
      const tools = el('div', 'tools'), b = el('button', '', S.docked ? '✎ 설계하러 가기' : '설계 보기');
      b.addEventListener('click', () => { design.edit = false; design.spec = false; openTab('ship', 'design'); });
      tools.append(b); row.append(tools);
    }
    if (open) for (const H of steps) if (H.kind === T.kind) row.append(yardStep(H));
    body.append(row);
  }
}

// ── 설계: 보기(배만) ↔ 고치기(✎, 아래에 모듈 서랍) ──
const design = { sel: null, rot: 0, armed: null, edit: false, spec: false };
const specKeys = (st) => ({ 적재: `${Math.round(st.load * 100)}%`, 복원력: `${Math.round(st.stability * 100)}%`, 화물: st.holdCap, 식량: st.foodCap, 정원: st.crewCap, 흘수: `${st.draft.toFixed(2)}m` });
// 모듈을 놓거나 뜯은 순간에는 바뀐 값만 잠깐 띄운다
function flashChange(before) {
  const after = specKeys(G.stats(S)), diff = Object.keys(after).filter((k) => after[k] !== before[k]).map((k) => `${k} ${after[k]}`);
  if (diff.length) showHint(diff.join(' · '), 1.8);
}
function renderDesign(body) {
  const st = G.stats(S), Hl = st.hull, docked = !!S.docked, edit = docked && design.edit;
  const planBox = el('div', 'dsnPlan'), cv = el('canvas'); cv.id = 'plan';
  planBox.append(cv); body.append(planBox);
  const btn = (txt, side, fn, on) => { const b = el('button', `dsnBtn${on ? ' on' : ''}`, txt); b.style[side[0]] = `${side[1]}px`; b.addEventListener('click', fn); planBox.append(b); };
  btn('✕', ['left', 12], () => { design.edit = false; design.spec = false; design.sel = null; design.armed = null; openTab('ship', 'yard'); });
  if (docked) btn(edit ? '✓' : '✎', ['right', 12], () => { design.edit = !edit; design.sel = null; design.armed = null; renderSheet(); }, edit);
  btn('ⓘ', ['right', docked ? 62 : 12], () => { design.spec = !design.spec; renderSheet(); }, design.spec);
  // 서랍을 먼저 붙여 남은 높이를 재고, 그 안에 배를 꽉 차게 그린다
  if (edit) body.append(designDrawer());
  const areaW = planBox.clientWidth || window.innerWidth, areaH = planBox.clientHeight || window.innerHeight * 0.6;
  // 뱃머리가 뾰족한 배는 위쪽 단추 사이로 올라가도 된다. 네모난 뗏목만 단추 아래에 둔다
  const usableH = Math.max(120, areaH - (Hl.kind === 'raft' ? 124 : 24));
  const scale = Math.min((areaW - 24) / (Hl.beam + 0.5), usableH / (Hl.len + 0.5));
  const cssW = areaW, cssH = areaH, dpr = Math.min(2.5, devicePixelRatio || 1);
  cv.width = cssW * dpr; cv.height = cssH * dpr; cv.style.width = `${cssW}px`; cv.style.height = `${cssH}px`;
  const g = cv.getContext('2d'), ox = cssW / 2 * dpr, oy = cssH / 2 * dpr, px = scale * dpr;
  const paintCol = PAINTS.hull[S.ship.paint.hull] || PAINTS.hull[0];
  // ★2로 늘어난 칸은 색을 달리해 연장 구획이 보이게 한다
  const first = HULLS[Hl.kind], off = Hl.star > 1 ? HULLS[`${Hl.kind}2`].rowOff || 0 : 0, oldCells = new Set(SH.validCells(first.id).map(([c, r]) => `${c},${r + off}`));
  const fits = (c, r) => design.sel && docked && SH.canPlace(S.ship, { id: design.sel, col: c, row: r, rot: design.rot });
  const draw = () => {
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
    SA.drawHullTop(g, S.ship.hull, px, ox, oy, paintCol);
    g.setTransform(1, 0, 0, 1, 0, 0);
    // 칸: 배 x → 화면 위, 배 y → 화면 오른쪽
    const cellPx = Hl.cell * px;
    for (const [c, r] of SH.validCells(S.ship.hull)) {
      const x = ox + SH.cellY(Hl, c) * px - cellPx / 2, y = oy - SH.cellX(Hl, r) * px - cellPx / 2;
      if (Hl.star > 1 && !oldCells.has(`${c},${r}`)) { g.fillStyle = 'rgba(120,200,235,.2)'; g.fillRect(x + 1, y + 1, cellPx - 2, cellPx - 2); }
      if (fits(c, r)) { g.fillStyle = 'rgba(242,193,78,.32)'; g.fillRect(x + 1, y + 1, cellPx - 2, cellPx - 2); }
      g.strokeStyle = 'rgba(255,255,255,.42)'; g.lineWidth = 1; g.strokeRect(x + 1, y + 1, cellPx - 2, cellPx - 2);
    }
    for (const m of S.ship.mods) {
      SA.drawModuleTop(g, m, S.ship.hull, px, ox, oy);
      g.setTransform(1, 0, 0, 1, 0, 0);
      const [mx, my] = SH.modulePos(S.ship.hull, m), M = MODULES[m.id];
      if (design.armed === m) { const [w, h] = SH.sizeOf(m); g.strokeStyle = '#f08a6e'; g.lineWidth = 3; g.strokeRect(ox + my * px - w * cellPx / 2, oy - mx * px - h * cellPx / 2, w * cellPx, h * cellPx); }
      g.font = `${Math.round(cellPx * 0.42)}px system-ui`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = '#fff'; g.fillText(M.icon, ox + my * px, oy - mx * px);
    }

  draw();
  const cellAt = (e) => {
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * dpr - ox, y = (e.clientY - r.top) * dpr - oy;
    return [Math.floor((x / px + Hl.cols * Hl.cell / 2) / Hl.cell), Math.floor((Hl.x0 + y / px) / Hl.cell)];
  };
  cv.addEventListener('pointerdown', (e) => {
    if (!docked) { showHint('배는 항구에 대고 고치는 거야, 친구!', 2); return; }
    if (!edit) { showHint('✎를 눌러야 고친다고!', 1.6); return; }
    const [col, r] = cellAt(e), before = specKeys(G.stats(S));
    if (design.sel) {
      const res = G.placeModule(S, design.sel, col, r, design.rot);
      if (res.ok) { snd.play('place'); bakeIfNeeded(); drainEvents(); renderSheet(); flashChange(before); } else showHint(res.why, 2);
      return;

    const m = SH.moduleAt(S.ship, col, r);
    if (!m) return;
    if (design.armed === m) { G.removeModule(S, col, r); design.armed = null; snd.play('place'); bakeIfNeeded(); renderSheet(); flashChange(before); } else { design.armed = m; renderSheet(); }
  });

}
// 계기: ⓘ를 누를 때만 잠깐 덮어 보여 준다
function designSpec(st, Hl) {

// 모듈 서랍: 고른 모듈 설명 + 가로로 넘기는 목록
function designDrawer() {
  const box = el('div', 'dsnDrawer');

  const info = el('div', 'modInfo');

  } else if (arm) {

      info.append(ub);

  const pal = el('div', 'palette');

    const open = G.isUnlocked(S, id);
    const need = M.future ? `${HULL_TIERS[(M.need.grade || 3) - 1].name}부터` : M.need.blueprint ? '설계도 필요' : M.need.grade && HULLS[S.ship.hull].grade < M.need.grade ? `${HULL_TIERS[M.need.grade - 1].name}부터` : M.need.region ? `${REGIONS[M.need.region]?.name || '앞바다'}부터` : '';
    const b = el('button', `mod${design.sel === id ? ' on' : ''}${open ? '' : ' lock'}`, `<div class="ic">${open ? M.icon : '🔒'}</div><div class="nm">${M.name}</div><div class="ct">${open ? costHtml(G.moduleCost(S, id)) : need}</div>`);

}

    ctx.fillStyle = '#d6443a'; ctx.beginPath(); ctx.moveTo(fx, fy - 20); ctx.lineTo(fx + 11, fy - 16); ctx.lineTo(fx, fy - 12); ctx.closePath(); ctx.fill();

  const noGo = NO_GO - (sprite.hull.pointing || 0);
  if (!S.route && !b.row && b.sailNow > 0.1 && b.twa < noGo + 0.45 && !S.docked) {
    const a = 1 - (b.twa - noGo) / 0.45, R = 13 * cam.zoom;
    ctx.save(); ctx.translate(sx(b.x), sy(b.y)); ctx.scale(1, VIEW.tiltY);
    ctx.fillStyle = `rgba(255,120,90,${0.13 * Math.min(1, a)})`;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, S.wind.from - noGo, S.wind.from + noGo); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  wake.draw(ctx, cam, W, DPR);

  const bx = sx(b.x), by = sy(b.y), st = shipState(bx, by, b.h, t, b.heel, cam.zoom);
  SA.drawShipOnWater(ctx, sprite, st, cam.zoom, bx, by);
  if (!S.docked) A.drawBowFoam(ctx, cam, W, DPR, b, Math.min(1, b.spd / 6), t, sprite.hull.len);
  creatures.draw(ctx, cam, W, H, DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const props = A.visibleProps(sc, cam, W, H);
  let shipDone = false;
  for (const p of props) {
    if (!shipDone && p.y > b.y) { SA.drawShip(ctx, sprite, st, cam.zoom, bx, by); shipDone = true; }
    if (p.find && !G.canSeeFind(S, p.find)) continue;
    A.drawProp(ctx, sc, cam, W, p, t);
    if (p.name && cam.zoom > 3.2) {
      ctx.font = '600 12px system-ui'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,30,40,.75)'; ctx.fillStyle = '#fff';
      const lx = sx(p.x), ly = sy(p.y) - (p.port ? 7.8 : 5) * cam.zoom;
      ctx.strokeText(p.name, lx, ly); ctx.fillText(p.name, lx, ly);
    }
  }
  if (!shipDone) SA.drawShip(ctx, sprite, st, cam.zoom, bx, by);

}
// 날씨 그림에 넘길 것: 배 자리, 안개 속 보이는 거리(화면 px), 항구 불빛, 번개, 바람 방향
function weatherView(bx, by) {
  const wx = S.weather, v = { x: bx, y: by, wind: S.wind.from, flash: flashA, tiltY: VIEW.tiltY };
  if (wx.fog > 0 && !S.docked) {
    v.clear = G.sightRange(S) * cam.zoom;
    v.lights = worldOf(S.region).ports.map((p) => [W / 2 + (p.x - cam.x) * cam.zoom, cam.cy + (p.y - cam.y) * cam.zoom * VIEW.tiltY]).filter(([x, y]) => x > -80 && x < W + 80 && y > -80 && y < H + 80);
    if (S.ship.decor.includes('lantern')) v.lantern = true;
  }
  return v;
}
// 타이틀: 지금 수역의 섬과 바다에 가장 높은 등급의 배. 연출 전용이라 실제 배 자리와 상태를 건드리지 않는다
let titleShip = null, titleTrees = null;
function renderTitle(t) {
  const list = REGIONS[S.region].islands, I = list.filter((q) => q.r <= 22).sort((a, b) => b.r - a.r)[0] || list[0];
  const zoom = Math.max(3.5, Math.min(10, W * 0.62 / (I.r * 2.2)));
  const tc = { x: I.x, y: I.y, zoom, cy: H * 0.42 };
  A.drawWater(ctx, sc, tc, W, H, t, S.wind, DPR);
  A.drawLand(ctx, sc, tc, W, H, DPR, false, false);
  A.drawShoreFoam(ctx, sc, tc, W, H, t, DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 섬에 나무를 심어 준다(지도의 나무는 작은 섬엔 드물다). 발견지는 그리지 않아 미리 보이지 않게 한다
  if (!titleTrees) {
    const w = worldOf(S.region);
    titleTrees = [];
    for (let i = 0; i < 70; i++) { const a = i * 2.4, q = Math.sqrt(i / 70) * I.r, x = I.x + Math.cos(a) * q, y = I.y + Math.sin(a) * q; if (w.dist(x, y) < -I.r * 0.42 && i % 3 !== 1) titleTrees.push({ x, y, kind: i % 3 ? 'oak' : 'pine', v: (i * 0.37) % 1, size: 0.78 + (i % 4) * 0.1 }); }
  }
  const scene = [...A.visibleProps(sc, tc, W, H).filter((p) => !p.find), ...titleTrees].sort((a, b) => a.y - b.y);
  for (const p of scene) A.drawProp(ctx, sc, tc, W, p, t);
  if (!titleShip) titleShip = SA.bakeShip(S.best || S.ship);
  // 길이에 맞춰 키워 등급이 높아도 잘리지 않는다
  const L = titleShip.hull.len, z = Math.min(20, W * 0.6 / L), x = W * 0.5, y = H * 0.68, h = 0.3;
  const st = shipState(x, y, h, t, titleShip.rig ? 0.06 : 0, z);
  Object.assign(st, { sailNow: titleShip.rig ? 1 : 0, boom: -0.62, luff: false, row: false, rudder: 0, capX: titleShip.hull.helmX, flagFrom: 2.8, crew: [] });
  SA.drawShipOnWater(ctx, titleShip, st, z, x, y);
  ctx.strokeStyle = 'rgba(255,255,255,.34)'; ctx.lineWidth = 1.6;
  for (const k of [1.06, 1.22]) { ctx.beginPath(); ctx.ellipse(x, y + 1.5, (L / 2) * z * k * Math.cos(h) + 8 * k, (titleShip.hull.beam / 2) * z * k * 0.9 + Math.sin(t * 1.3 + k * 9), 0, 0.15, Math.PI - 0.15); ctx.stroke(); }
  SA.drawShip(ctx, titleShip, st, z, x, y);
}
function renderPreview(t) {
  if (!previewCanvas || !sheet || sheet.active !== 'paint' || !document.body.contains(previewCanvas.g.canvas)) return;
  const { g, cw, dpr } = previewCanvas, z = 11;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#2b86a0'; g.fillRect(0, 0, cw, 190);
  const h = t * 0.35, x = cw / 2, y = 150;
  const st = shipState(x, y, h, t, 0, z, true);
  st.sailNow = G.stats(S).sailArea ? 1 : 0; st.boom = 0.6; st.luff = false; st.row = false; st.capX = sprite.hull.helmX; st.flagFrom = 0.4;
  SA.drawShipOnWater(g, sprite, st, z, x, y);
  SA.drawShip(g, sprite, st, z, x, y);
}
let flashA = 0, boltT = 4, bellT = 3;
function fxTimers(dt) {
  const b = S.boat;
  // 폭풍: 가끔 번개가 번쩍하고 조금 뒤에 천둥
  flashA = Math.max(0, flashA - dt * 5);
  if (S.weather.stormOn && !S.docked) { boltT -= dt; if (boltT <= 0) { flashA = 1; snd.play('thunder', 0.4 + Math.random() * 0.8); boltT = 6 + Math.random() * 8; } }
  // 안개: 가까운 항구(150m)에서 종소리가 방향을 알려 줘요
  if (S.weather.fog > 0.4 && !S.docked) { bellT -= dt; if (bellT <= 0) { bellT = 8 + Math.random() * 3; if (G.nearPort(S, 150)) snd.play('bell'); } }
  flapT -= dt;
  if (b.luff && flapT <= 0 && !S.docked) { snd.play('flap'); flapT = 1.3 + Math.random() * 1.6; }
  creakT -= dt;
  if (creakT <= 0) { snd.play('creak'); creakT = 3.5 + Math.random() * 6; }
  // 노래꾼이 타고 있으면 평소 항해 때 가끔 지금 곡의 조로 흥얼거린다
  if (!S.docked && music.mood === 'sail' && S.crew.some((c) => c.trait === 'singer')) {
    singT -= dt;
    if (singT <= 0) { const T = TRACKS[music.track] || TRACKS.river; snd.play('sing', 0, T.root, T.scale); singT = 50 + Math.random() * 50; }
  }
}
// 항구에 있는 동안(항구 시트가 떠 있어도) 조선소 쪽에서 멀리 망치질 소리
function portTimers(dt) {
  if (!started || !S.docked) return;
  yardT -= dt;
  if (yardT <= 0) { snd.play('hammer', 0, 0.35); yardT = 6 + Math.random() * 9; }
}
let singT = 40 + Math.random() * 40, yardT = 3;

const fpsBox = $('fps');
if (query.get('fps')) fpsBox.style.display = 'block';
let fN = 0, fT = 0, saveT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = Math.min(0.25, (now - last) / 1000);
  last = now;
  if (paused || !W || !H) return; // 창 크기가 0이면 그릴 곳이 없다(숨은 창에서 열릴 때)
  const hold = !started || !!sheet || overlayOpen() || audioOpen() || $('picker').classList.contains('on') || $('story').classList.contains('on');
  if (!hold) {
    acc += raw;
    let n = 0;
    while (acc >= STEP && n < 12) { tick(); acc -= STEP; n++; }
    if (n === 12) acc = 0;
    drainEvents();
    fxTimers(raw);
    creatures.update(raw, cam, W, H, S.boat, G.stats(S).telescope);
    saveT += raw;
    if (saveT > 5) { saveT = 0; save(); }
  } else { S.t += raw * 0.6; S.wind = G.windNow(S); } // 시트가 떠 있어도 물은 흐른다
  portTimers(raw);
  if (!started) renderTitle(now / 1000);
  else { camera(raw); render(); }
  renderPreview(now / 1000);
  updateHud(raw);
  if (!sheet) syncTabs();
  if (query.get('fps')) { fN++; fT += raw; if (fT >= 1) { fpsBox.textContent = `${Math.round(fN / fT)} fps`; fN = 0; fT = 0; } }
}
document.addEventListener('visibilitychange', () => {
  paused = document.hidden;
  if (paused) { save(); snd.pause(); music.pause(); } else { snd.resume(); music.resume(); last = performance.now(); acc = 0; }
});
window.addEventListener('pagehide', save);
syncButtons(); syncTop(); syncTabs();
requestAnimationFrame(frame);

// 서비스 워커(독립 실행)
if ('serviceWorker' in navigator && !query.get('dbg') && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.serviceWorker.controller) {
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading) return; reloading = true; save(); location.reload(); });
  }
}

// 점검용 창구(?dbg=1): 자동 확인이 상태를 읽고 조작할 때 씁니다
if (query.get('dbg')) window.SM = { openStory, showStoryPage, story, openTab, get S() { return S; }, get creatures() { return creatures; }, get sc() { return sc; }, G, SH, cam, snd, music, render, renderTitle, worldOf, design, get sheet() { return sheet; }, drainEvents, bakeIfNeeded, openPort, closeSheet, renderSheet, changeRegionArt, openGate, tapWorld, openAudio, closeAudio, get AP() { return AP; } };
</script>
