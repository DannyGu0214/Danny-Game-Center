<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sailing Master</title>
<meta name="theme-color" content="#123a4c">
<style>
:root { color-scheme: dark; --ink: #10303e; --panel: rgba(13,42,56,.82); --line: rgba(190,226,232,.22); --text: #f1f6f2; --muted: #a6c4cb; --on: #f2c14e; --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; color: var(--text); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; user-select: none; -webkit-user-select: none; overscroll-behavior: none; word-break: keep-all; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#hud { position: absolute; left: 10px; right: 10px; top: calc(10px + var(--safe-t)); display: flex; gap: 8px; align-items: stretch; pointer-events: none; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
#windCard { display: flex; align-items: center; gap: 9px; padding: 6px 12px 6px 7px; }
#compass { width: 46px; height: 46px; position: relative; border-radius: 50%; background: rgba(255,255,255,.08); flex: none; }
#compass span { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); font-size: 9px; color: var(--muted); line-height: 1; }
#arrow { position: absolute; inset: 0; transition: transform .4s linear; }
.num { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.2; }
#speedCard { padding: 8px 13px; display: flex; flex-direction: column; justify-content: center; min-width: 86px; }
#staminaWrap { flex: 1; padding: 8px 12px; display: none; flex-direction: column; justify-content: center; min-width: 0; }
#staminaWrap.on { display: flex; }
#staminaBar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.14); margin-top: 6px; overflow: hidden; }
#staminaFill { height: 100%; width: 100%; background: #7fd18c; transition: width .3s; }
#snd { margin-left: auto; width: 46px; pointer-events: auto; font-size: 20px; flex: none; }

#hint { position: absolute; left: 50%; top: calc(82px + var(--safe-t)); transform: translateX(-50%); max-width: calc(100% - 28px); width: max-content; padding: 7px 14px; border-radius: 14px; background: rgba(9,30,42,.72); font-size: 13.5px; text-align: center; opacity: 0; transition: opacity .3s; pointer-events: none; }
#hint.on { opacity: 1; }

#panel { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(12px + var(--safe-b)); background: linear-gradient(to top, rgba(10,34,46,.94) 70%, rgba(10,34,46,0)); }
#controls { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 11px; align-items: stretch; }
.seg { display: grid; grid-template-columns: auto 1fr 1fr 1fr; align-items: center; border-radius: 12px; overflow: hidden; }
.seg .lab { padding: 0 11px; font-size: 12.5px; color: var(--muted); }
.seg button { height: 44px; font-size: 14px; border-left: 1px solid var(--line); }
.seg button.on { background: var(--on); color: #203038; font-weight: 700; }
#oar { width: 72px; height: 46px; font-size: 14px; border-radius: 12px; }
#oar.on { background: var(--on); color: #203038; font-weight: 700; border-color: var(--on); }
#rudderWrap { position: relative; height: 56px; touch-action: none; display: flex; align-items: center; border-radius: 14px; }
#rudderWrap .lab { position: absolute; font-size: 12px; color: var(--muted); top: 50%; transform: translateY(-50%); pointer-events: none; }
#track { position: absolute; left: 30px; right: 30px; top: 50%; height: 4px; margin-top: -2px; background: rgba(255,255,255,.2); border-radius: 2px; }
#notch { position: absolute; left: 50%; top: -6px; width: 2px; height: 16px; background: rgba(255,255,255,.45); margin-left: -1px; }
#knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: #f5eedd; color: #3a3224; display: flex; align-items: center; justify-content: center; font-size: 21px; box-shadow: 0 2px 8px rgba(0,0,0,.35); pointer-events: none; }
#rudderWrap.auto #knob { background: #b9d7d8; }
#routeBtn { display: none; }

#title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(to bottom, rgba(10,44,62,.78), rgba(10,44,62,.34) 45%, rgba(10,44,62,.78)); }
#title h1 { margin: 0; font-size: 42px; letter-spacing: .01em; font-weight: 800; text-shadow: 0 3px 16px rgba(0,0,0,.35); }
#title p { margin: 10px 0 0; color: #d8ebec; font-size: 15px; }
#title .go { margin-top: 34px; font-size: 16px; font-weight: 700; color: var(--on); animation: blink 1.8s infinite; }
#title .tag { position: absolute; bottom: calc(26px + var(--safe-b)); font-size: 12px; color: var(--muted); }
@keyframes blink { 50% { opacity: .35; } }
body.intro #hud, body.intro #panel { visibility: hidden; }
#fps { position: absolute; right: 12px; top: calc(74px + var(--safe-t)); font: 11px ui-monospace, monospace; background: rgba(0,0,0,.55); padding: 3px 6px; border-radius: 6px; display: none; }
</style>
</head>
<body class="intro">
<canvas id="view"></canvas>

<div id="hud">
  <div class="card" id="windCard">
    <div id="compass"><span>북</span>
      <svg id="arrow" viewBox="0 0 46 46"><path d="M23 9 L30 30 L23 25 L16 30 Z" fill="#9fd9ea"/></svg>
    </div>
    <div><div class="num" id="windNum">0</div><div class="sub" id="windDir">바람</div></div>
  </div>
  <div class="card" id="speedCard"><div class="num" id="spdNum">0.0</div><div class="sub">노트</div></div>
  <div class="card" id="staminaWrap"><div class="sub" style="margin:0">체력</div><div id="staminaBar"><div id="staminaFill"></div></div></div>
  <button class="card" id="snd" aria-label="소리">🔊</button>
</div>
<div id="hint"></div>
<div id="fps"></div>

<div id="panel">
  <div id="controls">
    <div class="seg card" id="sailSeg">
      <span class="lab">돛</span>
      <button data-lv="0">내림</button><button data-lv="1">줄임</button><button data-lv="2">전체</button>
    </div>
    <button class="card" id="oar">🚣 노</button>
  </div>
  <div class="card" id="rudderWrap">
    <span class="lab" style="left:11px">좌</span><span class="lab" style="right:11px">우</span>
    <div id="track"><div id="notch"></div></div>
    <div id="knob">☸</div>
  </div>
</div>

<div id="title">
  <h1>Sailing Master</h1>
  <p>작은 호수에서 시작하는 항해</p>
  <div class="go">화면을 눌러 출항</div>
  <div class="tag">M0 손맛 시제품 · Danny Soft</div>
</div>

<script type="module">
import * as G from './logic.js';
import * as A from './art.js';
import * as SA from './art-ship.js';
import { createSound } from './sound.js';
import { VIEW, BOAT, NO_GO, SAIL_LEVELS } from './data.js';

const $ = (id) => document.getElementById(id);
const view = $('view'), ctx = view.getContext('2d', { alpha: false });
const query = new URLSearchParams(location.search);
const S = G.newGame(Number(query.get('seed')) || 1);
const sc = A.createScene();
const bakeT0 = performance.now();
const sprite = SA.bakeShip();
const bakeMs = performance.now() - bakeT0;
const wake = new A.Wake();
const snd = createSound();

let W = 0, H = 0, DPR = 1;
const cam = { x: S.boat.x, y: S.boat.y, zoom: Number(query.get('zoom')) || VIEW.zoomDefault, cy: 0 };
const pan = { x: 0, y: 0, idle: 99 }; // 끌어서 둘러본 만큼
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  view.width = Math.round(W * DPR); view.height = Math.round(H * DPR);
  sc.patterns = null;
  cam.cy = H * 0.5;
}
window.addEventListener('resize', resize);
resize();

const toWorld = (sx, sy) => [cam.x + (sx - W / 2) / cam.zoom, cam.y + (sy - cam.cy) / (cam.zoom * VIEW.tiltY)];

let started = false, paused = false;
$('title').addEventListener('pointerdown', () => {
  started = true; $('title').style.display = 'none'; document.body.classList.remove('intro');
  snd.unlock();
  G.setSail(S, 2); syncButtons(); snd.play('sail');
  showHint('물을 탭하거나 아래 키로 몰아요', 5);
});

// ── 항구 없는 시제품이라 저장은 하지 않아요 ──
let hintT = 0;
function showHint(text, sec = 3) { $('hint').textContent = text; $('hint').classList.add('on'); hintT = sec; }

// 돛·노·소리 버튼
function syncButtons() {
  for (const b of $('sailSeg').querySelectorAll('button')) b.classList.toggle('on', Number(b.dataset.lv) === S.boat.sailLevel);
  $('oar').classList.toggle('on', S.boat.row);
  $('staminaWrap').classList.toggle('on', S.boat.row || S.boat.stamina < 0.99);
}
$('sailSeg').addEventListener('pointerdown', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  G.setSail(S, Number(b.dataset.lv)); snd.play(S.boat.sailLevel ? 'sail' : 'flap'); syncButtons();
});
$('oar').addEventListener('pointerdown', () => { G.setRow(S, !S.boat.row); syncButtons(); });
$('snd').addEventListener('pointerdown', () => { snd.unlock(); snd.setOn(!snd.on); $('snd').textContent = snd.on ? '🔊' : '🔇'; });
syncButtons();

// 키 슬라이더: 끄는 동안만 돌고, 놓으면 가운데로 돌아와요
const wrap = $('rudderWrap'), knob = $('knob');
let rudderPtr = null;
function rudderFrom(e) {
  const r = wrap.getBoundingClientRect(), half = r.width / 2 - 30;
  return Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / half));
}
wrap.addEventListener('pointerdown', (e) => { rudderPtr = e.pointerId; wrap.setPointerCapture(e.pointerId); G.setRudder(S, rudderFrom(e)); });
wrap.addEventListener('pointermove', (e) => { if (e.pointerId === rudderPtr) G.setRudder(S, rudderFrom(e)); });
const rudderEnd = (e) => { if (e.pointerId === rudderPtr) { rudderPtr = null; G.setRudder(S, 0); } };
wrap.addEventListener('pointerup', rudderEnd);
wrap.addEventListener('pointercancel', rudderEnd);

// 물 화면: 탭 = 목적지, 끌기 = 둘러보기, 두 손가락 = 확대
const ptrs = new Map();
let tapStart = null, pinch = null, zoomingUntil = 0;
function zoomAbout(zNew, sx, sy) {
  zNew = Math.max(VIEW.zoomMin, Math.min(VIEW.zoomMax, zNew));
  const [wx, wy] = toWorld(sx, sy);
  cam.zoom = zNew;
  pan.x += wx - (cam.x + (sx - W / 2) / cam.zoom);
  pan.y += wy - (cam.y + (sy - cam.cy) / (cam.zoom * VIEW.tiltY));
  pan.idle = 0;
  zoomingUntil = performance.now() + 220;
}
view.addEventListener('pointerdown', (e) => {
  view.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) tapStart = { x: e.clientX, y: e.clientY, moved: false, t: performance.now() };
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: cam.zoom };
    tapStart = null;
  }
});
view.addEventListener('pointermove', (e) => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId);
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    zoomAbout(pinch.z * d / pinch.d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    return;
  }
  if (tapStart && Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) > 10) tapStart.moved = true;
  if (tapStart && tapStart.moved) {
    pan.x -= (e.clientX - prev[0]) / cam.zoom;
    pan.y -= (e.clientY - prev[1]) / (cam.zoom * VIEW.tiltY);
    pan.idle = 0;
  }
});
const pointerEnd = (e) => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (tapStart && !tapStart.moved && ptrs.size === 0) {
    const [x, y] = toWorld(e.clientX, e.clientY);
    if (G.setDest(S, x, y)) {
      snd.play('tap'); syncButtons();
      if (!S.boat.row) showHint('바람에 맞춰 알아서 가요', 2.5);
    }
  }
  if (ptrs.size === 0) tapStart = null;
};
view.addEventListener('pointerup', pointerEnd);
view.addEventListener('pointercancel', pointerEnd);
view.addEventListener('wheel', (e) => { e.preventDefault(); if (e.ctrlKey) zoomAbout(cam.zoom * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY); else zoomAbout(cam.zoom * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
for (const evt of ['gesturestart', 'gesturechange']) document.addEventListener(evt, (e) => e.preventDefault(), { passive: false });

// 이벤트 → 소리·안내
function drainEvents() {
  for (const ev of S.events) {
    if (ev.type === 'stroke') {
      snd.play('stroke');
      const b = S.boat, ch = Math.cos(b.h), sh = Math.sin(b.h);
      for (const side of [-1, 1]) { const [lx, ly] = SA.oarBladeLocal(b.rowPhase, side); wake.ring(b.x + lx * ch - ly * sh, b.y + lx * sh + ly * ch, 1); }
    } else if (ev.type === 'tack') {
      showHint('지그재그로 맞바람을 거슬러 가요', 2.4);
    } else if (ev.type === 'swing') snd.play('swing');
    else if (ev.type === 'ground') { snd.play('ground'); showHint('물가에 닿았어요. 키를 돌려요', 2.6); }
    else if (ev.type === 'arrive') { snd.play('arrive'); syncButtons(); showHint('도착했어요', 2); }
  }
  S.events.length = 0;
}

const DIRS = ['동', '남동', '남', '남서', '서', '북서', '북', '북동'];
function compassName(a) { return DIRS[((Math.round(a / (Math.PI / 4)) % 8) + 8) % 8]; }
let hudT = 0, flapT = 0, creakT = 0, lastLuffHint = -99;
function updateHud(dt) {
  hudT -= dt;
  if (hintT > 0) { hintT -= dt; if (hintT <= 0) $('hint').classList.remove('on'); }
  if (hudT > 0) return;
  hudT = 0.15;
  const b = S.boat, w = S.wind;
  $('windNum').textContent = `${(w.speed * 1.94).toFixed(0)} kt`;
  $('windDir').textContent = `${compassName(w.from)}풍`;
  // 화살표는 바람이 불어 가는 쪽(from + 180°). 위를 보는 화살표라 90°를 더한다
  $('arrow').style.transform = `rotate(${w.from * 180 / Math.PI + 270}deg)`;
  $('spdNum').textContent = (b.spd * 1.94).toFixed(1);
  $('staminaFill').style.width = `${b.stamina * 100}%`;
  $('staminaWrap').classList.toggle('on', b.row || b.stamina < 0.99);
  wrap.classList.toggle('auto', !!S.route);
  const shown = S.route ? b.rudder : (rudderPtr !== null ? b.rudder : 0);
  const half = wrap.clientWidth / 2 - 30;
  knob.style.transform = `translateX(${shown * half}px) rotate(${shown * 70}deg)`;
  if (!S.route && !b.row && b.luff && b.spd < 2.2 && S.t - lastLuffHint > 9) { lastLuffHint = S.t; showHint('맞바람이에요. 옆으로 틀어요', 3); }
  if (b.stamina <= 0 && b.row && hintT <= 0) showHint('지쳐서 노가 느려져요', 3);
  snd.ambient(w.speed, b.spd);
  syncButtons();
}

// 고정 시간 단계 + 누적기
const STEP = G.FIXED_DT;
let acc = 0, last = performance.now();
function tick(dt) {
  const b = S.boat;
  G.step(S, STEP);
  const ch = Math.cos(b.h), sh = Math.sin(b.h);
  if (b.spd > 0.25) wake.update(STEP, b, b.x - ch * 4.5, b.y - sh * 4.5);
  else wake.update(STEP, { ...b, spd: 0 }, b.x, b.y);
  void dt;
}

function camera(dt) {
  const b = S.boat, vx = Math.cos(b.h) * b.spd, vy = Math.sin(b.h) * b.spd;
  pan.idle += dt;
  if (pan.idle > 3.5) { const k = 1 - Math.exp(-dt / 1.1); pan.x -= pan.x * k; pan.y -= pan.y * k; }
  // 시작 화면에서는 제목 아래로 배가 보이게 카메라를 북쪽으로 둔다
  const introY = started ? 0 : -H * 0.26 / (cam.zoom * VIEW.tiltY);
  const tx = b.x + vx * 1.6 + pan.x, ty = b.y + vy * 1.6 + pan.y + introY;
  const k = 1 - Math.exp(-dt / 0.75);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
}

// 프레임: 물 → 땅 → 항로·항적 → 나무와 배(깊이 순)
function render(dt) {
  const b = S.boat, t = S.t;
  A.drawWater(ctx, sc, cam, W, H, t, S.wind, DPR);
  A.drawLand(ctx, sc, cam, W, H, DPR, performance.now() < zoomingUntil);
  A.drawShoreFoam(ctx, sc, cam, W, H, t, DPR);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sx = (x) => W / 2 + (x - cam.x) * cam.zoom, sy = (y) => cam.cy + (y - cam.y) * cam.zoom * VIEW.tiltY;
  // 자동 항로 표시
  if (S.route) {
    const r = S.route;
    ctx.setLineDash([3, 8]); ctx.lineCap = 'round'; ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.moveTo(sx(b.x), sy(b.y));
    for (let i = r.i; i < r.pts.length; i++) ctx.lineTo(sx(r.pts[i].x), sy(r.pts[i].y));
    ctx.stroke(); ctx.setLineDash([]);
    const fx = sx(r.dx), fy = sy(r.dy), pulse = 1 + 0.2 * Math.sin(t * 3);
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(fx, fy, 10 * pulse, 10 * pulse * VIEW.tiltY, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - 20); ctx.stroke();
    ctx.fillStyle = '#d6443a'; ctx.beginPath(); ctx.moveTo(fx, fy - 20); ctx.lineTo(fx + 11, fy - 16); ctx.lineTo(fx, fy - 12); ctx.closePath(); ctx.fill();
  }
  // 맞바람 구역: 직접 몰 때 다가가면 보여 줘요
  if (!S.route && !b.row && b.sailNow > 0.1 && b.twa < NO_GO + 0.45) {
    const a = 1 - (b.twa - NO_GO) / 0.45, R = 13 * cam.zoom;
    ctx.save();
    ctx.translate(sx(b.x), sy(b.y)); ctx.scale(1, VIEW.tiltY);
    ctx.fillStyle = `rgba(255,120,90,${0.13 * Math.min(1, a)})`;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, S.wind.from - NO_GO, S.wind.from + NO_GO); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  wake.draw(ctx, cam, W, DPR);

  // 배의 자세: 물 위에서 천천히 흔들린다(바람이 셀수록 크게)
  const swell = 0.6 + S.wind.speed / 16;
  const bob = Math.sin(t * 1.25) * 0.09 * swell + Math.sin(t * 0.73 + 1) * 0.05 * swell;
  const pitch = Math.sin(t * 1.1 + 0.6) * 0.022 * swell + Math.min(0.03, b.spd * 0.004);
  const heel = b.heel + Math.sin(t * 0.93) * 0.015 * swell;
  const bx = sx(b.x), by = sy(b.y);
  const P = SA.makeProjector(bx, by, b.h, heel, pitch, cam.zoom, bob);
  const st = { P, h: b.h, heel, pitch, bob, sailNow: b.sailNow, boom: b.boom, luff: b.luff, t, row: b.row, rowPhase: b.rowPhase, flagFrom: S.wind.from, rudder: b.rudder };

  SA.drawShipOnWater(ctx, st, cam.zoom, bx, by);
  A.drawBowFoam(ctx, cam, W, DPR, b, Math.min(1, b.spd / 6), t);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // 깊이 순서: 나무(땅)와 배
  const props = A.visibleProps(sc, cam, W, H);
  let shipDone = false;
  for (const p of props) {
    if (!shipDone && p.y > b.y) { SA.drawShip(ctx, sprite, st, cam.zoom, bx, by); shipDone = true; }
    A.drawProp(ctx, sc, cam, W, p, t);
  }
  if (!shipDone) SA.drawShip(ctx, sprite, st, cam.zoom, bx, by);
  void dt;
}

// 짧은 효과음: 펄럭임은 맞바람일 때, 삐걱임은 가끔
function fxTimers(dt) {
  const b = S.boat;
  flapT -= dt;
  if (b.luff && flapT <= 0) { snd.play('flap'); flapT = 1.3 + Math.random() * 1.6; }
  creakT -= dt;
  if (creakT <= 0) { snd.play('creak'); creakT = 3.5 + Math.random() * 6; }
}

const fpsBox = $('fps');
if (query.get('fps')) fpsBox.style.display = 'block';
let fN = 0, fT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = Math.min(0.25, (now - last) / 1000);
  last = now;
  if (paused) return;
  if (started) {
    acc += raw;
    let n = 0;
    while (acc >= STEP && n < 12) { tick(STEP); acc -= STEP; n++; }
    if (n === 12) acc = 0;
    drainEvents();
    fxTimers(raw);
  } else S.t += raw; // 시작 화면에서도 물은 흐른다
  camera(raw);
  render(raw);
  updateHud(raw);
  if (query.get('fps')) { fN++; fT += raw; if (fT >= 1) { fpsBox.textContent = `${Math.round(fN / fT)} fps`; fN = 0; fT = 0; } }
}
document.addEventListener('visibilitychange', () => {
  paused = document.hidden;
  if (paused) snd.pause(); else { snd.resume(); last = performance.now(); acc = 0; }
});
requestAnimationFrame(frame);

// 점검용 창구(?dbg=1): 자동 확인이 상태를 읽고 조작할 때 씁니다
if (query.get('dbg')) window.SM = { S, G, cam, snd, BOAT, SAIL_LEVELS, wake, render, bakeMs };
</script>
</body>
</html>
