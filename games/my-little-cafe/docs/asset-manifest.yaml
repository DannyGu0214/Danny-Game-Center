    prompt: "Bust portrait in a realistic Japanese animated film style, clean line art, soft cel shading, front-facing, chest up, transparent background. A reserved Korean father in his mid sixties: short gray hair neatly combed, thin-rimmed glasses, slightly weathered face, a plain beige short-sleeved collared summer shirt. Stoic, quiet, almost expressionless face with a very faint softness in the eyes, mouth closed. Soft natural light. Should look like the father of a 35-year-old cafe owner and the husband of assets/mom-smile.webp (similar age and simple everyday clothing). No text, no logo, no watermark, no border."
