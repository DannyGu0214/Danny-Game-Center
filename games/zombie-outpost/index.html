<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>좀비 아웃포스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&family=Saira+Semi+Condensed:wght@600;700&display=swap">
<style>
/* Layout: 세로 한 화면 게임 — 쿼터뷰 캔버스가 화면을 채우고, HUD는 위에 떠 있고, 기지 관리는 아래에서 올라오는 시트로 연다.
   야간 생존 한 가지 분위기로 고정한 디자인이라 다크 단일 테마다. */
:root {
  color-scheme: dark;
  --ink: #0e1117;
  --panel: #181c24;
  --panel-2: #222833;
  --line: #343b48;
  --text: #ece6da;
  --muted: #98a1ac;
  --amber: #f2a93b;
  --red: #e0533f;
  --teal: #5bb8a7;
  --wood: #c9925a;
  --scrap: #b9c0ca;
  --plastic: #5aa9dc;
  --unique: #f07a4a;
  --xp: #a98bff;
  --rare: #6fa8ff;
  --epic: #f2c14e;
  --f-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "Saira Semi Condensed", "IBM Plex Sans KR", system-ui, sans-serif;
  --gutter-l: max(12px, env(safe-area-inset-left, 0px));
  --gutter-r: max(12px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--text); font-family: var(--f-body); font-size: 14px;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#app { position: relative; height: 100%; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* HUD */
.hud > * { min-width: 0; }
.hud {
  position: absolute; top: 0; left: 0; right: 0; z-index: 3; pointer-events: none;
  padding-top: 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  display: grid; gap: 6px;
}
.res-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.chip {
  display: grid; grid-template-columns: 9px minmax(0, 1fr); column-gap: 6px; align-items: center; min-width: 0;
  background: rgba(14, 17, 23, 0.82); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px 4px;
}
.chip i { width: 8px; height: 8px; border-radius: 2px; transform: rotate(45deg); grid-row: 1 / span 2; }
.chip b { font-family: var(--f-num); font-weight: 700; font-size: 15px; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip small { color: var(--muted); font-size: 10px; line-height: 1.2; font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-row { display: flex; gap: 6px; align-items: center; }
.bar {
  position: relative; flex: 1; min-width: 0; height: 20px; border-radius: 6px; overflow: hidden;
  background: rgba(14, 17, 23, 0.82); border: 1px solid var(--line);
}
.bar > span { position: absolute; inset: 0 auto 0 0; width: 0; transition: width .15s linear; }
.bar > em { position: relative; display: block; font-style: normal; font-size: 11px; line-height: 18px; padding: 0 7px; font-family: var(--f-num); font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
#hpBar > span { background: linear-gradient(90deg, #a63a2c, var(--red)); }
.lv-badge {
  flex: none; height: 20px; line-height: 18px; padding: 0 7px; border-radius: 6px;
  background: #241d33; border: 1px solid #4b3b75; color: var(--xp);
  font-family: var(--f-num); font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums;
}
.xpbar { height: 3px; border-radius: 2px; background: rgba(14, 17, 23, 0.82); overflow: hidden; margin-top: -3px; }
.xpbar > span { display: block; height: 100%; width: 0; background: var(--xp); transition: width .2s linear; }
#bagBar > span { background: linear-gradient(90deg, #6b5a3a, #a88a4e); }
#bagBar.full > span { background: linear-gradient(90deg, #8a5a1c, var(--amber)); }
.stat-row.wrap { flex-wrap: wrap; row-gap: 4px; }
.zone-tag {
  font-size: 11px; color: var(--muted); background: rgba(14, 17, 23, 0.82); border: 1px solid var(--line);
  border-radius: 6px; padding: 2px 7px; white-space: nowrap; line-height: 16px;
}
.zone-tag b { color: var(--text); font-weight: 600; }
.raid-pill {
  justify-self: start; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  background: rgba(14, 17, 23, 0.82); border: 1px solid var(--line); color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.raid-pill.on { color: #fff; background: rgba(150, 38, 28, 0.9); border-color: var(--red); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(224, 83, 63, 0.25); } }

#mini {
  position: absolute; z-index: 3; right: var(--gutter-r); top: 116px; width: 145px; height: 80px; pointer-events: none; /* 116×64에서 25% 확대, 위 상태 줄(아래 끝 112px)과 겹치지 않게 내림 */
}
/* 조작 버튼: 오른쪽 아래 아이템 바 바로 위에 50px 정사각형 세로 1열(메뉴 · 활동 반경 · 좀비 전략 · 자동사냥 · 총기 · 귀환).
   5칸이 화면 가운데까지 올라오지 않게 56px에서 줄였다. */
.side {
  position: absolute; z-index: 3; right: var(--gutter-r); bottom: calc(118px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: 50px; gap: 5px;
}
.sq {
  width: 50px; height: 50px; padding: 2px; border: 1px solid var(--line); border-radius: 10px;
  background: rgba(14, 17, 23, 0.86); display: grid; place-content: center; gap: 2px; text-align: center;
}
.sq small { font-size: 10px; color: var(--muted); line-height: 1.1; }
.sq b { font-size: 12px; line-height: 1.15; color: var(--text); word-break: keep-all; }
.sq.dim { opacity: .45; }
.sq.stance-aggressive { border-color: #7a2e24; }
.sq.stance-aggressive b { color: var(--red); }
.sq.stance-evasive { border-color: #1f5a50; }
.sq.stance-evasive b { color: var(--teal); }
.sq b:only-child { font-size: 13px; }
.sq.home { border-color: #1f5a50; }
.sq.home b { color: var(--teal); font-size: 14px; }
/* 가방이 가득 차면 귀환 버튼이 깜빡인다 */
.sq.home.alert { border-color: var(--amber); animation: homeBlink 0.9s ease-in-out infinite; }
.sq.home.alert b { color: var(--amber); }
/* 귀환 중이면 청록으로 채운다 */
.sq.home.going { background: rgba(91, 184, 167, 0.22); border-color: var(--teal); }
@keyframes homeBlink { 50% { background: rgba(242, 169, 59, 0.28); box-shadow: 0 0 0 4px rgba(242, 169, 59, 0.3); } }
@media (prefers-reduced-motion: reduce) { .sq.home.alert { animation: none; background: rgba(242, 169, 59, 0.2); } }
/* 자동사냥 스위치: 같은 정사각형 안에 이름과 토글 */
.switch { justify-items: center; }
.switch i { position: relative; width: 30px; height: 18px; border-radius: 9px; background: #3a414d; flex: none; transition: background .15s; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #c9ced6; transition: transform .15s; }
.switch.on { border-color: #6b4d1f; }
.switch.on small { color: var(--text); }
.switch.on i { background: var(--amber); }
.switch.on i::after { transform: translateX(12px); background: #1b1307; }
@media (prefers-reduced-motion: reduce) { .switch i, .switch i::after { transition: none; } }

#ctxBtn {
  position: absolute; z-index: 4; left: var(--gutter-l);
  bottom: calc(118px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - var(--gutter-l) - var(--gutter-r) - 60px);
  background: var(--amber); color: #1b1307; border: 0; border-radius: 10px; padding: 10px 16px;
  font-family: var(--f-display); font-size: 16px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
}
#ctxBtn small { display: block; font-family: var(--f-body); font-size: 11px; font-weight: 600; opacity: .8; margin-top: 2px; }
#ctxBtn:disabled { background: var(--panel-2); color: var(--muted); }

/* 아이템 바: 탭 바로 위, 필드에서 바로 쓴다 */
.items {
  position: absolute; z-index: 4; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
.item {
  position: relative; border: 1px solid var(--line); background: rgba(14, 17, 23, 0.86); border-radius: 9px;
  padding: 5px 2px 4px; font-size: 11px; font-weight: 600; display: grid; justify-items: center; gap: 2px; min-width: 0;
}
.item i { width: 14px; height: 14px; border-radius: 4px; display: block; }
.item b { position: absolute; top: -6px; right: -3px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--amber); color: #1b1307; font: 700 11px/18px var(--f-num); text-align: center; padding: 0 4px; }
.item:disabled { opacity: .45; cursor: default; }
.item:disabled b { background: #3a414d; color: var(--muted); }
.item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
#sheet:not([hidden]) ~ .items { display: none; }
.mbar { height: 6px; border-radius: 3px; background: #2d333e; overflow: hidden; grid-column: 1; }
.mbar span { display: block; height: 100%; background: var(--amber); }
.mbar.dur span { background: var(--teal); }
.mbar.dur.low span { background: var(--red); }
.tagline.uq { background: #3a2216; color: var(--unique); }
.tagline.lt { background: #1d2c3a; color: var(--plastic); }

/* 설정·스위치 변경 안내: 아래쪽, 오른쪽 조작 열 옆 남은 폭에 하나만(몰입 방해 최소화) */
#hints {
  position: absolute; z-index: 4; left: var(--gutter-l); right: calc(var(--gutter-r) + 60px);
  bottom: calc(118px + env(safe-area-inset-bottom, 0px));
  display: grid; justify-items: start; pointer-events: none;
}
#ctxBtn:not([hidden]) ~ #hints { bottom: calc(184px + env(safe-area-inset-bottom, 0px)); }
#sheet:not([hidden]) ~ #hints { display: none; }
.hint {
  max-width: 100%; background: rgba(14, 17, 23, 0.82); border: 1px solid var(--line); border-radius: 12px;
  padding: 4px 10px; font-size: 12px; line-height: 1.4; color: var(--muted); text-align: left;
  animation: hintIn .15s ease-out;
}
.hint b { color: var(--text); font-weight: 600; }
@keyframes hintIn { from { opacity: 0; transform: translateY(4px); } }

#toasts {
  position: absolute; z-index: 6; top: 120px; left: 50%; transform: translateX(-50%);
  width: min(340px, calc(100% - 32px)); display: grid; gap: 6px; pointer-events: none;
}
.toast {
  background: rgba(24, 28, 36, 0.95); border: 1px solid var(--line); border-left: 4px solid var(--muted);
  border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.4; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  animation: toastIn .18s ease-out;
}
.toast.good { border-left-color: var(--teal); }
.toast.bad { border-left-color: var(--red); }
.toast.warn { border-left-color: var(--amber); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } }

/* 하단 탭과 관리 시트 */
.tabs {
  position: absolute; z-index: 5; left: 0; right: 0; bottom: 0;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px;
  padding: 8px var(--gutter-r) calc(8px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  background: linear-gradient(180deg, rgba(14, 17, 23, 0) 0%, rgba(14, 17, 23, 0.92) 30%);
}
.tab {
  border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 0 6px; min-width: 0;
  font-family: var(--f-display); font-size: 14px; display: grid; justify-items: center; gap: 2px; white-space: nowrap;
}
.tab small { font-family: var(--f-body); font-size: 10px; color: var(--muted); }
.tab[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); background: #2a2216; }
.tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); }

#sheet {
  position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; max-height: 58%;
  display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--line);
  border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
  padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px));
}
.sheet-head {
  display: flex; align-items: center; gap: 10px; padding: 12px var(--gutter-r) 8px var(--gutter-l);
  border-bottom: 1px solid var(--line);
}
.sheet-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 20px; letter-spacing: .01em; }
.sheet-head p { margin: 0; color: var(--muted); font-size: 12px; flex: 1; min-width: 0; }
.x { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; width: 34px; height: 34px; flex: none; }
#sheetBody { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px var(--gutter-r) 12px var(--gutter-l); display: grid; gap: 8px; }

.limits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.limit { background: var(--panel-2); border-radius: 8px; padding: 6px 9px; font-size: 12px; color: var(--muted); }
.limit b { display: block; color: var(--text); font-family: var(--f-num); font-size: 16px; font-variant-numeric: tabular-nums; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center;
  padding: 9px 10px; background: var(--panel-2); border-radius: 10px; border: 1px solid transparent;
}
.row.hero { border-color: #5a4521; background: #2a2318; }
.row h3 { margin: 0; font-size: 15px; font-weight: 600; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.row h3 .lv { font-family: var(--f-num); color: var(--amber); font-size: 13px; }
.row p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; grid-column: 1; }
.row .acts { grid-row: 1 / span 3; grid-column: 2; display: grid; gap: 5px; justify-items: stretch; }
.cost { display: flex; flex-wrap: wrap; gap: 3px 8px; font-size: 12px; font-family: var(--f-num); font-variant-numeric: tabular-nums; grid-column: 1; }
.cost span { display: inline-flex; align-items: center; gap: 4px; }
.cost span::before { content: ""; width: 7px; height: 7px; border-radius: 1px; transform: rotate(45deg); background: currentColor; }
.cost .lack { color: var(--red); }
.cost .dur { color: var(--muted); }
.cost .dur::before { display: none; }
/* 진행 중인 건설·강화·제작·훈련: 남은 시간과 진행 막대 */
.job {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 8px; align-items: center;
  background: #2a2318; border: 1px solid #5a4521; border-radius: 10px; padding: 8px 10px; font-size: 12px; color: var(--muted);
}
.job b { color: var(--amber); font-weight: 600; }
.job [data-left] { font-family: var(--f-num); font-variant-numeric: tabular-nums; color: var(--text); font-weight: 700; font-size: 14px; }
.job .jbar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: #2d333e; overflow: hidden; }
.job .jbar span { display: block; height: 100%; width: 0; background: var(--amber); }
.act {
  border: 0; border-radius: 8px; padding: 8px 12px; min-width: 76px; background: var(--amber); color: #1b1307;
  font-weight: 600; font-size: 13px;
}
.act.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
.act.teal { background: var(--teal); color: #08201c; }
.act:disabled { background: #2d333e; color: #6f7884; border: 0; cursor: default; }
.tagline { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #2d333e; color: var(--muted); font-weight: 600; }
.tagline.def { background: #183a35; color: var(--teal); }
.tagline.exp { background: #3a2d18; color: var(--amber); }
.limits.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.crew-tools { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
/* 동료 능력치와 임무 선택 */
.stats { grid-column: 1; display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 12px; color: var(--muted); }
.stats b { color: var(--text); font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 600; }
.mission { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin-top: 3px; }
.mission .act { min-width: 0; padding: 7px 4px; border: 1px solid var(--line); }
.mission .act:disabled { border-color: transparent; }
.mission .act.on { background: var(--teal); color: #08201c; border-color: transparent; }
.mission .act.on[data-post="explore"] { background: var(--amber); color: #1b1307; }
.mission .act small { display: block; font-size: 10px; font-weight: 500; opacity: .75; }
.tagline.r1 { color: var(--rare); }
.tagline.r2 { color: var(--epic); }
.empty { color: var(--muted); font-size: 13px; line-height: 1.6; padding: 14px; text-align: center; background: var(--panel-2); border-radius: 10px; }
.section-label { font-size: 11px; letter-spacing: .08em; color: var(--muted); margin: 6px 2px 0; }

.modal {
  position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; background: rgba(5, 7, 11, 0.72);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
#overModal { z-index: 10; background: rgba(20, 4, 6, 0.82); }
#overModal.menu { background: rgba(5, 7, 11, 0.72); }
.card .rec-title { font-size: 11px; letter-spacing: .08em; color: var(--muted); margin-top: 2px; }
.gains .new { color: var(--amber); }
.gains .new::after { content: " 새 기록"; font-family: var(--f-body); font-size: 10px; font-weight: 600; }
.btn-row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
/* 메뉴의 소리 설정: 켜고 끄기 버튼 + 음량 막대(효과음·음악 따로) */
.audio { display: grid; gap: 8px; }
.arow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: center; }
.arow input[type=range] { width: 100%; accent-color: var(--amber); }
.arow input[type=range]:disabled { opacity: .4; }
.card { width: min(340px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 10px; }
.card h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
.gains { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.gains div { background: var(--panel-2); border-radius: 8px; padding: 7px 10px; font-size: 12px; color: var(--muted); }
.gains b { display: block; font-family: var(--f-num); font-size: 18px; color: var(--text); font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) {
  .raid-pill.on, .toast { animation: none; }
}
</style>

<div id="app">
  <canvas id="view" aria-label="쿼터뷰 필드. 화면을 끌어서 생존자를 움직여요"></canvas>

  <header class="hud">
    <div class="res-row">
      <div class="chip"><i style="background:var(--wood)"></i><b id="r-wood">0</b><small id="p-wood"></small></div>
      <div class="chip"><i style="background:var(--scrap)"></i><b id="r-scrap">0</b><small id="p-scrap"></small></div>
      <div class="chip"><i style="background:var(--plastic)"></i><b id="r-plastic">0</b><small id="p-plastic"></small></div>
      <div class="chip"><i style="background:var(--amber); border-radius: 50%"></i><b id="w-gun">맨손</b><small id="w-mag"></small></div>
    </div>
    <div class="stat-row">

<script type="module">
import * as G from './logic.js';
import * as A from './art.js';
import { createMusic } from './music.js';

const SAVE_KEY = 'zombie-outpost.v2';
const DT = 1 / 30;
const ISO_A = 0.7071, ISO_B = 0.3536; // 2:1 쿼터뷰(디메트릭) 투영
const TILE = 80;
const $ = (q) => document.querySelector(q);
const view = $('#view'), ctx = view.getContext('2d');
const mini = $('#mini'), mctx = mini.getContext('2d');
const shade = document.createElement('canvas'), sctx = shade.getContext('2d');
const RES_COLOR = { wood: '#c9925a', scrap: '#b9c0ca', plastic: '#5aa9dc' };
const ITEM_COLOR = { medkit: '#e0533f', molotov: '#f08a3a', toolbox: '#b9c0ca', flare: '#ff5d8f', energy: '#8fd14f', stim: '#6fd6e0' };
const ITEM_SHORT = { medkit: '구급상자', molotov: '화염병', toolbox: '공구', flare: '신호탄', energy: '드링크', stim: '스팀팩' };
const RARITY_COLOR = ['#9aa3ad', '#6fa8ff', '#f2c14e'];

let S = null;
let VW = 0, VH = 0, DPR = 1, zoom = 1;
const cam = { x: 0, y: 0, ready: false };

// ---------- 저장 ----------
function save() {
  if (!S) return;
  try { localStorage.setItem(SAVE_KEY, G.serialize(S)); } catch { /* 저장 불가 환경에서도 게임은 계속 */ }
  S.savedAt = Date.now();
}
function loadSaved() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch { return null; }
  if (!raw) return null;
  const s = G.deserialize(raw);
  if (!s) { try { localStorage.setItem(SAVE_KEY + '.bad', raw); } catch { /* 무시 */ } }
  return s;
}

// ---------- 클라우드 저장(쓸 수 있을 때만) ----------
// claude.ai에서 열면 내 계정 전용 경로(data/users/<id>/save)에도 저장해서 폰과 PC가 같은 진행을 쓴다.
// 로그인하지 않았거나 권한이 없으면 null이 오고, 이 브라우저 저장소만 쓴다.
const cloud = { ref: null, busy: false };
let bootSavedAt = 0;
async function initCloud() {
  try {
    const [user, db] = await Promise.all([window.claude?.use?.('user'), window.claude?.use?.('db')]);
    if (!user || !db) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc(`data/users/${id}/save`);
    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && typeof remote.save === 'string' && Number(remote.savedAt) > bootSavedAt + 2000) {
      const s = G.deserialize(remote.save);
      if (s) {
        S = s;
        cam.ready = false;
        afterOffline(G.applyOffline(S));
        toast('다른 기기에서 하던 진행을 불러왔어요', 'good');
      }
    }
    cloud.ref = ref;
    pushCloud();
  } catch { cloud.ref = null; }
}
async function pushCloud() {
  if (!cloud.ref || cloud.busy || !S) return;
  cloud.busy = true;
  try {
    await cloud.ref.set({ save: G.serialize(S), savedAt: Date.now() });
  } catch (e) {
    if (['invalid_argument', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'quota_exceeded'].includes(e?.code)) cloud.ref = null;
  } finally {
    cloud.busy = false;
  }
}

// ---------- 화면 크기 ----------
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = view.getBoundingClientRect();
  VW = r.width; VH = r.height;
  for (const c of [view, shade]) { c.width = Math.round(VW * DPR); c.height = Math.round(VH * DPR); }
  const m = mini.getBoundingClientRect();
  mini.width = Math.round(m.width * DPR); mini.height = Math.round(m.height * DPR);
  zoom = Math.max(0.8, Math.min(1.25, VW / 420));
  clearArt(); // 크기·배율이 바뀌면 미리 그린 그림을 새로 그린다
}
window.addEventListener('resize', resize);

// ---------- 투영 ----------
const isoX = (x, y) => (x - y) * ISO_A * zoom;
const isoY = (x, y) => (x + y) * ISO_B * zoom;
const anchorY = () => VH * 0.5;
function P(x, y, z = 0) {
  return [isoX(x, y) - cam.x + VW / 2, isoY(x, y) - cam.y + anchorY() - z * zoom];
}
function toWorld(sx, sy) {
  const u = (sx - VW / 2 + cam.x) / (ISO_A * zoom), v = (sy - anchorY() + cam.y) / (ISO_B * zoom);
  return [(u + v) / 2, (v - u) / 2];
}

// ---------- 입력: 화면 어디서든 끌면 떠다니는 조이스틱 ----------
const joy = { on: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
const JOY_R = 52;
view.addEventListener('pointerdown', (e) => {
  if (joy.on) return;
  Object.assign(joy, { on: true, id: e.pointerId, ox: e.clientX, oy: e.clientY, x: 0, y: 0 });
  try { view.setPointerCapture(e.pointerId); } catch { /* 무시 */ }
});
view.addEventListener('pointermove', (e) => {
  if (!joy.on || e.pointerId !== joy.id) return;
  const dx = e.clientX - joy.ox, dy = e.clientY - joy.oy, m = Math.hypot(dx, dy), k = m > JOY_R ? JOY_R / m : 1;
  joy.x = (dx * k) / JOY_R; joy.y = (dy * k) / JOY_R;
});
const joyEnd = (e) => { if (e.pointerId === joy.id) { joy.on = false; joy.x = joy.y = 0; } };
view.addEventListener('pointerup', joyEnd);
view.addEventListener('pointercancel', joyEnd);

// 화면 방향 → 월드 방향(투영의 역변환). 위로 밀면 화면 위쪽으로 걷는다.
function joyWorld() {
  const m = Math.hypot(joy.x, joy.y);
  if (!joy.on || m < 0.15) return null;
  const u = joy.x / ISO_A, v = joy.y / ISO_B;
  const wx = (u + v) / 2, wy = (v - u) / 2, n = Math.hypot(wx, wy) || 1;
  return { x: (wx / n) * Math.min(1, m), y: (wy / n) * Math.min(1, m) };
}

// ---------- 소리 ----------
// 파일 없이 Web Audio로 합성한다(외부 음원 차단·라이선스·용량 문제 없음).
// 브라우저 자동재생 정책상 첫 터치 때 AudioContext를 만들고 resume()한다(Chrome 자동재생 정책 문서).
const sfx = (() => {
  let ac = null, master = null, noiseBuf = null;
  let on = true, vol = 1; // vol: 메뉴의 효과음 음량(0~1)
  try { on = localStorage.getItem('zombie-outpost.sound') !== 'off'; } catch { /* 저장 불가 */ }
  const last = {}, stats = {};
  let voices = 0;
  const MAX_VOICES = 14;

  function unlock() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ac) {
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.69 * vol;
      master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  }
  // 같은 소리가 몰리면 간격을 둔다
  const gate = (key, ms) => {
    const t = performance.now();
    if (last[key] && t - last[key] < ms) return false;
    last[key] = t;
    return true;
  };
  const ready = () => on && ac && ac.state === 'running' && voices < MAX_VOICES;

  function out(vol, lowpass) {
    const g = ac.createGain();
    g.gain.value = vol;
    if (lowpass) {
      const f = ac.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = lowpass;
      g.connect(f); f.connect(master);
    } else g.connect(master);
    return g;
  }
  function env(node, t, peak, attack, dur) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g);
    return g;
  }
  function noise(dest, t, { dur, peak = 1, type = 'bandpass', f = 1000, f2, q = 1, attack = 0.004 }) {
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const bq = ac.createBiquadFilter();
    bq.type = type; bq.Q.value = q;
    bq.frequency.setValueAtTime(f, t);
    if (f2) bq.frequency.exponentialRampToValueAtTime(f2, t + dur);
    src.connect(bq);
    env(bq, t, peak, attack, dur).connect(dest);
    src.start(t, Math.random() * 0.5);
    src.stop(t + dur + 0.02);
    voices++;
    src.onended = () => { voices--; };
  }
  function tone(dest, t, { dur, peak = 1, type = 'sine', f, f2, attack = 0.003 }) {
    const o = ac.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    env(o, t, peak, attack, dur).connect(dest);
    o.start(t);
    o.stop(t + dur + 0.02);
    voices++;
    o.onended = () => { voices--; };
  }

  // 길게 이어지는 소리(사이렌·신호탄): 주파수를 [시각, Hz] 점들로 잇고, 올라와 유지하다 사라진다
  function glide(dest, t, { dur, peak = 1, type = 'sine', fs, attack = 0.02, release = 0.15 }) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    fs.forEach(([at, f], i) => (i ? o.frequency.linearRampToValueAtTime(f, t + at) : o.frequency.setValueAtTime(f, t + at)));
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.setValueAtTime(peak, t + dur - release); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest);
    o.start(t); o.stop(t + dur + 0.02);
    voices++;
    o.onended = () => { voices--; };
  }
  const mtof = (m) => 440 * 2 ** ((m - 69) / 12);

  // 총기 종류별 합성
  const GUN = {
    pistol: (d, t) => { noise(d, t, { dur: 0.12, peak: 0.9, type: 'highpass', f: 900 }); tone(d, t, { dur: 0.09, peak: 0.6, f: 140, f2: 60 }); },
    shotgun: (d, t) => { noise(d, t, { dur: 0.32, peak: 1, type: 'lowpass', f: 2400, f2: 400 }); tone(d, t, { dur: 0.2, peak: 0.8, f: 90, f2: 40 }); },
    rifle: (d, t) => { noise(d, t, { dur: 0.16, peak: 1, type: 'highpass', f: 1500 }); tone(d, t, { dur: 0.12, peak: 0.6, f: 180, f2: 70 }); noise(d, t + 0.05, { dur: 0.3, peak: 0.25, type: 'lowpass', f: 600 }); },
    auto: (d, t) => { noise(d, t, { dur: 0.07, peak: 0.7, type: 'highpass', f: 1200 }); tone(d, t, { dur: 0.06, peak: 0.4, f: 160, f2: 80 }); },
    bow: (d, t) => { tone(d, t, { dur: 0.18, peak: 0.5, type: 'triangle', f: 330, f2: 180 }); noise(d, t, { dur: 0.08, peak: 0.3, type: 'bandpass', f: 2500, q: 3 }); },
    nail: (d, t) => { noise(d, t, { dur: 0.06, peak: 1, type: 'bandpass', f: 2600, q: 1.5 }); tone(d, t, { dur: 0.05, peak: 0.6, type: 'square', f: 700, f2: 300 }); },
    flame: (d, t) => { noise(d, t, { dur: 0.24, peak: 1, type: 'lowpass', f: 900, f2: 1800, attack: 0.02 }); },
  };
  const GUN_OF = { pistol: 'pistol', shotgun: 'shotgun', rifle: 'rifle', carbine: 'auto', crossbow: 'bow', nailgun: 'nail', flamer: 'flame', savior: 'shotgun', milestone: 'rifle', prometheus: 'flame' };

  // 자원별 파밍 완료음
  const LOOT = {
    wood: (d, t) => { // 나무 두드림 "톡톡"
      for (const dt of [0, 0.09]) { noise(d, t + dt, { dur: 0.08, peak: 1, type: 'bandpass', f: 750, q: 3 }); tone(d, t + dt, { dur: 0.07, peak: 0.75, f: 240, f2: 180 }); }
    },
    scrap: (d, t) => { // 금속 "챙"
      for (const [f, p] of [[523, 0.35], [1347, 0.22], [2210, 0.15], [3120, 0.08]]) tone(d, t, { dur: 0.45, peak: p, type: 'sine', f });
      noise(d, t, { dur: 0.04, peak: 0.4, type: 'highpass', f: 3000 });
    },
    plastic: (d, t) => { // 속 빈 통 "뽁" + 바스락
      tone(d, t, { dur: 0.12, peak: 0.55, type: 'sine', f: 420, f2: 180 });
      for (const dt of [0.02, 0.06, 0.1]) noise(d, t + dt, { dur: 0.03, peak: 0.25, type: 'bandpass', f: 4200, q: 2 });
    },
  };

  // 상황 알림음: 습격·피격·처치·장전·레벨업·방벽·가방·습격 결과·발견
  const FX = {
    siren: (d, t) => { // 습격: 낮게 오르내리는 경보 두 번
      for (const s of [0, 1.3]) {
        glide(d, t + s, { dur: 1.2, peak: 0.5, type: 'sawtooth', fs: [[0, 300], [0.55, 620], [1.2, 300]], attack: 0.08, release: 0.3 });
        glide(d, t + s, { dur: 1.2, peak: 0.3, type: 'triangle', fs: [[0, 303], [0.55, 626], [1.2, 303]], attack: 0.08, release: 0.3 });
      }
    },
    hurt: (d, t) => { // 맞음: 둔탁한 "퍽" + 짧은 숨
      tone(d, t, { dur: 0.14, peak: 0.9, f: 130, f2: 55 }); noise(d, t, { dur: 0.08, peak: 0.6, type: 'lowpass', f: 500 });
      noise(d, t + 0.04, { dur: 0.16, peak: 0.25, type: 'bandpass', f: 1100, q: 0.8, attack: 0.03 });
    },
    kill: (d, t, o) => { // 처치: 쓰러지는 "쿵"(브루트는 더 묵직하게)
      const big = o.type === 'brute';
      noise(d, t, { dur: big ? 0.3 : 0.2, peak: 0.8, type: 'lowpass', f: 380, f2: 120 }); tone(d, t + 0.03, { dur: big ? 0.22 : 0.15, peak: 0.7, f: big ? 70 : 95, f2: 40 });
    },
    reload: (d, t) => { noise(d, t, { dur: 0.03, peak: 0.7, type: 'bandpass', f: 2200, q: 3 }); tone(d, t + 0.01, { dur: 0.04, peak: 0.3, type: 'square', f: 520, f2: 380 }); }, // 탄창 빼기 "탁"
    rack: (d, t) => { for (const [dt, f] of [[0, 3000], [0.09, 2400]]) { noise(d, t + dt, { dur: 0.035, peak: 0.8, type: 'bandpass', f, q: 4 }); tone(d, t + dt, { dur: 0.03, peak: 0.25, type: 'square', f: f / 3 }); } }, // 장전 끝 "철컥"
    empty: (d, t) => { noise(d, t, { dur: 0.02, peak: 0.7, type: 'highpass', f: 3500 }); tone(d, t, { dur: 0.015, peak: 0.3, type: 'square', f: 1600 }); }, // 빈 방아쇠 "틱"
    levelup: (d, t) => { [72, 76, 79, 84].forEach((m, i) => { const dur = i === 3 ? 0.7 : 0.25; tone(d, t + i * 0.09, { dur, peak: 0.45, type: 'triangle', f: mtof(m) }); tone(d, t + i * 0.09, { dur, peak: 0.15, f: mtof(m + 12) }); }); },
    wall: (d, t, o) => { // 방벽: 판자는 "쿵", 철판·콘크리트는 울림을 더한다
      noise(d, t, { dur: 0.16, peak: 0.9, type: 'lowpass', f: 650, f2: 200 }); tone(d, t, { dur: 0.12, peak: 0.6, f: 95, f2: 55 });
      if (o.metal) for (const f of [310, 740]) tone(d, t, { dur: 0.3, peak: 0.12, f });
    },
    bagfull: (d, t) => { for (const dt of [0, 0.17]) tone(d, t + dt, { dur: 0.12, peak: 0.4, type: 'square', f: 330, attack: 0.005 }); },
    win: (d, t) => { [60, 64, 67, 72].forEach((m, i) => tone(d, t + i * 0.12, { dur: 0.9 - i * 0.1, peak: 0.4, type: 'triangle', f: mtof(m) })); }, // 습격 막음: 밝게 올라가는 화음
    lose: (d, t) => { [55, 51, 48].forEach((m, i) => tone(d, t + i * 0.28, { dur: 0.6, peak: 0.4, type: 'sawtooth', f: mtof(m), f2: mtof(m) * 0.97 })); }, // 뚫림: 낮게 떨어지는 음
    item: (d, t) => { tone(d, t, { dur: 0.35, peak: 0.35, f: 1320 }); tone(d, t + 0.07, { dur: 0.4, peak: 0.3, f: 1980 }); }, // 아이템 "띵"

function updateFx(dt) {

    const arr = fx[k];
    for (const f of arr) f.t += dt;
    fx[k] = arr.filter((f) => f.t < life[k]);

  fx.hurt = Math.max(0, fx.hurt - dt * 1.6);

    if (p.t >= p.life) continue;
