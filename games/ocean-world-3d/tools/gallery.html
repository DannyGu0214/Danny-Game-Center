<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocean World 3D — P3 화풍 갤러리</title>
<style>
  :root { --ink: #1d3340; --panel: rgba(255, 255, 255, 0.84); --line: rgba(29, 51, 64, 0.14); --accent: #1f8fb0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3594ba; color: var(--ink);
    font: 13px/1.4 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  canvas#view { display: block; width: 100vw; height: 100vh; touch-action: none; }
  body.capture canvas#view { width: auto; height: auto; }
  body.capture #ui, body.capture #stats { display: none; }
  #ui { position: fixed; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(6px); max-width: min(560px, calc(100vw - 24px)); }
  #ui h1 { margin: 0 0 2px; font-size: 14px; }
  #ui .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  #ui .lab { min-width: 44px; opacity: 0.7; }
  #ui a, #ui button { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; text-decoration: none; cursor: pointer; }
  #ui a.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #stats { position: fixed; left: 12px; top: 12px; padding: 8px 10px; background: rgba(10, 25, 35, 0.72); color: #e8f6ff; border-radius: 10px;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; max-width: calc(100vw - 24px); overflow: hidden; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three-0.187.0/build/three.module.js",
  "three/addons/": "../vendor/three-0.187.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="stats"></div>
<div id="ui"><h1>P3 화풍 갤러리 — 보름달물해파리 · 몰디브흰동가리 · 장식 떼(푸른자리돔)</h1></div>
<script type="module" src="./gallery.js"></script>
</body>
</html>
