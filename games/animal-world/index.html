<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animal World</title>
<!-- 독립 실행(PWA): 홈 화면에 추가하면 주소창 없는 세로 전체 화면 앱 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8fcbe6">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Animal World">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 세로 한 화면 관찰 게임 — 쿼터뷰 캔버스가 화면을 채우고, 위에 HUD, 아래에 메뉴·지역 버튼.
   동물 목록·꾸미기·요청·앨범은 아래에서 올라오는 시트로 연다. 낮의 초원 한 가지 분위기라 밝은 단일 테마다. */
:root {
  color-scheme: light;
  --ink: #3b2f22;
  --muted: #7d6c57;
  --panel: #fffaf0;
  --panel-2: #f5ecd9;
  --line: #e4d5b7;
  --accent: #ec8a2c;
  --accent-ink: #ffffff;
  --green: #4f9a3a;
  --red: #c9503c;
  --blue: #3f8fc7;
  --gold: #e9a91e;
  --f-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --gutter: max(10px, env(safe-area-inset-left, 0px));
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: #cfe9ee; color: var(--ink); font-family: var(--f-body); font-size: 14px;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { cursor: default; }
#app { position: relative; height: 100%; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* HUD */
.hud {
  position: absolute; left: var(--gutter); right: var(--gutter); top: calc(var(--safe-t) + 8px);
  display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: stretch; pointer-events: none;
}
.hud > * { min-width: 0; background: rgba(255, 250, 240, 0.9); border: 1px solid rgba(160, 130, 90, 0.25); border-radius: 14px; padding: 6px 10px; box-shadow: 0 2px 6px rgba(80, 60, 30, 0.12); }
.pop { display: flex; flex-direction: column; justify-content: center; }
.pop .n { font-family: var(--f-display); font-size: 19px; line-height: 1; white-space: nowrap; }
.pop small { color: var(--muted); font-size: 11px; margin-top: 2px; white-space: nowrap; }
.dev .line { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; overflow: hidden; }
.dev .line b { font-family: var(--f-display); font-size: 16px; font-weight: 400; }
.hud .dev { pointer-events: auto; cursor: pointer; } /* 지역 이름 칸: 누르면 지역 고르기 */
.dev .caret { font-style: normal; color: var(--muted); font-size: 12px; margin-left: -3px; }
.item.here { border-color: var(--accent); background: #fff8ec; }
.tier { font-family: var(--f-display); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 1px 7px; font-size: 13px; }
.dev .line span:last-child { margin-left: auto; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.meter { height: 7px; border-radius: 4px; background: #eadfc8; margin-top: 5px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #8cc152, #4f9a3a); border-radius: 4px; transition: width .3s; }
.happy { display: flex; flex-direction: column; align-items: center; justify-content: center; }
.happy .n { font-family: var(--f-display); font-size: 15px; line-height: 1.1; }
.happy small { font-size: 10px; color: var(--muted); }
/* HUD 아래 한 줄: 진행일수·시간대 + 힌트 */
.subhud { position: absolute; left: var(--gutter); right: var(--gutter); top: calc(var(--safe-t) + 66px); display: flex; gap: 6px; align-items: center; pointer-events: none; }
.clock {
  flex: none; background: rgba(255, 250, 240, 0.9); border: 1px solid rgba(160, 130, 90, 0.25); border-radius: 12px; padding: 4px 10px;
  font: 13px var(--f-display); white-space: nowrap; box-shadow: 0 2px 6px rgba(80, 60, 30, 0.12);
}
.hint {
  min-width: 0; background: rgba(59, 47, 34, 0.78); color: #fff8ea; border-radius: 12px; padding: 5px 11px; font-size: 12.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* 아래 메뉴 위 한 줄: 소리 켜기·끄기(왼쪽), 확대 단계(오른쪽, 1× = 땅 전체가 한 화면) */
.controls { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 5px; }
.zoombar { display: flex; gap: 3px; background: var(--panel-2); border-radius: 12px; padding: 3px; }
.zoombar button { min-width: 40px; height: 32px; padding: 0 5px; border-radius: 9px; font: 14px var(--f-display); color: var(--muted); }
.zoombar button.on { background: var(--accent); color: var(--accent-ink); }
#soundbar button { font-size: 17px; }
#soundbar button.off { opacity: 0.4; }

/* 아래 메뉴 */
.bar {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 6px var(--gutter) calc(var(--safe-b) + 6px);
  background: linear-gradient(180deg, rgba(255, 250, 240, 0.95), #fffaf0); border-top: 1px solid var(--line); z-index: 5;
}
.menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.menu button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 0 4px; border-radius: 12px; font-size: 20px; line-height: 1.1; }
.menu button span { font-size: 11.5px; font-family: var(--f-display); color: var(--muted); }
.menu button.on { background: var(--panel-2); }
.menu button.on span { color: var(--ink); }
.dot { position: absolute; top: 2px; right: calc(50% - 22px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #fff; font: 11px/16px var(--f-display); }

/* 정보 카드·놓기 막대(메뉴 위에 뜬다) */
.float {
  position: absolute; left: var(--gutter); right: var(--gutter); bottom: calc(var(--bar-h, 110px) + 8px); z-index: 6;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; box-shadow: 0 6px 18px rgba(70, 50, 20, 0.2);
}
.card-top { display: flex; gap: 10px; align-items: center; }
.card-top canvas { width: 64px; height: 52px; flex: none; background: var(--panel-2); border-radius: 10px; }
.card-top h3 { margin: 0; font: 400 18px var(--f-display); }
.card-top p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.needs { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 0; }
.needs span { background: var(--panel-2); border-radius: 9px; padding: 3px 8px; font-size: 12px; }
.needs span.bad { background: #fbe1da; color: #9a3a26; }
.needs span.ok { background: #e3f1d6; color: #2f6a20; }
.row-btns { display: flex; gap: 6px; margin-top: 9px; }
.btn { flex: 1; border-radius: 11px; padding: 9px 6px; background: var(--panel-2); font-family: var(--f-display); font-size: 14px; }
.btn.main { background: var(--accent); color: var(--accent-ink); }
.btn.warn { background: #f6d9cf; color: #8a2f1c; }
.btn:disabled { opacity: 0.45; }
.placebar .ph { display: flex; align-items: center; gap: 10px; }
.placebar canvas { width: 48px; height: 40px; flex: none; }
.placebar b { font: 400 16px var(--f-display); }
.placebar p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

/* 시트 */
.sheet {
  position: absolute; left: 0; right: 0; bottom: var(--bar-h, 110px); z-index: 4; max-height: calc(100% - var(--bar-h, 110px) - var(--safe-t) - 92px); display: flex; flex-direction: column;
  background: var(--panel); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 24px rgba(70, 50, 20, 0.22); border-bottom: 1px solid var(--line);
}
.sheet > header { display: flex; align-items: baseline; gap: 8px; padding: 14px 14px 8px; }
.sheet h2 { margin: 0; font: 400 21px var(--f-display); }
.sheet header span { color: var(--muted); font-size: 12.5px; }
.sheet header button { margin-left: auto; width: 34px; height: 34px; border-radius: 17px; background: var(--panel-2); font-size: 15px; align-self: center; }
.tabs { display: flex; gap: 6px; padding: 0 14px 8px; }
.tabs button { padding: 6px 14px; border-radius: 16px; background: var(--panel-2); font-family: var(--f-display); }
.tabs button.on { background: var(--ink); color: var(--panel); }
.sheet .body { overflow-y: auto; padding: 0 12px 14px; -webkit-overflow-scrolling: touch; }
.item { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 14px; background: #fff; border: 1px solid var(--line); margin-bottom: 7px; }
.item canvas { width: 64px; height: 52px; background: var(--panel-2); border-radius: 10px; }
.item h4 { margin: 0; font: 400 16px var(--f-display); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.item p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.tag { font: 11px var(--f-body); padding: 1px 6px; border-radius: 7px; background: var(--panel-2); color: var(--muted); }
.tag.new { background: var(--red); color: #fff; }
.item .buy { min-width: 86px; border-radius: 11px; padding: 9px 8px; background: var(--accent); color: #fff; font: 15px var(--f-display); text-align: center; }
.item .buy:disabled { background: #e8dcc6; color: #9b8b74; }
.item .why { display: block; font-size: 10.5px; color: var(--muted); text-align: center; margin-top: 3px; max-width: 96px; }
.item.locked { opacity: 0.62; }
.req { padding: 10px 12px; border-radius: 14px; background: #fff; border: 1px solid var(--line); margin-bottom: 8px; }
.req h4 { margin: 0 0 6px; font: 400 16px var(--f-display); }
.req .meter { margin: 0 0 8px; }
.album { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.album div { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 8px; text-align: center; }
.album canvas { width: 100%; height: 70px; background: var(--panel-2); border-radius: 10px; }
.album b { display: block; font: 400 15px var(--f-display); margin-top: 4px; }
.album small { color: var(--muted); font-size: 11.5px; }

/* 알림 */
.modal { position: absolute; inset: 0; z-index: 20; background: rgba(40, 30, 15, 0.45); display: grid; place-items: center; padding: 20px; }
.modal .box { width: min(360px, 100%); background: var(--panel); border-radius: 20px; padding: 20px 18px 16px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); }
.modal h2 { margin: 0 0 8px; font: 400 25px var(--f-display); }
.modal p { margin: 6px 0; line-height: 1.55; color: var(--ink); }
.modal ul { text-align: left; margin: 8px 0 4px; padding-left: 20px; line-height: 1.6; }
.modal .btn { margin-top: 12px; width: 100%; }
.unlocks { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
.unlocks span { background: var(--panel-2); border-radius: 10px; padding: 4px 9px; font-size: 13px; }
#toasts { position: absolute; left: 0; right: 0; top: calc(var(--safe-t) + 96px); display: grid; justify-items: center; gap: 6px; pointer-events: none; z-index: 15; }
.toast { background: rgba(59, 47, 34, 0.9); color: #fff8ea; padding: 7px 14px; border-radius: 14px; font-size: 13.5px; animation: toast 2.4s forwards; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 12; }
.pop-num { position: absolute; transform: translate(-50%, -100%); font: 20px var(--f-display); color: #fff; text-shadow: 0 1px 0 #9a6a12, 0 2px 6px rgba(0, 0, 0, 0.35); animation: rise 1.3s ease-out forwards; white-space: nowrap; }
@keyframes rise { 0% { opacity: 0; margin-top: 6px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -40px; } }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 13; }
#flash.go { animation: flash .45s ease-out; }
@keyframes flash { 0% { opacity: 0.85; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pop-num, .toast { animation-duration: 0.01s; } #flash.go { animation: none; } }
</style>
<body>
<div id="app">
  <canvas id="view" aria-label="동물 지역 쿼터뷰. 동물이나 물건을 탭하면 정보가 보여요"></canvas>
  <header class="hud" id="hud">
    <div class="pop"><span class="n">⭐ <b id="pop">0</b></span><small id="rate">+0/분</small></div>
    <div class="dev" id="regionBtn" role="button" tabindex="0" aria-label="지역 고르기">
      <div class="line"><b id="rname">초원</b><i class="caret">▾</i><span class="tag new" id="rnew" hidden>NEW</span><span class="tier" id="tier">T1</span><span id="devtxt">발전도 0 / 60</span></div>
      <div class="meter"><i id="devbar"></i></div>
    </div>
    <div class="happy"><span class="n" id="happy">-</span><small>행복도</small></div>
  </header>
  <div class="subhud"><span class="clock" id="clock">🌅 1일차 · 아침</span><div class="hint" id="hint" hidden></div></div>
  </div>
  <div class="float card" id="card" hidden></div>
  <div class="float placebar" id="placebar" hidden>
    <div class="ph"><canvas id="placeIcon"></canvas><div><b id="placeName"></b><p id="placeInfo"></p></div></div>
    <div class="row-btns"><button class="btn" id="placeDone">완료</button><button class="btn main" id="placeGo">놓기</button></div>
  </div>
  <nav class="bar" id="bar">
    <div class="controls">
      <div class="zoombar" id="soundbar" role="group" aria-label="소리">
        <button id="musicBtn" aria-pressed="true" aria-label="배경음악">🎵</button><button id="sfxBtn" aria-pressed="true" aria-label="동물 소리">🔊</button>
      </div>
      <div class="zoombar" id="zoombar" role="group" aria-label="확대">
        <button data-z="0" class="on">1×</button><button data-z="1">1.5×</button><button data-z="2">2×</button><button data-z="3">3×</button><button data-z="4">4×</button>
      </div>
    </div>
    <div class="menu">
      <button data-open="animals" id="mAnimals">🦒<span>동물</span><i class="dot" hidden>N</i></button>
      <button data-open="decor" id="mDecor">🌳<span>꾸미기</span><i class="dot" hidden>N</i></button>
      <button data-open="requests" id="mRequests">📋<span>요청</span><i class="dot" hidden></i></button>
      <button data-open="album" id="mAlbum">📷<span>앨범</span></button>
    </div>
  </nav>
  <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
    <header><h2 id="sheetTitle"></h2><span id="sheetSub"></span><button id="sheetClose" aria-label="닫기">✕</button></header>
    <div class="tabs" id="sheetTabs" hidden></div>
    <div class="body" id="sheetBody"></div>
  </section>
  <div class="modal" id="modal" hidden><div class="box" id="modalBox"></div></div>
  <div id="toasts"></div>
  <div id="fx"></div>
  <div id="flash"></div>
</div>
<script type="module">
import * as G from './logic.js';
import { GRID, GW, GH, ISLE, MAX_TIER, TIERS, ECON, SIZE, SPECIES, ITEMS, REGIONS, NEED_NAME, NEED_ICON, caps, speciesOf, itemsOf, itemPrice, animalPrice } from './data.js';
import * as A from './art.js';
import { LEVEL, TERRAIN, heightAt, kindAt, allowedOn } from './terrain.js';
import { createMusic } from './music.js';
import { createSound } from './sound.js';

const $ = (s) => document.querySelector(s);
const view = $('#view'), ctx = view.getContext('2d');
// 땅·물건·동물은 따로 그려 시간대 빛을 입힌 뒤 하늘 위에 얹는다
const scene = document.createElement('canvas'), sctx = scene.getContext('2d');
const T = A.TILE, WG = GRID * T, ISO_A = A.ISO_A, ISO_B = A.ISO_B, SLAB = A.slabOf(WG), TOPZ = 3 * LEVEL + A.PEAK_EXTRA; // TOPZ = 가장 높은 지형(봉우리 꼭대기)
const SAVE_KEY = 'animal-world.save';
// 땅 범위(배율 1의 화면 좌표 u = (x−y)·ISO_A, v = (x+y)·ISO_B): 본섬만, 또는 앞쪽 T8 섬까지(섬은 본섬 왼쪽 아래로 붙는다)
const MAIN_BOX = { u0: -WG * ISO_A, u1: WG * ISO_A, v0: 0, v1: 2 * WG * ISO_B };
const FULL_BOX = { ...MAIN_BOX, u0: Math.min(MAIN_BOX.u0, (ISLE.x0 - ISLE.y1) * T * ISO_A), v1: Math.max(MAIN_BOX.v1, (ISLE.x1 + ISLE.y1) * T * ISO_B) };

let S = null;
const UI = { sheet: null, tab: 'terrain', place: null, sel: null, follow: null, zl: 0, zf: 1, cam: { x: 0, y: 0 }, seen: { animals: {}, decor: {}, regions: {} }, confirm: null };

// ---------- 저장 ----------
function save() {
  if (!S) return;
  try { localStorage.setItem(SAVE_KEY, G.serialize(S, Date.now())); S.savedAt = Date.now(); } catch { /* 저장 불가 환경에서도 게임은 계속 */ }
}
function load() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch { return null; }
  if (!raw) return null;
  const s = G.deserialize(raw);
  if (!s) { try { localStorage.setItem(SAVE_KEY + '.bad', raw); } catch { /* 무시 */ } }
  return s;
}
function loadSeen() {
  try { const o = JSON.parse(localStorage.getItem(SAVE_KEY + '.seen') || '{}'); return { animals: o.animals ?? {}, decor: o.decor ?? {}, regions: o.regions ?? {} }; } catch { return { animals: {}, decor: {}, regions: {} }; }
}
function saveSeen() { try { localStorage.setItem(SAVE_KEY + '.seen', JSON.stringify(UI.seen)); } catch { /* 무시 */ } }

// ---------- 화면 크기·투영 ----------
let VW = 0, VH = 0, DPR = 1, Z0 = 1, zoom = 1, cx = 0, cy = 0, horizon = 0, barTop = 0;
// VB = 1×에 화면에 맞추는 땅 범위(T8 섬이 열린 지역이면 섬까지), (uc, vc) = 그 가운데. 화면 (cx, cy)에 온다
let VB = MAIN_BOX, uc = 0, vc = WG * ISO_B;
const ny = () => (G.isleOpen(S, S.view) ? GH : GRID); // 지금 갈 수 있는 행 수(잠긴 섬은 뺀다)
// zoom = 지금 화면 배율(Z0 × UI.zf), artZoom = 땅·물건 그림을 마지막으로 그린 배율. 핀치하는 동안은 그 그림을 늘려 보여 주고, 손을 떼면 다시 그린다
let artZoom = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = view.getBoundingClientRect();
  VW = r.width; VH = r.height;
  view.width = Math.round(VW * DPR); view.height = Math.round(VH * DPR);
  scene.width = view.width; scene.height = view.height;
  const top = $('#hud').getBoundingClientRect().bottom + 24, bar = $('#bar').getBoundingClientRect();
  document.documentElement.style.setProperty('--bar-h', `${Math.round(bar.height)}px`);
  const availH = bar.top - top;
  barTop = bar.top;
  // 1× = 땅 전체(T8 섬이 열렸으면 섬까지)가 화면 폭(또는 높이)에 들어오는 배율
  VB = S && G.isleOpen(S, S.view) ? FULL_BOX : MAIN_BOX;
  const bw = VB.u1 - VB.u0, bh = VB.v1 - VB.v0;
  uc = (VB.u0 + VB.u1) / 2; vc = (VB.v0 + VB.v1) / 2;
  Z0 = Math.max(0.15, Math.min((VW - 16) / bw, (availH - 20) / (bh + SLAB + 80)));
  cx = VW / 2; cy = top + 80 * Z0 + (vc - VB.v0) * Z0 + (availH - 80 * Z0 - (bh + SLAB) * Z0) * 0.5;

function animalIcon(cv, sp, silhouette = false) {
  const w = cv.clientWidth || 64, h = cv.clientHeight || 52;
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  const g = cv.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const [hw, bh] = A.ANIMAL_BOX[sp], k = Math.min((h - 8) / bh, (w - 8) / (hw * 2.3));
  A.drawAnimal(g, sp, w / 2 - hw * k * 0.1, h - 4, k, { face: 1, st: 'idle', ph: 0.4, mv: 0, hd: 0, ly: 0, sp: -1 }, silhouette ? '#3b3127' : null);
}
function itemIcon(cv, id) {
  const w = cv.clientWidth || 64, h = cv.clientHeight || 52;
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  const g = cv.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const [r, ih] = A.ITEM_BOX[id], z = Math.min((w - 6) / (2 * r * 1.05), (h - 6) / (ih + r * 0.7));
  const ox = w / 2, oy = h - 4 - r * 0.35 * z;
  A.drawItem({ ctx: g, zoom: z, P: (x, y, zz = 0) => [ox + (x - y) * ISO_A * z, oy + (x + y) * ISO_B * z - zz * z] }, id, 1);
}

function regionIcon(cv, rid, locked) {
  const w = cv.clientWidth || 64, h = cv.clientHeight || 52;
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  const g = cv.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (locked) g.filter = 'grayscale(1) opacity(0.55)';
  const z = (w - 6) / (2 * WG * ISO_A), ox = w / 2, oy = (h - (2 * WG * ISO_B + SLAB) * z) / 2 + TOPZ * z * 0.5;
  A.drawIsland({ ctx: g, zoom: z, P: (x, y, zz = 0) => [ox + (x - y) * ISO_A * z, oy + (x + y) * ISO_B * z - zz * z] }, WG, GRID, A.PAL[rid], 3, rid);
}

  const its = itemsOf(rid).filter((i) => ITEMS[i].tier === tier).map((i) => `🆕 ${ITEMS[i].name}`);
  const unlockedRegion = REGIONS.find((r) => r.unlock && r.unlock.region === rid && r.unlock.tier === tier);
  modal(`<h2>🎉 ${def.name} T${tier}!</h2><p>종 한도 <b>${c.species}</b> · 개체 한도 <b>${c.animals}</b></p><p>새로 살 수 있어요(인기점수로 사요)</p><div class="unlocks">${[...sp, ...its].map((s) => `<span>${s}</span>`).join('')}</div>${tier === ISLE.tier ? '<p>🏝️ <b>새 섬이 열렸어요</b> — 다리를 건너 꾸며 보세요</p>' : ''}${unlockedRegion ? `<p>${unlockedRegion.icon} <b>${unlockedRegion.name}</b> 지역이 열렸어요${!unlockedRegion.ready ? ' (콘텐츠는 다음 업데이트)' : ''}</p>${unlockedRegion.ready ? `<button class="btn" data-go="${unlockedRegion.id}">${unlockedRegion.icon} ${josa(unlockedRegion.name, '으로', '로')} 가 보기</button>` : ''}` : ''}`);
}

// ---------- 변화 뒤 ----------
function afterChange() {
  sheetUpdate?.();
  if (UI.sel) renderCard();
  updatePlacebar();
  drainEvents();
  save();
}
function drainEvents() {
  const ev = S.events.splice(0);
  for (const e of ev) {
    if (e.type === 'tier') tierModal(e.region, e.tier);
    if (e.type === 'tier' && e.tier === ISLE.tier && e.region === S.view) { resize(); setZoom(0); } // 섬까지 한 화면에
    if (e.type === 'terrain') toast(`땅에 언덕·저지대·길이 생겼어요 — 물건 ${e.moved}개를 맞는 자리로 옮겼어요${e.refunded ? ` · ${e.refunded}개는 낸 값을 모두 돌려받았어요` : ''}`, 7000);
  }
}

// ---------- 소리 ----------
const sound = createSound(), music = createMusic();
const AUDIO_KEY = SAVE_KEY + '.audio', audio = { music: true, sfx: true };
try { Object.assign(audio, JSON.parse(localStorage.getItem(AUDIO_KEY) || '{}')); } catch { /* 저장 불가 */ }
const saveAudio = () => { try { localStorage.setItem(AUDIO_KEY, JSON.stringify(audio)); } catch { /* 저장 불가 */ } };
sound.setOn(audio.sfx);
function syncSoundBtns() {
  for (const [id, on, ico] of [['#musicBtn', audio.music, '🎵'], ['#sfxBtn', audio.sfx, audio.sfx ? '🔊' : '🔇']]) {
    const b = $(id); b.classList.toggle('off', !on); b.setAttribute('aria-pressed', String(on)); b.textContent = ico;
  }
}
$('#musicBtn').onclick = () => { audio.music = !audio.music; music.setOn(audio.music); saveAudio(); syncSoundBtns(); toast(audio.music ? '배경음악을 켰어요' : '배경음악을 껐어요'); };
$('#sfxBtn').onclick = () => { audio.sfx = !audio.sfx; sound.setOn(audio.sfx); saveAudio(); syncSoundBtns(); toast(audio.sfx ? '동물 소리를 켰어요' : '동물 소리를 껐어요'); };
// 첫 터치 때 소리를 켠다(모바일 자동재생 정책)
for (const evt of ['pointerdown', 'keydown']) window.addEventListener(evt, () => { sound.unlock(); music.start(sound.ctx); music.setOn(audio.music); }, { capture: true });
// 동물 소리: 화면 위치에 따라 좌우로, 확대할수록 조금 크게
function animalSound(a, kind, vol = 1) {
  if (!a) return;
  const [sx] = animalScreen(a);
  sound.play(a.sp, kind, { vol: vol * Math.min(1, 0.75 + 0.25 * (UI.zf - 1)), pan: ((sx / VW) * 2 - 1) * 0.7 });
}
let lastChance = null, ambientIn = 10;
// 특수 행동이 시작되면 그 동물의 special 소리, 가끔 보이는 동물 하나가 call 소리를 낸다
function soundTick(dt) {
  const R = S.regions[S.view];
  if (S.chance && S.chance.uid !== lastChance) { lastChance = S.chance.uid; animalSound(R.animals.find((b) => b.uid === S.chance.uid), 'special', 0.8); }
  else if (!S.chance) lastChance = null;
  if ((ambientIn -= dt) <= 0) {
    ambientIn = 15 + Math.random() * 20;
    const quiet = R.animals.filter((b) => b.st !== 'special');
    if (quiet.length) animalSound(quiet[Math.floor(Math.random() * quiet.length)], 'call', 0.35);
  }
  music.setBirds(G.clock(S).phase !== 3); // 밤에는 새소리를 끈다
}

// ---------- 시간 ----------
let acc = 0, lastSave = 0, lastUi = 0, hiddenAt = null;
function frame(now) {
  const dt = Math.min(0.25, (now - lastT) / 1000);
  lastT = now;
  acc += dt;
  let n = 0;
  while (acc >= G.STEP && n < 10) { G.step(S, G.STEP); acc -= G.STEP; n++; }
  if (n === 10) acc = 0;
  if (S.events.length) drainEvents();
  soundTick(dt);
  // 따라보기: 카메라가 그 동물을 부드럽게 따라간다
  if (UI.follow != null) {
    const a = S.regions[S.view].animals.find((b) => b.uid === UI.follow);
    if (!a) UI.follow = null;
    else {
      const tx = ((a.x - a.y) * T * ISO_A - uc) * zoom, ty = ((a.x + a.y) * T * ISO_B - vc) * zoom - 20 * zoom;
      UI.cam.x += (tx - UI.cam.x) * Math.min(1, dt * 4); UI.cam.y += (ty - UI.cam.y) * Math.min(1, dt * 4); clampCam();
    }
  }
  draw(dt);
  if (now - lastUi > 250) { lastUi = now; hud(); sheetUpdate?.(); if (UI.sel?.type === 'animal') updateCardLive(); updatePlacebar(); }
  if (now - lastSave > 5000) { lastSave = now; save(); }
  requestAnimationFrame(frame);
}
// 카드가 열려 있으면 상태 글자만 바꾼다(버튼은 그대로 둬서 누르는 중에 사라지지 않게)
function updateCardLive() {
  const a = S.regions[S.view].animals.find((b) => b.uid === UI.sel.uid), p = $('#card .card-top p');
  if (!a || !p) return;
  const st = G.stats(S, S.view), d = SPECIES[a.sp];
  setText(p, `${d.size} ${SIZE[d.size].name} · 행복도 ${Math.round(st.happy[a.sp] * 100)}% · ${stateText(a)}`);
}
// 화면을 떠났다 돌아오면 그동안의 관람 수익을 정산한다(보던 지역, 최대 30분치)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); save(); music.pause(); return; }
  music.resume();
  if (hiddenAt && S) {
    const r = G.settleOffline(S, Date.now()), sec = (Date.now() - hiddenAt) / 1000;
    if (sec > 30 && r.gain >= 1) toast(`자리를 비운 동안 ⭐+${fmt(r.gain)}`);
    hiddenAt = null; lastT = performance.now();
  }
});
window.addEventListener('pagehide', save);

function welcome() {
  modal(`<h2>🦒 Animal World</h2><p>동물을 입양하고 지역을 꾸며 <b>발전도</b>를 올려요.</p><ul><li>입양과 꾸미기는 <b>⭐ 인기점수</b>로 해요</li><li>동물을 탭하면 필요한 것(먹이·물·쉼터·무리)이 보여요</li><li>✨가 뜬 동물을 탭하면 사진을 찍고 인기점수를 받아요</li><li>발전도가 기준을 넘으면 티어가 올라 더 많은 동물을 키울 수 있어요</li></ul>`);
}
function start() {
  S = load();
  const fresh = !S;
  if (fresh) S = G.newGame((Date.now() % 1e9) | 0, Date.now());
  UI.seen = loadSeen();
  syncSoundBtns();
  resize();
  UI.seen.regions[S.view] = true;
  if (fresh) welcome();
  else {
    const r = G.settleOffline(S, Date.now());
    if (r.sec >= 60 && r.gain >= 1) modal(`<h2>다시 오셨네요!</h2><p>자리를 비운 ${r.sec >= 5400 ? `${Math.round(r.sec / 3600)}시간` : `${Math.round(r.sec / 60)}분`} 동안 ${G.regionDef(S.view).name}에 관람객이 다녀갔어요.</p><p style="font-size:22px">⭐ +${fmt(r.gain)}</p>${r.capped ? '<p style="color:var(--muted);font-size:12px">쉬는 동안은 지역마다 최대 30분치까지 쌓여요</p>' : ''}`);
  }
  hud();
  save();
  lastT = performance.now();
  requestAnimationFrame(frame);
}
// 독립 실행에서만 오프라인 캐시(서비스 워커)를 켠다
if ('serviceWorker' in navigator && !window.claude && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
// 새 버전 서비스 워커가 이 화면을 넘겨받으면 저장하고 한 번 다시 연다(새 파일로 실행). 처음 설치(이전 워커 없음)에는 다시 열지 않는다
if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading) return; reloading = true; save(); location.reload(); });
}
start();
</script>
</body>
</html>
