<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퀴즈퀴즈 2026</title>
<meta name="theme-color" content="#0b0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="퀴즈퀴즈 2026">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root { color-scheme: dark; --a: #ff8a2a; --a2: #b9561a; --b: #4cc3ff; --b2: #1f78b8; --gold: #f5c84a; --gold2: #fff2b0; --ink: #0C0C1A; --panel: #1b1838; --panel2: #2a2558; --text: #fffaf0; --muted: #b8b2dc; --good: #7dffb0; --bad: #ff6f7d; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--text); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; user-select: none; -webkit-user-select: none; word-break: keep-all; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
.hide { display: none !important; }

/* 480×270 화면 하나를 통째로 키운다(main.js가 --s를 정한다) */
#screen { position: absolute; left: 50%; top: 50%; width: 480px; height: 270px; transform: translate(-50%, -50%) scale(var(--s, 1)); overflow: hidden; background: var(--ink); }
#view, #logo { position: absolute; inset: 0; width: 480px; height: 270px; image-rendering: pixelated; image-rendering: crisp-edges; }
#static { position: absolute; inset: 0; z-index: 49; pointer-events: none; opacity: 0; background: repeating-linear-gradient(0deg, #fff1 0 1px, #0000 1px 3px), repeating-linear-gradient(90deg, #ffffff12 0 2px, #0000 2px 5px); mix-blend-mode: screen; }
#static.on { animation: staticFx .45s steps(6) 1; }
@keyframes staticFx { 0% { opacity: .9; background-position: 0 0; } 50% { opacity: .7; background-position: 7px 13px; } 100% { opacity: 0; background-position: 3px 29px; } }

.layer { position: absolute; inset: 0; }
.outline { text-shadow: 0 1px 0 #000, 1px 0 0 #000, 0 -1px 0 #000, -1px 0 0 #000, 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 6px 12px; border-radius: 6px; background: var(--gold); color: #2a1600; font-weight: 900; font-size: 12px; box-shadow: 0 3px 0 #7a5214; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #7a5214; }
.btn.sub { background: var(--panel2); color: var(--text); box-shadow: 0 3px 0 #0e0c22; }
.btn.small { padding: 4px 8px; font-size: 10px; }

/* 타이틀 */
#title .menu { position: absolute; left: 0; right: 0; top: 150px; display: flex; flex-direction: column; align-items: center; gap: 7px; }
#title .menu .btn { width: 130px; }
#title .ko { position: absolute; left: 0; right: 0; top: 132px; text-align: center; font-size: 13px; font-weight: 900; color: var(--gold2); letter-spacing: 2px; }
#teamBadge { position: absolute; left: 8px; bottom: 8px; padding: 5px 8px; border-radius: 6px; background: rgba(11,10,20,.82); font-size: 9.5px; line-height: 1.45; border: 1px solid #ffffff22; }
#teamBadge b { color: var(--gold); font-size: 11px; }
#gear { position: absolute; right: 8px; top: 8px; }

/* 판 + 설정 공통 패널 */
.sheet { position: absolute; inset: 10px 14px; border-radius: 10px; background: rgba(20,17,44,.96); border: 2px solid var(--gold); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; z-index: 30; }
.sheet h2 { margin: 0; font-size: 15px; color: var(--gold2); text-align: center; }
.sheet p { margin: 0; font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.45; }
.row { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
.duoCard { width: 120px; padding: 6px; border-radius: 8px; background: var(--panel2); border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; }
.duoCard canvas { width: 100px; height: 88px; image-rendering: pixelated; border-radius: 4px; }
.duoCard small { color: var(--muted); font-weight: 600; font-size: 9.5px; }
.duoCard.on { border-color: var(--gold); }
#teamCards.nudge .duoCard { animation: shake .3s 2; }
.pickHint { font-size: 10.5px; color: var(--gold); font-weight: 900; }
.pickHint.ok { color: var(--good); }
.duoCard:disabled { opacity: .35; }
.pick { padding: 5px 10px; border-radius: 6px; background: var(--panel2); font-size: 11px; font-weight: 800; border: 2px solid transparent; }
.pick.on { border-color: var(--gold); background: #3b3478; }
.pick small { display: block; font-size: 8.5px; color: var(--muted); font-weight: 600; }
.skillQuip { font-size: 10px !important; color: var(--gold2) !important; font-style: italic; min-height: 14px; }
.setRow { display: flex; align-items: center; justify-content: space-between; font-size: 11px; padding: 3px 0; border-bottom: 1px solid #ffffff14; }
.toggle { width: 44px; padding: 3px 0; border-radius: 10px; background: #3a3560; font-size: 10px; font-weight: 800; }
.toggle.on { background: var(--good); color: #0a2a18; }
.danger { background: #5a1a24 !important; color: #ffd0d6 !important; box-shadow: 0 3px 0 #2a0a10 !important; }

/* 경기 화면: C '브라운관 대결형'(2026-11-14 대니님 확정) */
#hud { position: absolute; left: 0; right: 0; top: 0; height: 46px; z-index: 10; pointer-events: none; }
.score { position: absolute; top: 7px; display: flex; align-items: center; gap: 4px; }
.score.a { left: 8px; } .score.b { right: 8px; flex-direction: row-reverse; }
.score .who { font-size: 8px; font-weight: 900; line-height: 1.15; color: #fff; text-align: center; padding: 2px 4px; border-radius: 3px; }
.score.a .who { background: var(--a); color: #2a1200; } .score.b .who { background: var(--b); color: #00202e; }
.score .who b { display: block; font-size: 8.5px; white-space: nowrap; max-width: 64px; overflow: hidden; text-overflow: ellipsis; }
.score .num { font: 900 18px/1 ui-monospace, Menlo, monospace; color: #ffd23a; display: flex; gap: 2px; }
.score .num span { display: inline-block; width: 15px; padding: 3px 0 2px; background: linear-gradient(#26264a 50%, #1a1a36 50%); border: 1px solid #000; border-radius: 3px; text-align: center; box-shadow: inset 0 -1px 0 #0006; }
.score .num span.flip { animation: flip .35s ease-out; }
@keyframes flip { 0% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
#timer { position: absolute; left: 221px; top: 4px; width: 38px; height: 38px; border-radius: 50%; z-index: 11; display: flex; align-items: center; justify-content: center; flex-direction: column; background: conic-gradient(#e8302f calc(var(--p, 1) * 360deg), #ffffff calc(var(--p, 1) * 360deg)); box-shadow: 0 0 0 2px #0c0c1a; }
#timer::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #ffd23a; }
#timer b { position: relative; font: 900 15px/1 ui-monospace, Menlo, monospace; color: #0c0c1a; }
#timer small { position: relative; font-size: 7px; font-weight: 900; color: #0c0c1a; }
#timer.off b { font-size: 11px; }
#partLabel { position: absolute; left: 50%; top: 43px; transform: translateX(-50%); padding: 1px 8px; border-radius: 3px; background: #0c0c1acc; font-size: 8.5px; font-weight: 900; color: var(--gold); white-space: nowrap; z-index: 10; }

#card { position: absolute; left: 116px; top: 62px; width: 248px; min-height: 86px; padding: 14px 10px 8px; border-radius: 6px; background: #ffffff; color: #0c0c1a; box-shadow: 0 0 0 3px #2f5bea, 0 0 0 5px #0c0c1a, 0 4px 0 5px #1c348c; z-index: 9; transform-origin: 50% 0; display: flex; flex-direction: column; justify-content: center; }
#card.pop { animation: cardIn .35s cubic-bezier(.3,1.6,.6,1); }
@keyframes cardIn { 0% { transform: scale(.3) rotate(-8deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
#cardTop { position: absolute; left: -3px; top: -11px; right: -3px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
#cardTag { padding: 2px 8px; border-radius: 4px 4px 0 0; background: #2f5bea; color: #fff; font-size: 9.5px; font-weight: 900; }
#cardTag .stars { color: #ffd23a; margin-left: 3px; }
#turnChip { padding: 2px 7px; border-radius: 4px; font-size: 9px; font-weight: 900; border: 2px solid #0c0c1a; }
#turnChip.a { background: var(--a); color: #2a1200; } #turnChip.b { background: var(--b); color: #00202e; }
#turnChip.flash { animation: flash .5s 2; }
@keyframes flash { 50% { transform: scale(1.18); } }
#qText { font-size: 15px; font-weight: 900; line-height: 1.32; text-align: center; letter-spacing: -.2px; }
#qText b { color: #e8302f; text-decoration: underline; }
#hintLine { margin-top: 3px; font-size: 12px; font-weight: 900; color: #2f5bea; letter-spacing: 3px; text-align: center; }

#panel { position: absolute; left: 116px; top: 156px; width: 248px; height: 104px; z-index: 9; border-radius: 7px; padding: 4px; display: flex; flex-direction: column; gap: 4px; background: #0c0c1aee; border: 2px solid #ffffff22; }
#panel.a { border-color: var(--a); } #panel.b { border-color: var(--b); }
#panel.wait .choice:not(.out) { filter: saturate(.75); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; flex: 1; }
.choice { border-radius: 6px; color: #0c0c1a; font-size: 13.5px; font-weight: 900; padding: 2px 6px; line-height: 1.15; display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 0; border: 2px solid #0c0c1a; box-shadow: inset 0 -3px 0 #0003; position: relative; }
.choice i { position: absolute; left: 3px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: #0c0c1a; color: #fff; font-style: normal; font-size: 8px; display: inline-flex; align-items: center; justify-content: center; }
.choice.c0 { background: #e8302f; color: #fff; } .choice.c1 { background: #ffd23a; } .choice.c2 { background: #2f5bea; color: #fff; } .choice.c3 { background: #2fbf5a; }
.choice.out { background: repeating-linear-gradient(45deg, #3a3a50 0 4px, #44445c 4px 8px); color: #77778f; text-decoration: line-through; box-shadow: none; }
.choice.pickA { outline: 3px solid var(--a); } .choice.pickB { outline: 3px solid var(--b); }
.choice.right { background: #fff; color: #1a7a3a; outline: 3px solid #2fbf5a; }
.choice.wrongPick { animation: shake .3s 2; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.slot { height: 24px; border-radius: 4px; background: #fff; color: #0c0c1a; font-size: 15px; font-weight: 900; display: flex; align-items: center; justify-content: center; letter-spacing: 2px; border: 2px solid #0c0c1a; }
.slot.empty { color: #9a9ab0; font-size: 10px; letter-spacing: 0; }
.tiles { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; flex: 1; align-content: center; }
.tile { width: 22px; height: 22px; border-radius: 4px; background: #ffd23a; color: #0c0c1a; font-size: 13px; font-weight: 900; border: 2px solid #0c0c1a; }
.tile:disabled { background: #3a3a50; color: #6d6d88; border-color: #3a3a50; }
.keys { display: flex; gap: 4px; justify-content: center; }
.keys .btn { padding: 3px 9px; font-size: 10.5px; }
.pad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; flex: 1; }
.pad button { border-radius: 4px; background: #ffd23a; color: #0c0c1a; font-weight: 900; font-size: 13px; border: 2px solid #0c0c1a; }

#reveal { position: absolute; left: 116px; top: 156px; width: 248px; z-index: 12; border-radius: 7px; background: #fff; color: #0c0c1a; padding: 6px 9px; box-shadow: 0 0 0 3px #2fbf5a, 0 0 0 5px #0c0c1a; }
#reveal .ans { font-size: 13px; font-weight: 900; color: #e8302f; }
#reveal .ex { font-size: 10px; line-height: 1.45; margin-top: 3px; font-weight: 600; }
#reveal .row { justify-content: flex-end; margin-top: 4px; }

.bubble { position: absolute; z-index: 20; max-width: 200px; padding: 5px 8px; border-radius: 8px; background: #fff; color: #0c0c1a; font-size: 10.5px; font-weight: 800; line-height: 1.35; border: 2px solid #0c0c1a; pointer-events: none; }
.bubble::after { content: ''; position: absolute; top: -6px; left: var(--tail, 14px); border: 5px solid transparent; border-bottom-color: #0c0c1a; border-top: 0; }
.bubble.down::after { top: auto; bottom: -6px; border-bottom: 0; border-top: 5px solid #0c0c1a; }
.bubble.cpu { background: #e8e4ff; font-style: italic; font-weight: 700; }
.bubble.team { max-width: 108px; }

/* 한글 예능 자막: 두꺼운 외곽선 */
#caption { position: absolute; left: 0; right: 0; top: 100px; text-align: center; z-index: 25; pointer-events: none; font-size: 30px; font-weight: 900; color: #ffd23a; letter-spacing: 1px; -webkit-text-stroke: 6px #0c0c1a; paint-order: stroke fill; text-shadow: 0 4px 0 #e8302f; }
#caption.vs { font-size: 46px; color: #fff; text-shadow: 0 5px 0 #e8302f, 0 -3px 0 #2f5bea; }
#caption.go { animation: capIn 1.4s ease-out both; }
#game.closeup #card, #game.closeup #panel, #game.closeup #timer, #game.closeup #partLabel { visibility: hidden; }
#game.closeup #caption { top: 30px; }
#caption.side0, #caption.side1 { top: 64px; width: 124px; font-size: 22px; }
#caption.side0 { left: 0; right: auto; } #caption.side1 { left: auto; right: 0; }
#caption small { display: block; font-size: 13px; color: #fff; margin-top: 4px; -webkit-text-stroke: 4px #0c0c1a; text-shadow: none; }
@keyframes capIn { 0% { transform: scale(2.4); opacity: 0; } 18% { transform: scale(.9); opacity: 1; } 26% { transform: scale(1.05); } 32%, 80% { transform: scale(1); opacity: 1; } 100% { transform: translateY(-6px); opacity: 0; } }

#wheel { position: absolute; left: 165px; top: 160px; width: 150px; z-index: 12; text-align: center; padding: 7px; border-radius: 8px; background: #0c0c1aee; border: 3px solid #ffd23a; }
#wheel .lab { font-size: 9.5px; color: var(--muted); font-weight: 800; }
#wheel .cat { font-size: 22px; font-weight: 900; color: #ffd23a; margin-top: 2px; -webkit-text-stroke: 3px #0c0c1a; paint-order: stroke fill; }

#board { position: absolute; left: 112px; top: 62px; width: 256px; z-index: 11; padding: 5px; border-radius: 7px; background: #0c0c1aee; border: 3px solid #2f5bea; }
#board .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
#board .head { font-size: 8.5px; font-weight: 900; text-align: center; color: #fff; padding: 2px 0; border-radius: 3px; }
#board .head:nth-child(1) { background: #e8302f; } #board .head:nth-child(2) { background: #c8920e; } #board .head:nth-child(3) { background: #2f5bea; }
#board .head:nth-child(4) { background: #2fbf5a; } #board .head:nth-child(5) { background: #ff7a1a; } #board .head:nth-child(6) { background: #8a4fd8; }
#board .cell { height: 36px; border-radius: 4px; background: linear-gradient(#ffd23a 50%, #f0c020 50%); border: 2px solid #0c0c1a; font: 900 13px/1 ui-monospace, Menlo, monospace; color: #0c0c1a; }
#board .cell.A { background: var(--a); color: #2a1200; } #board .cell.B { background: var(--b); color: #00202e; }
#board .cell.none { background: #3a3a50; color: #6a6888; }
#board .cell.hot { outline: 3px solid #fff; animation: flash .4s 3; }
#board .note { font-size: 9.5px; text-align: center; margin-top: 4px; font-weight: 800; }

#trophy { display: block; margin: 0 auto -4px; width: 48px; height: 48px; image-rendering: pixelated; }
#sfxCheck .sheet { inset: 6px 8px; }
.sfxGroup { width: 100%; font-size: 11px; font-weight: 900; color: var(--gold); margin-top: 4px; }
#sfxList .pick { padding: 3px 7px; font-size: 10px; }
#awards .sheet { inset: 6px 70px; gap: 5px; }
.big { font-size: 22px; font-weight: 900; text-align: center; color: var(--gold2); }
.scene { font-size: 10px; background: var(--panel2); border-radius: 6px; padding: 5px 8px; line-height: 1.45; }
.scene b { color: var(--gold); }
.record { font-size: 10px; text-align: center; color: var(--muted); }
.record b { color: var(--text); }
.titleUp { text-align: center; font-size: 12px; font-weight: 900; color: var(--good); }

#rotate { position: fixed; inset: 0; z-index: 100; background: #0b0a14; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-size: 18px; font-weight: 900; color: var(--gold2); }
#rotate .phone { width: 46px; height: 80px; border: 5px solid var(--gold); border-radius: 8px; animation: rot 2s ease-in-out infinite; image-rendering: pixelated; }
@keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="screen">
  <canvas id="view" width="480" height="270"></canvas>
  <canvas id="logo" width="480" height="270" class="hide"></canvas>

  <!-- 타이틀 -->
  <div id="title" class="layer hide">
    <div class="ko outline">퀴즈퀴즈 2026</div>
    <div class="menu">
      <button class="btn" id="soloBtn">혼자 하기</button>
      <button class="btn" id="duoBtn">둘이 하기</button>
    </div>
    <div id="teamBadge"></div>
    <button class="btn sub small" id="gear">설정</button>
  </div>

  <!-- 팀 고르기(처음 실행) -->
  <div id="teamPick" class="layer hide">
    <div class="sheet">
      <h2>우리 팀을 골라 주세요</h2>
      <p>이길수록 칭호가 올라요. 팀은 설정의 "팀 리셋"으로만 바꿔요.</p>
      <div class="row" id="teamCards"></div>
      <div class="row"><span class="pickHint" id="teamHint">위에서 팀을 눌러 골라 주세요</span><button class="btn" id="teamOk">이 팀으로 출전!</button></div>
    </div>
  </div>

  <!-- 판 준비 -->
  <div id="setup" class="layer hide">
    <div class="sheet">
      <h2 id="setupTitle">혼자 하기</h2>
      <div id="setupBody"></div>
      <div class="row"><button class="btn sub" id="setupBack">뒤로</button><button class="btn" id="setupGo">시작!</button></div>
    </div>
  </div>

  <!-- 설정 -->
  <div id="settings" class="layer hide">
    <div class="sheet">
      <h2>설정</h2>
      <div id="setList"></div>
      <div class="row"><button class="btn sub" id="resetTeam">팀 리셋</button><button class="btn" id="setClose">닫기</button></div>
    </div>
  </div>

  <!-- 경기 -->
  <div id="game" class="layer hide">
    <div id="hud">
      <div class="score a" id="scoreA"><div class="who">A팀 ▲<b id="nameA"></b></div><div class="num" id="numA"></div></div>
      <div class="score b" id="scoreB"><div class="who">● B팀<b id="nameB"></b></div><div class="num" id="numB"></div></div>
    </div>
    <div id="timer" class="hide"><b id="timerNum">15</b><small>초</small></div>
    <div id="partLabel"></div>
    <div id="card" class="hide"><div id="cardTop"><span id="cardTag"><span id="cardCat"></span><span class="stars" id="cardStars"></span></span><span id="turnChip"></span></div><div id="qText"></div><div id="hintLine" class="hide"></div></div>
        <div id="panel" class="hide"></div>
    <div id="reveal" class="hide"></div>
    <div id="wheel" class="hide"><div class="lab">분야 돌림판</div><div class="cat" id="wheelCat"></div></div>
    <div id="board" class="hide"></div>
    <div id="caption" class="outline"></div>
  </div>

  <!-- 효과음 점검(?sfx=1) -->
  <div id="sfxCheck" class="layer hide">
    <div class="sheet" style="overflow:auto">
      <h2>효과음 점검</h2>
      <p>눌러서 들어 보세요. 모두 사각파·삼각파·노이즈로 합성한 칩튠이에요.</p>
      <div class="row" id="sfxList" style="justify-content:flex-start;gap:4px"></div>
      <div class="row"><button class="btn sub" id="musicToggle">배경 음악 듣기</button><button class="btn sub" id="musicNext">다음 곡</button><span id="musicName"></span></div>
    </div>
  </div>

  <div id="awards" class="layer hide"><div class="sheet" id="awardsBody"></div></div>
  <div id="bubbles" class="layer" style="pointer-events:none"></div>
  <div id="static"></div>
</div>
<div id="rotate"><div class="phone"></div>가로로 돌려 주세요</div>
<script type="module" src="main.js"></script>
</body>
</html>
