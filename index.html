<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danny Game Center</title>
<meta name="theme-color" content="#0e1117">
<style>
  :root { color-scheme: dark; --ink: #0e1117; --panel: #181c24; --line: #343b48; --text: #ece6da; --muted: #98a1ac; --amber: #f2a93b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--ink); color: var(--text); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; padding: 32px 16px; }
  main { max-width: 520px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .01em; }
  p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 14px; }
  a.game { display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: inherit; text-decoration: none; }
  a.game:hover, a.game:focus-visible { border-color: var(--amber); }
  a.game img { width: 72px; height: 72px; border-radius: 16px; }
  a.game b { display: block; font-size: 17px; margin-bottom: 4px; }
  .hint { font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Danny Game Center</h1>
  <p>by Danny Soft</p>
  <p>대니의 게임 모음이에요. 휴대폰에서 열고 브라우저 메뉴의 <b>홈 화면에 추가</b>를 누르면 앱처럼 설치돼요(인터넷 없이도 실행).</p>
  <a class="game" href="games/zombie-outpost/">
    <img src="games/zombie-outpost/icons/icon-192.png" alt="">
    <span><b>Zombie Outpost</b><p>무너진 도시의 끝, 마지막 불빛을 지켜라. 세로 화면 쿼터뷰 좀비 서바이벌. 필드에서 싸우고 파밍해 기지를 키우고, 동료를 구해 전진기지를 늘려요. 쓰러지면 처음부터(로그라이크).</p></span>
  </a>
  <p class="hint">저장은 기기마다 그 브라우저(또는 설치한 앱)에 따로 남아요.</p>
</main>
</body>
</html>
